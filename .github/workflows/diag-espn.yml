name: diag-espn
on:
  push:
    branches: [diag-espn]
    paths: ['diag/probe.mjs']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node diag/probe.mjs
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A diag && git commit -q -m "diag: ESPN payloads 3" && git push -q origin HEAD:diag-espn
