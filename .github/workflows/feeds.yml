name: Data feeds
# Public sports data for TheDesk (scores, closing lines, officials) → the `feeds` branch, one commit, replaced each run.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['feeds/**', '.github/workflows/feeds.yml']
permissions:
  contents: write
concurrency:
  group: feeds
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: feeds
      - name: The feeds so far
        run: |
          mkdir -p out
          if git fetch -q --depth=1 origin feeds; then git archive FETCH_HEAD | tar -x -C out; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node feeds/build.mjs out
      - name: Publish to the feeds branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q
          git config user.name "TheDesk feeds"
          git config user.email "feeds@users.noreply.github.com"
          git checkout -q -b feeds
          git add -A
          git commit -q -m "Feeds $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" feeds
