name: Telegram autopilot
on:
  schedule:
    - cron: '*/10 * * * *'
    - cron: '7 13,14 * * *'   # v2.82 · wake for lounge hours (8:07 AM Central in summer and in winter)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['autopilot/**', '.github/workflows/tg-autopilot.yml']
permissions:
  contents: write
  actions: write   # v2.33 · the relay: a live slate starts its own next run (GitHub's schedule only fires every few hours)
concurrency:
  group: tg-autopilot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: autopilot
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: autopilot/package-lock.json
      - run: npm ci --prefix autopilot --no-audit --no-fund   # v2.98 · the picture-card renderer (satori + resvg) and its fonts
        continue-on-error: true   # no renderer → the posts still go out, as words
      - run: node autopilot/worker.mjs
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          AUTOPILOT_KEY: ${{ secrets.AUTOPILOT_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELAY: ${{ vars.RELAY }}   # set the repo variable RELAY=off to stop the live-slate relay
          LOUNGE: ${{ vars.LOUNGE }}   # v2.82 · lounge hours, Central: "8-24" when unset, "0-24" round the clock, "off" = game time only
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}        # v2.97 · TheDesk's Facebook page — mirrors the public posts; off until both are set
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}  # a page access token (pages_manage_posts); masked in the logs, never printed
          LOUNGE_URL: ${{ vars.LOUNGE_URL }}           # the lounge's link, used only in the easter eggs (default https://t.me/TheDeskLounge)
          IG_USER_ID: ${{ secrets.IG_USER_ID }}        # v2.98 · the Instagram professional account linked to the page — off until set (posts with FB_PAGE_TOKEN)
          IG_KINDS: ${{ vars.IG_KINDS }}               # which posts Instagram gets: "unlock,recap,cash,invite,spotlight" when unset, "all" for every result too
          SPOTLIGHT: ${{ vars.SPOTLIGHT }}             # v2.98 · Player of the Week + the Terrible 3: teaser when unset (legs unlock at T-30), "full", or "off"
          MEGAPHONE: ${{ vars.MEGAPHONE }}             # v2.99 · a post every 30 min (game questions + polls, streaks, line movers, receipts, the goal) — "off" stops it
          MEGA_HOURS: ${{ vars.MEGA_HOURS }}           # posting hours, Central: "9-23" when unset
          MEGA_EVERY: ${{ vars.MEGA_EVERY }}           # minutes between posts: 30 when unset
          MEGA_GOAL: ${{ vars.MEGA_GOAL }}             # reactions that drop the free card early: 100 when unset, "off" for no goal posts
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}  # v2.98 · Threads — off until set; the worker refreshes it weekly and keeps it encrypted
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}  # optional (the token's own account when unset)
          X_API_KEY: ${{ secrets.X_API_KEY }}          # v3.1.3 · X (Twitter) — off until all four are set; X bills per post (~$0.20 with a link)
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}  # the account's token, made with Read and Write
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_KINDS: ${{ vars.X_KINDS }}                 # which posts X gets: "recap,egg" when unset (keeps the bill small), "all" for everything
          APP_URL: ${{ vars.APP_URL }}                 # v3.1.3 · the public app every post points to (default https://ironsilkweekly.com/desk/)
          LOUNGE_CAP: ${{ vars.LOUNGE_CAP }}           # v3.1.3 · seats before the public lounge locks and becomes the VIP lounge (100 when unset)
