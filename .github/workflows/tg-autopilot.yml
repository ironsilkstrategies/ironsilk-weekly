name: Telegram autopilot
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['autopilot/**', '.github/workflows/tg-autopilot.yml']
permissions:
  contents: write
  actions: write   # v2.33 · the relay: a live slate starts its own next run (GitHub's schedule only fires every few hours)
concurrency:
  group: tg-autopilot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: autopilot
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node autopilot/worker.mjs
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          AUTOPILOT_KEY: ${{ secrets.AUTOPILOT_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELAY: ${{ vars.RELAY }}   # set the repo variable RELAY=off to stop the live-slate relay
