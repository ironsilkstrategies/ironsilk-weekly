<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Desk — Modern Handicapping Station</title>
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: #121824;
      --border: #1e293b;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --green: #22c55e;
      --red: #ef4444;
      --gold: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
      line-height: 1.5;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.025em; }
    .nav-actions { display: flex; gap: 12px; }

    button {
      background: #1e293b;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    button:hover { background: #334155; border-color: var(--accent); }
    button.primary { background: var(--accent); color: #0f172a; border: none; font-weight: 600; }
    button.primary:hover { opacity: 0.9; }

    .grid-layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 24px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .card h3 {
      font-size: 1.1rem;
      margin-bottom: 16px;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sim-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 16px;
      margin-top: 12px;
    }

    .sim-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .badge {
      background: #1e293b;
      color: var(--accent);
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .sim-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 12px;
    }

    .sim-team span {
      display: block;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .sim-edge {
      padding: 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.05);
      font-size: 0.875rem;
      font-weight: 600;
      text-align: center;
    }
    .sim-edge.positive-edge {
      background: rgba(34, 197, 94, 0.1);
      color: var(--green);
      border: 1px solid rgba(34, 197, 94, 0.2);
    }

    .ticket-card {
      background: #0f172a;
      border-left: 4px solid var(--border);
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 10px;
    }
    .ticket-card.status-win { border-left-color: var(--green); }
    .ticket-card.status-loss { border-left-color: var(--red); }
    .ticket-card.status-push { border-left-color: var(--gold); }

    .ticket-header { display: flex; justify-content: space-between; font-weight: 600; }
    .ticket-details { font-size: 0.85rem; color: var(--text-muted); margin: 6px 0; display: flex; gap: 12px; }
    .ticket-actions { display: flex; gap: 6px; margin-top: 8px; }
    .ticket-actions button { padding: 4px 8px; font-size: 0.75rem; }

    input, select {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      width: 100%;
      margin-bottom: 12px;
    }

    .empty-state { color: var(--text-muted); font-size: 0.875rem; text-align: center; padding: 20px 0; }
  </style>
</head>
<body>

  <header>
    <h1>TheDesk <span style="font-size: 0.8rem; color: var(--accent);">v30</span></h1>
    <div class="nav-actions">
      <button onclick="exportBackup()">Export Backup</button>
      <button class="primary" onclick="loadOdds()">Refresh Market</button>
    </div>
  </header>

  <div class="grid-layout">
    <main>
      <div class="card">
        <h3>
          Monte Carlo Matchup Simulations
          <button onclick="runSimulations()">Run All Games</button>
        </h3>
        <div id="sim-container">
          <div class="empty-state">Load odds and click run to trigger simulations.</div>
        </div>
      </div>

      <div class="card">
        <h3>Vision Line Extraction (Screenshot Upload)</h3>
        <input type="file" id="vision-input" accept="image/*" onchange="handleVisionUpload(event)">
        <div id="vision-output" style="font-family: monospace; font-size: 0.85rem; color: var(--accent); white-space: pre-wrap;"></div>
      </div>
    </main>

    <aside>
      <div class="card">
        <h3>Log Betting Ticket</h3>
        <input type="text" id="tkt-selection" placeholder="Selection (e.g., NYY -130)">
        <input type="number" id="tkt-risk" placeholder="Risk Amount ($)">
        <input type="number" id="tkt-towin" placeholder="To Win ($)">
        <input type="number" id="tkt-edge" placeholder="Model Edge (%)">
        <button class="primary" style="width: 100%;" onclick="submitTicket()">Add Ticket</button>
      </div>

      <div class="card">
        <h3>Active Bets & History</h3>
        <div id="ticket-list"></div>
      </div>
    </aside>
  </div>

  <script>
    // --- LOCAL STORAGE KEYS ---
    const LS = {
      key: 'desk_api_key',
      ai: 'desk_anthropic_key',
      sharp: 'desk_sharp_key',
      rundown: 'desk_rundown_key',
      oddspapi: 'desk_odds_api_key',
      ghtoken: 'desk_gh_token',
      odds: 'desk_odds_cache',
      oddsdate: 'desk_odds_date',
      open: 'desk_open_line'
    };

    // --- CACHE & STATE ---
    let SIM_CACHE = {};
    let ODDS = {};
    let ODDS_BYDATE = {};

    function get(key, defaultValue) {
      try {
        const val = localStorage.getItem(key);
        return val ? JSON.parse(val) : defaultValue;
      } catch (e) {
        return defaultValue;
      }
    }

    function set(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) {
        console.error('LocalStorage write error', e);
      }
    }

    function today() {
      return new Date().toISOString().split('T')[0];
    }

    // --- MONTE CARLO ENGINE ---
    function poissonDraw(lambda) {
      let L = Math.exp(-lambda);
      let k = 0;
      let p = 1;
      do {
        k++;
        p *= Math.random();
      } while (p > L);
      return k - 1;
    }

    function simGame(homeTeam, awayTeam, iterations = 10000) {
      let homeWins = 0;
      let awayWins = 0;
      let totalHomeRuns = 0;
      let totalAwayRuns = 0;

      // Base run expectations
      const baseHomeExp = 4.5;
      const baseAwayExp = 4.2;

      for (let i = 0; i < iterations; i++) {
        const hRuns = poissonDraw(baseHomeExp);
        const aRuns = poissonDraw(baseAwayExp);

        totalHomeRuns += hRuns;
        totalAwayRuns += aRuns;

        if (hRuns > aRuns) homeWins++;
        else if (aRuns > hRuns) awayWins++;
        else Math.random() > 0.5 ? homeWins++ : awayWins++; // Extra innings tiebreaker
      }

      return {
        gameId: `${awayTeam}-${homeTeam}-${today()}`,
        homeTeam,
        awayTeam,
        iterations,
        homeWins,
        awayWins,
        homeProjRuns: totalHomeRuns / iterations,
        awayProjRuns: totalAwayRuns / iterations,
        marketHomeOdds: -125,
        weather: { temp: 72, windSpeed: 8, windDir: 'Out to CF' }
      };
    }

    function runSimulations() {
      const matchups = [
        { home: 'Yankees', away: 'Red Sox' },
        { home: 'Dodgers', away: 'Giants' },
        { home: 'Cubs', away: 'Cardinals' }
      ];

      const container = document.getElementById('sim-container');
      container.innerHTML = '';

      matchups.forEach(m => {
        const sim = simGame(m.home, m.away);
        SIM_CACHE[sim.gameId] = sim;
        renderSimResults(sim.gameId, container);
      });
    }

    // --- ODDS MANAGEMENT ---
    async function loadOdds() {
      try {
        const snap = get(LS.odds, {
          'Red Sox-Yankees-today': { home: 'Yankees', away: 'Red Sox', homeOdds: -125 }
        });
        const byDate = today();

        ODDS = snap;
        set(LS.odds, { d: today(), v: snap });
        ODDS_BYDATE = byDate;
        set(LS.oddsdate, byDate);

        const o = get(LS.open, {});
        for (const k in snap) {
          if (!o[k]) o[k] = snap[k];
        }
        set(LS.open, o);

        runSimulations();
        return snap;
      } catch (err) {
        console.error('Failed to load odds payload:', err);
        return {};
      }
    }

    function buildProps(gameId, sd) {
      const g = SIM_CACHE[gameId] || {};
      if (!g[sd]) return [];
      
      const lu = (g[sd] && Array.isArray(g[sd].lineup)) ? g[sd].lineup.slice(0, 9) : [];
      return lu.map(player => ({
        id: player.id || `${sd}-${player.name}`,
        name: player.name,
        pos: player.pos || 'DH',
        projHits: (player.projHits || 0).toFixed(2),
        projHR: (player.projHR || 0).toFixed(2),
        projTotalBases: (player.projTotalBases || 0).toFixed(2)
      }));
    }

    function renderSimResults(gameId, targetContainer) {
      const sim = SIM_CACHE[gameId];
      if (!sim) return;

      const container = targetContainer || document.getElementById('sim-container');
      const homeProb = (sim.homeWins / sim.iterations) * 100;
      const awayProb = (sim.awayWins / sim.iterations) * 100;
      const homeEV = calculateEV(homeProb, sim.marketHomeOdds);

      const el = document.createElement('div');
      el.id = `sim-results-${gameId}`;
      el.className = 'sim-card';
      el.innerHTML = `
        <div class="sim-header">
          <h4>${sim.awayTeam} @ ${sim.homeTeam}</h4>
          <span class="badge">${sim.iterations.toLocaleString()} Runs | ${sim.weather.temp}°F</span>
        </div>
        <div class="sim-grid">
          <div class="sim-team">
            <strong>${sim.awayTeam}</strong>
            <span>Win Prob: ${awayProb.toFixed(1)}%</span>
            <span>Proj Runs: ${sim.awayProjRuns.toFixed(2)}</span>
          </div>
          <div class="sim-team">
            <strong>${sim.homeTeam}</strong>
            <span>Win Prob: ${homeProb.toFixed(1)}%</span>
            <span>Proj Runs: ${sim.homeProjRuns.toFixed(2)}</span>
          </div>
        </div>
        <div class="sim-edge ${homeEV > 0 ? 'positive-edge' : ''}">
          Model Edge (${sim.homeTeam}): ${homeEV.toFixed(2)}% EV
        </div>
      `;
      container.appendChild(el);
    }

    function oddsToImplied(americanOdds) {
      if (!americanOdds) return 50.0;
      return americanOdds > 0 
        ? (100 / (americanOdds + 100)) * 100 
        : (Math.abs(americanOdds) / (Math.abs(americanOdds) + 100)) * 100;
    }

    function calculateEV(modelProb, americanOdds) {
      if (!americanOdds) return 0;
      const decimalOdds = americanOdds > 0 
        ? (americanOdds / 100) + 1 
        : (100 / Math.abs(americanOdds)) + 1;
      const p = modelProb / 100;
      return ((p * (decimalOdds - 1)) - (1 - p)) * 100;
    }

    // --- VISION SCREENSHOT ANALYZER ---
    async function handleVisionUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (e) => {
        const base64 = e.target.result.split(',')[1];
        document.getElementById('vision-output').innerText = 'Analyzing image line data...';
        const result = await analyzeBookShots(base64);
        document.getElementById('vision-output').innerText = result || 'No structured line data returned.';
      };
      reader.readAsDataURL(file);
    }

    async function analyzeBookShots(base64Image) {
      const apiKey = get(LS.ai, '');
      if (!apiKey) {
        return 'Anthropic API key missing from local storage settings.';
      }

      try {
        const res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'x-api-key': apiKey,
            'anthropic-version': '2023-06-01',
            'content-type': 'application/json',
            'dangerously-allow-browser-user-api-call': 'true'
          },
          body: JSON.stringify({
            model: 'claude-sonnet-4-6',
            max_tokens: 1000,
            messages: [{
              role: 'user',
              content: [
                { type: 'image', source: { type: 'base64', media_type: 'image/png', data: base64Image } },
                { type: 'text', text: 'Extract betting market lines, teams, spread, total, and prices from this screenshot into clear text.' }
              ]
            }]
          })
        });
        const json = await res.json();
        return json.content?.[0]?.text;
      } catch (err) {
        console.error('Vision extraction error:', err);
        return 'Error processing image API request.';
      }
    }

    // --- BACKUP & EXPORT ---
    function backupData() {
      const raw = { ...localStorage };
      delete raw[LS.key];
      delete raw[LS.ai];
      delete raw[LS.sharp];
      delete raw[LS.rundown];
      delete raw[LS.oddspapi];
      delete raw[LS.ghtoken];
      return raw;
    }

    function exportBackup() {
      const data = backupData();
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `thedesk-backup-${today()}.json`;
      document.body.appendChild(a);
      a.click();
      
      setTimeout(() => {
        a.remove();
        URL.revokeObjectURL(url);
      }, 4000);
    }

    // --- TICKET TRACKER ---
    function submitTicket() {
      const selection = document.getElementById('tkt-selection').value;
      const risk = document.getElementById('tkt-risk').value;
      const toWin = document.getElementById('tkt-towin').value;
      const edge = document.getElementById('tkt-edge').value;

      if (!selection || !risk) return;

      addTicket({ selection, risk, toWin, edge });
      document.getElementById('tkt-selection').value = '';
      document.getElementById('tkt-risk').value = '';
      document.getElementById('tkt-towin').value = '';
      document.getElementById('tkt-edge').value = '';
    }

    function addTicket(ticket) {
      const tickets = get('desk_tickets', []);
      ticket.id = `tkt-${Date.now()}`;
      ticket.created = today();
      ticket.status = 'PENDING';
      tickets.push(ticket);
      set('desk_tickets', tickets);
      renderTickets();
    }

    function gradeTicket(id, result) {
      const tickets = get('desk_tickets', []);
      const idx = tickets.findIndex(t => t.id === id);
      if (idx !== -1) {
        tickets[idx].status = result;
        set('desk_tickets', tickets);
        renderTickets();
      }
    }

    function renderTickets() {
      const container = document.getElementById('ticket-list');
      if (!container) return;
      const tickets = get('desk_tickets', []);
      if (!tickets.length) {
        container.innerHTML = '<div class="empty-state">No tickets logged for today.</div>';
        return;
      }
      container.innerHTML = tickets.map(t => `
        <div class="ticket-card status-${t.status.toLowerCase()}">
          <div class="ticket-header">
            <span>${t.selection}</span>
            <span style="font-size: 0.75rem;">${t.status}</span>
          </div>
          <div class="ticket-details">
            <span>Risk: $${t.risk}</span>
            <span>Win: $${t.toWin}</span>
            <span>Edge: ${t.edge || 0}%</span>
          </div>
          ${t.status === 'PENDING' ? `
            <div class="ticket-actions">
              <button onclick="gradeTicket('${t.id}', 'WIN')">Win</button>
              <button onclick="gradeTicket('${t.id}', 'LOSS')">Loss</button>
              <button onclick="gradeTicket('${t.id}', 'PUSH')">Push</button>
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    // --- INITIALIZATION ---
    document.addEventListener('DOMContentLoaded', async () => {
      console.log('TheDesk v30 initialized.');
      await loadOdds();
      renderTickets();
    });
  </script>
</body>
</html>
