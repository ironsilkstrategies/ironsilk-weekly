<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>TheDesk</title>
<script>
/* Front door. One bookmark → the board you used last.
   Each sport lives on its own page; this just routes. */
(function(){
  var PAGES={mlb:'mlb.html',nfl:'nfl.html',ncaaf:'cfb.html'};
  var last='';try{last=localStorage.getItem('d4.activeSport')||''}catch(e){}
  var q=(location.search.match(/[?&]sport=(mlb|nfl|ncaaf|cfb)/)||[])[1];
  if(q==='cfb')q='ncaaf';
  var dest=PAGES[q||last];
  if(dest)location.replace(dest);
})();
</script>
<style>
  body{margin:0;min-height:100vh;background:#0d1117;color:#e6edf3;font-family:system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;box-sizing:border-box}
  h1{font-size:28px;font-weight:900;letter-spacing:.04em;margin:0 0 8px}
  a{display:block;width:min(320px,100%);padding:16px;border-radius:12px;background:#1c1c1c;color:#fff;
    text-decoration:none;font-weight:900;font-size:17px;text-align:center}
  a:active{background:#f0b74a;color:#000}
</style>
</head><body>
<h1>THEDESK</h1>
<a href="mlb.html">⚾ MLB</a>
<a href="nfl.html">🏈 NFL</a>
<a href="cfb.html">🏟 CFB</a>
</body></html>
