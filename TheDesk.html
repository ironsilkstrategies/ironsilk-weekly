<script>
/* Front door. One bookmark → the board you used last.
   Each sport lives on its own page; this just routes. The ?b= build tag
   makes Safari fetch the current page after a deploy instead of a cached one. */
(function(){
  var BUILD='20261031b';
  var PAGES={mlb:'mlb.html',nfl:'nfl.html',ncaaf:'cfb.html',nhl:'nhl.html',nba:'nba.html',ncaab:'ncaab.html'};
  var last='';try{last=localStorage.getItem('d4.activeSport')||''}catch(e){}
  var q=(location.search.match(/[?&]sport=(mlb|nfl|ncaaf|cfb|nhl|nba|ncaab|cbb)/)||[])[1];
  if(q==='cfb')q='ncaaf';if(q==='cbb')q='ncaab';
  /* v2.80.8 · a sport hidden for its off-season (Settings → Sports shown) isn't where the app lands, and its button hides */
  var OFF=['mlb'];try{var o=JSON.parse(localStorage.getItem('d4.sportsoff')||'null');if(Object.prototype.toString.call(o)==='[object Array]')OFF=o;}catch(e){}
  if(!q&&OFF.indexOf(last)>=0)last='';
  var dest=PAGES[q||last];
  if(dest)location.replace(dest+'?b='+BUILD);
  document.addEventListener('DOMContentLoaded',function(){[].forEach.call(document.querySelectorAll('a[href$=".html"]'),function(a){var f=a.getAttribute('href');
    for(var k in PAGES){if(PAGES[k]===f&&OFF.indexOf(k)>=0)a.style.display='none';}a.href=f+'?b='+BUILD;});});
})();
</script>

<details class="mv"><summary>🔑 Moving from another TheDesk app?</summary>
  <p>On the old app: Settings → ☁️ Sync → <b>Copy transfer code</b>. Then tap the gold button.</p>
  <button onclick="tdMovePaste()">📋 Paste code &amp; restore</button>
  <input id="mvIn" type="text" placeholder="…or paste it here" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="off">
  <button class="alt" onclick="tdMove()">Restore typed code</button><div id="mvMsg"></div>
</details>
<script>
/* v2.13 front-door restore — same whitelist as shared.js MOVE_KEYS; writes only key slots */
function tdMovePaste(){var go=function(c){if(!c)return;document.getElementById('mvIn').value=c;tdMove();};
  var ask=function(){go(prompt('Paste your transfer code (long-press → Paste):','')||'');};
  try{if(navigator.clipboard&&navigator.clipboard.readText){navigator.clipboard.readText().then(function(c){if(c&&c.indexOf('TDMOVE1.')>=0)go(c);else ask();},ask);return;}}catch(e){}
  ask();}
function tdMove(){var K=['d4.key','d4.ai','d4.sharp','d4.rundown','d4.oddspapi','d4.cfbd','d4.ghtoken','d4.ghrepo','d4.tgbot','d4.syncrepo','d4.synctoken'];
  var msg=document.getElementById('mvMsg'),c=String(document.getElementById('mvIn').value||'').replace(/\s+/g,''),i=c.indexOf('TDMOVE1.');
  var bad=function(){msg.textContent="That isn't a transfer code. Old app: Settings → ☁️ Sync → 🔑 Copy transfer code.";msg.style.color='#ff7a59';};
  if(i<0)return bad();var o;try{o=JSON.parse(decodeURIComponent(escape(atob(c.slice(i+8)))));}catch(e){return bad();}
  if(!o||!o.k)return bad();var n=0;K.forEach(function(k){if(typeof o.k[k]==='string'){localStorage.setItem(k,o.k[k]);n++;}});if(!n)return bad();
  localStorage.setItem('d4.setupDone','1');document.getElementById('mvIn').value='';
  msg.style.color='#5fd38d';msg.textContent=n+' keys restored — opening the desk and pulling your cloud copy…';
  var sp=localStorage.getItem('d4.activeSport')||'nfl',P={mlb:'mlb.html',nfl:'nfl.html',ncaaf:'cfb.html',nhl:'nhl.html',nba:'nba.html',ncaab:'ncaab.html'};
  setTimeout(function(){location.replace((P[sp]||'nfl.html')+'?b='+'20261031b'+'&moved=1');},900);}
</script>
