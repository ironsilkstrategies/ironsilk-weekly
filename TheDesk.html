<script>
/* Front door. One bookmark → the board you used last.
   Each sport lives on its own page; this just routes. The ?b= build tag
   makes Safari fetch the current page after a deploy instead of a cached one. */
(function(){
  var BUILD='20261010l';
  var PAGES={mlb:'mlb.html',nfl:'nfl.html',ncaaf:'cfb.html',nhl:'nhl.html',nba:'nba.html'};
  var last='';try{last=localStorage.getItem('d4.activeSport')||''}catch(e){}
  var q=(location.search.match(/[?&]sport=(mlb|nfl|ncaaf|cfb|nhl|nba)/)||[])[1];
  if(q==='cfb')q='ncaaf';
  var dest=PAGES[q||last];
  if(dest)location.replace(dest+'?b='+BUILD);
  document.addEventListener('DOMContentLoaded',function(){[].forEach.call(document.querySelectorAll('a[href$=".html"]'),function(a){a.href=a.getAttribute('href')+'?b='+BUILD;});});
})();
</script>
