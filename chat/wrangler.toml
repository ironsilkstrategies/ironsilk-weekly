# TheDesk members' chatroom · deployed by .github/workflows/chat-deploy.yml (never by hand with keys in a file)
name = "thedesk-chat"
main = "worker.mjs"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
ALLOW_ORIGINS = "https://ironsilkweekly.com,https://www.ironsilkweekly.com"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "ACCT"
class_name = "Accounts"

[[durable_objects.bindings]]
name = "INBOX"
class_name = "Inbox"

[[durable_objects.bindings]]
name = "PUSH"
class_name = "PushBox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Accounts"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Inbox"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["PushBox"]   # v88 · device alerts

# Secrets (set by the deploy workflow from GitHub secrets, never written here): ADMIN_CODE (from CHAT_ADMIN_CODE) ·
# FB_PAGE_TOKEN, FB_PAGE_ID, FB_APP_SECRET and FB_VERIFY_TOKEN (the Facebook inbox, v3.3.2; the verify token is made from the app secret)
