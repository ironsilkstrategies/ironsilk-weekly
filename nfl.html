<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TheDesk NFL">
<meta name="theme-color" content="#060A0F">
<title>TheDesk — NFL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   THEDESK NFL — DESIGN SYSTEM
   ═══════════════════════════════════════════════════════════ */
:root{
  /* Base */
  --ink:#060A0F;--panel:#0E1520;--panel2:#141D2B;--panel3:#1A2333;
  --rule:#1E2A3A;--hair:rgba(255,255,255,.05);
  /* Text */
  --chalk:#F0F4FA;--mute:#6B7D93;--dim:#3A4D62;
  /* Brand */
  --gold:#FFB43D;--gold2:#E09A1F;
  /* Signal */
  --win:#3DDC84;--rust:#F0563C;--cold:#4DD8F0;--violet:#A78BFA;--pink:#F472B6;
  --moss:#5FA35C;
  /* Shadows */
  --sh-sm:0 1px 3px rgba(0,0,0,.5);
  --sh-md:0 4px 20px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.4);
  --sh-lg:0 12px 40px rgba(0,0,0,.65),0 2px 8px rgba(0,0,0,.4);
  /* Cards */
  --card-bg:linear-gradient(160deg,#121B27 0%,#0E1520 100%);
  --card-hi:linear-gradient(160deg,#18243A 0%,#111E30 100%);
  --bet-bg:linear-gradient(165deg,#182030 0%,#111820 100%);
  /* Glows */
  --glow-gold:0 0 0 1px rgba(255,180,61,.45),0 0 24px rgba(255,180,61,.16);
  --glow-win:0 0 0 1px rgba(61,220,132,.4),0 0 20px rgba(61,220,132,.13);
  --glow-rust:0 0 0 1px rgba(240,86,60,.4),0 0 18px rgba(240,86,60,.12);
  --glow-cold:0 0 0 1px rgba(77,216,240,.35),0 0 18px rgba(77,216,240,.1);
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-in:cubic-bezier(.55,0,1,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{min-height:100%;background:var(--ink)}
body{color:var(--chalk);font-family:"Inter",system-ui,sans-serif;font-size:15px;
  line-height:1.5;-webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(ellipse 120% 55% at 50% -5%,rgba(255,180,61,.06),transparent 65%),
    radial-gradient(ellipse 80% 40% at 100% 0%,rgba(77,216,240,.04),transparent 55%);
  background-attachment:fixed}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ── HEADER ── */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(6,10,15,.82);
  border-bottom:1px solid var(--hair);
  padding:calc(env(safe-area-inset-top)+10px) 14px 0;
  backdrop-filter:blur(28px) saturate(1.8);
  -webkit-backdrop-filter:blur(28px) saturate(1.8);
  box-shadow:0 1px 0 rgba(255,255,255,.03),0 8px 32px rgba(0,0,0,.5)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand-left{display:flex;align-items:baseline;gap:8px}
.brand h1{font-family:"Archivo";font-weight:900;font-size:21px;letter-spacing:-.04em;
  text-transform:uppercase;
  background:linear-gradient(135deg,#fff 20%,#7BA3C8 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.brand-badge{font-family:"IBM Plex Mono";font-size:9px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:var(--gold);
  background:rgba(255,180,61,.1);border:1px solid rgba(255,180,61,.25);
  border-radius:4px;padding:2px 6px}
.brand-right{display:flex;align-items:center;gap:8px}
.week-pill{font-family:"IBM Plex Mono";font-size:10px;color:var(--mute);
  background:var(--panel2);border:1px solid var(--rule);border-radius:6px;
  padding:3px 8px;white-space:nowrap}
.hdr-btn{background:none;border:none;color:var(--mute);font-size:18px;
  cursor:pointer;padding:4px;border-radius:6px;transition:color .15s}
.hdr-btn:hover{color:var(--chalk)}

/* ── METER ── */
.meterwrap{margin-top:8px}
.meterlab{display:flex;justify-content:space-between;
  font-family:"IBM Plex Mono";font-size:9px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mute);margin-bottom:3px}
.meterlab b{color:var(--chalk);font-weight:600}
.meter{display:flex;gap:2px;height:3px}
.tick{flex:1;background:var(--rule);border-radius:1px;transition:background .3s}
.tick.spent{background:var(--gold)}.tick.now{background:var(--cold);
  box-shadow:0 0 6px rgba(77,216,240,.7)}

/* ── NAV ── */
nav{display:flex;margin-top:8px;overflow-x:auto;scrollbar-width:none;gap:2px}
nav::-webkit-scrollbar{display:none}
nav>button{flex:1;min-width:56px;background:none;border:none;
  border-bottom:2px solid transparent;
  color:var(--mute);font-family:"Inter";font-weight:700;font-size:10px;
  letter-spacing:.09em;text-transform:uppercase;
  padding:9px 3px 7px;cursor:pointer;
  transition:color .18s var(--ease),border-color .18s var(--ease)}
nav>button.on{color:var(--gold);border-bottom-color:var(--gold);
  text-shadow:0 0 20px rgba(255,180,61,.5)}
nav>button .n{font-family:"IBM Plex Mono";font-size:8.5px;opacity:.55;margin-left:2px}

/* ── LAYOUT ── */
main{padding:12px 10px 120px;max-width:680px;margin:0 auto}
.view{display:none}.view.on{display:block}
.sbar{display:flex;align-items:center;gap:8px;margin:20px 3px 10px}
.sbar:first-child{margin-top:4px}
.sbar h2{font-family:"Inter";font-weight:700;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--mute);white-space:nowrap}
.sbar .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--rule),transparent)}
.sbar .ct{font-family:"IBM Plex Mono";font-size:9.5px;color:var(--dim)}

/* ── GAME CARD ── */
.game{
  background:var(--card-bg);border:1px solid var(--hair);
  border-radius:18px;margin-bottom:14px;overflow:hidden;
  box-shadow:var(--sh-md);
  transition:transform .22s var(--ease),box-shadow .22s var(--ease)}
.game.edge{border-color:rgba(255,180,61,.3);
  box-shadow:var(--sh-md),0 0 32px rgba(255,180,61,.08)}
.game.in-play{border-color:rgba(61,220,132,.28);
  box-shadow:var(--sh-md),0 0 32px rgba(61,220,132,.08)}
.game.done{border-color:rgba(60,80,100,.4)}
.game.prime{border-color:rgba(167,139,250,.3);
  box-shadow:var(--sh-md),0 0 32px rgba(167,139,250,.07)}

/* live score bar */
.live-bar{
  background:linear-gradient(135deg,rgba(61,220,132,.12),rgba(61,220,132,.06));
  border-bottom:1px solid rgba(61,220,132,.2);
  padding:8px 13px;display:flex;align-items:center;justify-content:space-between}
.live-score{font-family:"Archivo";font-weight:900;font-size:22px;letter-spacing:-.03em;
  color:var(--win)}
.live-clock{font-family:"IBM Plex Mono";font-size:10px;color:var(--win);
  background:rgba(61,220,132,.15);border-radius:4px;padding:2px 6px}
.live-situation{font-family:"IBM Plex Mono";font-size:10px;color:var(--chalk);margin-top:2px}

/* game header */
.ghd{padding:13px 13px 0}
.g-row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.teams{font-family:"Archivo";font-weight:900;font-size:20px;letter-spacing:-.03em}
.teams .at{color:var(--mute);font-weight:500;font-size:14px;margin:0 4px}
.teams .rank{font-size:11px;color:var(--gold);vertical-align:super}
.g-meta{font-family:"IBM Plex Mono";font-size:9.5px;color:var(--mute);
  text-align:right;line-height:1.5;white-space:nowrap}
.g-meta .prime-chip{color:var(--violet);font-weight:700}

/* projection */
.proj-row{display:flex;align-items:baseline;gap:10px;margin:10px 0 4px;flex-wrap:wrap}
.proj-score{font-family:"Archivo";font-weight:900;font-size:26px;letter-spacing:-.03em}
.proj-score.fav{color:var(--chalk)}
.proj-vs{color:var(--mute);font-size:13px;margin:0 2px}
.proj-tag{font-family:"IBM Plex Mono";font-size:9.5px;color:var(--cold);
  background:rgba(77,216,240,.1);border:1px solid rgba(77,216,240,.2);
  border-radius:4px;padding:2px 6px}
.proj-adj{font-family:"IBM Plex Mono";font-size:11px;color:var(--cold);margin-left:4px}

/* chips row */
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0 4px}
.chip{font-family:"IBM Plex Mono";font-size:8.5px;font-weight:600;
  padding:3px 7px;border-radius:4px;
  background:var(--panel2);border:1px solid var(--rule);color:var(--mute)}
.chip.hot{background:rgba(240,86,60,.12);border-color:rgba(240,86,60,.3);color:var(--rust)}
.chip.cold{background:rgba(77,216,240,.1);border-color:rgba(77,216,240,.25);color:var(--cold)}
.chip.gold{background:rgba(255,180,61,.12);border-color:rgba(255,180,61,.3);color:var(--gold)}
.chip.win{background:rgba(61,220,132,.1);border-color:rgba(61,220,132,.25);color:var(--win)}
.chip.violet{background:rgba(167,139,250,.1);border-color:rgba(167,139,250,.25);color:var(--violet)}
.chip.elite{background:rgba(255,180,61,.18);border-color:rgba(255,180,61,.5);color:var(--gold);
  font-weight:800;box-shadow:0 0 8px rgba(255,180,61,.3)}

/* badges */
.badge{display:inline-flex;align-items:center;font-family:"Inter";font-size:9px;
  font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 8px;border-radius:20px;margin:5px 3px 0 0}
.badge.play{background:rgba(255,180,61,.14);color:var(--gold);border:1px solid rgba(255,180,61,.35)}
.badge.pass{background:rgba(100,120,140,.1);color:var(--mute);border:1px solid var(--rule)}
.badge.dark{background:rgba(240,86,60,.12);color:var(--rust);border:1px solid rgba(240,86,60,.3)}
.badge.proj{background:rgba(77,216,240,.1);color:var(--cold);border:1px solid rgba(77,216,240,.3)}
.badge.fin{background:rgba(61,220,132,.12);color:var(--win);border:1px solid rgba(61,220,132,.3)}
.badge.super{background:linear-gradient(135deg,rgba(255,180,61,.25),rgba(240,86,60,.2));
  color:#FFD700;border:1px solid rgba(255,180,61,.5);
  box-shadow:0 0 12px rgba(255,180,61,.3);font-size:10px;font-weight:900}

/* ── BET TILES ── */
.mktblock{padding:11px 13px 14px}
.mktlab{font-family:"Inter";font-weight:600;font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--mute);margin:10px 0 6px}
.mktlab:first-child{margin-top:2px}
.betgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.betgrid.thirds{grid-template-columns:1fr 1fr 1fr}
.bet{
  background:var(--bet-bg);border:1px solid var(--hair);border-radius:14px;
  padding:11px 9px;cursor:pointer;text-align:center;min-height:66px;
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;justify-content:center;gap:3px;
  box-shadow:var(--sh-sm),inset 0 1px 0 rgba(255,255,255,.04);
  transition:transform .16s var(--ease),box-shadow .2s var(--ease),border-color .2s}
.bet::before{content:'';position:absolute;inset:0 0 auto 0;height:40%;
  background:linear-gradient(180deg,rgba(255,255,255,.025),transparent);
  pointer-events:none}
.bet:hover{transform:translateY(-1px);box-shadow:var(--sh-md)}
.bet:active{transform:scale(.97)}
.bet.green{border-color:rgba(61,220,132,.4);
  box-shadow:var(--glow-win);background:linear-gradient(165deg,#12221A,#0E1B14)}
.bet.red{border-color:rgba(240,86,60,.35);
  box-shadow:var(--glow-rust);background:linear-gradient(165deg,#22120E,#1A0E0B)}
.bet.on{border-color:var(--gold);box-shadow:var(--glow-gold)}
.bet-line{font-family:"Archivo";font-weight:900;font-size:17px;letter-spacing:-.02em}
.bet-price{font-family:"IBM Plex Mono";font-size:11px;color:var(--mute)}
.bet-ev{font-family:"IBM Plex Mono";font-size:9px;font-weight:700;margin-top:1px}
.bet-ev.pos{color:var(--win)}.bet-ev.neg{color:var(--rust)}.bet-ev.neu{color:var(--mute)}
.bet-prob{font-family:"IBM Plex Mono";font-size:9px;color:var(--dim)}
.bet-real{font-size:7.5px;font-family:"IBM Plex Mono";color:var(--gold);
  letter-spacing:.06em;opacity:.8}

/* ── PANEL TABS ── */
.ptabs{display:flex;overflow-x:auto;scrollbar-width:none;
  border-top:1px solid var(--rule);background:rgba(6,10,15,.4)}
.ptabs::-webkit-scrollbar{display:none}
.ptabs button{flex:1;min-width:50px;background:none;border:none;border-bottom:2px solid transparent;
  color:var(--mute);font-family:"Inter";font-weight:600;font-size:9.5px;
  letter-spacing:.07em;text-transform:uppercase;
  padding:8px 4px 7px;cursor:pointer;white-space:nowrap;
  transition:color .15s,border-color .15s}
.ptabs button.on{color:var(--gold);border-bottom-color:var(--gold)}
.panel{padding:12px 13px 14px;display:none;border-top:1px solid var(--rule)}
.panel.on{display:block}
.phead{font-family:"Inter";font-weight:700;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--mute);margin:12px 0 6px}
.phead:first-child{margin-top:0}

/* staff voice labels */
.voice-label{font-family:"IBM Plex Mono";font-size:8.5px;letter-spacing:.1em;
  text-transform:uppercase;padding:2px 7px 2px 5px;border-radius:3px;
  display:inline-flex;align-items:center;gap:4px;margin-bottom:8px}
.voice-label.scout{background:rgba(167,139,250,.1);color:var(--violet);border-left:2px solid var(--violet)}
.voice-label.coord{background:rgba(77,216,240,.1);color:var(--cold);border-left:2px solid var(--cold)}
.voice-label.stats{background:rgba(61,220,132,.1);color:var(--win);border-left:2px solid var(--win)}
.voice-label.weather{background:rgba(100,180,255,.1);color:#64B4FF;border-left:2px solid #64B4FF}
.voice-label.kicker{background:rgba(240,180,60,.1);color:var(--gold);border-left:2px solid var(--gold)}
.voice-label.coach{background:rgba(240,86,60,.1);color:var(--rust);border-left:2px solid var(--rust)}
.voice-label.intel{background:rgba(255,180,61,.12);color:var(--gold);border-left:2px solid var(--gold)}

/* ── COACH / INTEL PANELS ── */
.coach-brief{font-size:13.5px;line-height:1.7;color:var(--chalk)}
.coach-brief b{color:var(--gold)}
.coach-brief .signal{color:var(--win)}
.coach-brief .warn{color:var(--rust)}
.intel-row{display:flex;align-items:baseline;gap:8px;padding:5px 0;
  border-bottom:1px solid var(--rule)}
.intel-row:last-child{border-bottom:none}
.intel-label{font-family:"IBM Plex Mono";font-size:9.5px;color:var(--mute);min-width:90px}
.intel-val{font-family:"IBM Plex Mono";font-size:10.5px;color:var(--chalk);font-weight:600}
.intel-sub{font-family:"IBM Plex Mono";font-size:9px;color:var(--dim);margin-left:6px}

/* ── PROPS TABLE ── */
.prop-row{display:flex;justify-content:space-between;align-items:center;
  padding:7px 0;border-bottom:1px solid var(--rule)}
.prop-row:last-child{border-bottom:none}
.prop-player{font-size:13px;font-weight:600;color:var(--chalk)}
.prop-stat{font-family:"IBM Plex Mono";font-size:10px;color:var(--mute)}
.prop-line{font-family:"Archivo";font-weight:800;font-size:15px}
.prop-conf{font-family:"IBM Plex Mono";font-size:9px}
.prop-freq{font-family:"IBM Plex Mono";font-size:9px;color:var(--dim)}
.prop-hit{color:var(--win)}.prop-miss{color:var(--rust)}.prop-lean{color:var(--gold)}

/* ── MATCHUP TABLE ── */
.matchup-row{display:flex;justify-content:space-between;align-items:center;
  padding:6px 0;border-bottom:1px solid var(--rule);gap:8px}
.matchup-row:last-child{border-bottom:none}
.matchup-name{font-size:12.5px;font-weight:600;color:var(--chalk);min-width:100px}
.matchup-pos{font-family:"IBM Plex Mono";font-size:9px;color:var(--mute)}
.matchup-stat{font-family:"IBM Plex Mono";font-size:11px;font-weight:600}
.matchup-edge{font-family:"IBM Plex Mono";font-size:9px;padding:2px 5px;border-radius:3px}
.matchup-edge.adv{background:rgba(61,220,132,.15);color:var(--win)}
.matchup-edge.dis{background:rgba(240,86,60,.12);color:var(--rust)}
.matchup-edge.neu{background:var(--panel2);color:var(--mute)}

/* ── BOX SCORE ── */
.box-table{width:100%;border-collapse:collapse;font-size:11.5px}
.box-table th{font-family:"IBM Plex Mono";font-size:8.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--mute);padding:4px 6px;text-align:right;
  border-bottom:1px solid var(--rule)}
.box-table th:first-child{text-align:left}
.box-table td{padding:5px 6px;border-bottom:1px solid rgba(255,255,255,.03);
  text-align:right;font-family:"IBM Plex Mono"}
.box-table td:first-child{text-align:left;color:var(--chalk);font-weight:500}
.box-table tr.team-hdr td{background:var(--panel2);color:var(--gold);
  font-weight:700;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.box-table .over70{color:var(--win)}.box-table .under30{color:var(--rust)}

/* ── A-G ANALYSIS ── */
.ag-row{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--rule)}
.ag-row:last-child{border-bottom:none}
.ag-letter{font-family:"Archivo";font-weight:900;font-size:22px;color:var(--gold);
  min-width:28px;line-height:1}
.ag-content{}
.ag-label{font-family:"IBM Plex Mono";font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--mute);margin-bottom:3px}
.ag-value{font-size:13.5px;color:var(--chalk);line-height:1.5}

/* ── TAKE/FADE ── */
.verdict{text-align:center;padding:14px 10px}
.verdict-word{font-family:"Archivo";font-weight:900;font-size:32px;
  letter-spacing:-.04em;text-transform:uppercase}
.verdict-word.supreme{color:var(--gold);text-shadow:0 0 30px rgba(255,180,61,.5)}
.verdict-word.strong{color:var(--win)}
.verdict-word.lean{color:var(--cold)}
.verdict-word.split{color:var(--violet)}
.verdict-word.avoid{color:var(--rust)}
.verdict-sub{font-size:12px;color:var(--mute);margin-top:4px;line-height:1.5}
.verdict-pick{display:flex;justify-content:center;gap:10px;margin-top:10px;flex-wrap:wrap}

/* ── TRENDS ── */
.trend-row{padding:6px 0;border-bottom:1px solid var(--rule)}
.trend-row:last-child{border-bottom:none}
.trend-text{font-size:13px;color:var(--chalk);line-height:1.5}
.trend-rec{font-family:"IBM Plex Mono";font-size:9.5px;margin-top:2px}
.trend-over{color:var(--win)}.trend-under{color:var(--rust)}
.trend-neutral{color:var(--mute)}

/* ── WEATHER CARD ── */
.weather-block{background:var(--panel2);border:1px solid var(--rule);
  border-radius:10px;padding:12px;display:grid;
  grid-template-columns:1fr 1fr;gap:10px}
.wx-stat{text-align:center}
.wx-icon{font-size:26px;margin-bottom:3px}
.wx-val{font-family:"Archivo";font-weight:800;font-size:18px}
.wx-label{font-family:"IBM Plex Mono";font-size:8.5px;color:var(--mute);
  letter-spacing:.1em;text-transform:uppercase}
.wx-impact{font-family:"IBM Plex Mono";font-size:10px;margin-top:8px;
  padding:6px 10px;border-radius:6px;text-align:center}
.wx-impact.high{background:rgba(240,86,60,.12);color:var(--rust);
  border:1px solid rgba(240,86,60,.25)}
.wx-impact.med{background:rgba(255,180,61,.1);color:var(--gold);
  border:1px solid rgba(255,180,61,.2)}
.wx-impact.low{background:rgba(61,220,132,.08);color:var(--win);
  border:1px solid rgba(61,220,132,.15)}

/* ── KICKER CARD ── */
.kicker-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kicker-stat{background:var(--panel2);border:1px solid var(--rule);
  border-radius:8px;padding:9px;text-align:center}
.kicker-pct{font-family:"Archivo";font-weight:900;font-size:20px}
.kicker-label{font-family:"IBM Plex Mono";font-size:8.5px;color:var(--mute);
  text-transform:uppercase;letter-spacing:.08em}

/* ── PERCENTILE BARS ── */
.pct-bar-wrap{display:flex;align-items:center;gap:8px;padding:4px 0}
.pct-label{font-size:11.5px;color:var(--chalk);min-width:110px}

/* ── SLIP ── */
.slip{

  border-top:1px solid var(--rule);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);

  display:flex;align-items:center;gap:10px}

.slip-btn.lock{background:var(--gold);color:#060A0F}

.slip-sheet{position:fixed;bottom:0;left:0;right:0;z-index:70;
  background:var(--panel);border-top:1px solid var(--rule);
  border-radius:20px 20px 0 0;padding:16px 14px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .3s var(--ease);max-height:70vh;overflow-y:auto}
.slip-sheet.open{transform:translateY(0)}
.slip-handle{width:36px;height:4px;background:var(--dim);border-radius:2px;

// ── MATH UTILITIES ────────────────────────────────────────────────────────────
function randn(){
  let u=0,v=0;
  while(u===0)u=Math.random();
  while(v===0)v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}
function amerToProb(a){if(a==null||isNaN(a))return null;
  return a>0?100/(a+100):(-a)/((-a)+100)}
function amerProfit(a){return a>0?a/100:100/(-a)}
function evPct(p,a){if(p==null||a==null||isNaN(a))return null;
  return (p*amerProfit(a)-(1-p))*100}
function normTail(z){if(!isFinite(z))return z>0?0:1;
  return 0.5*(1-Math.sign(z)*Math.sqrt(1-Math.exp(-z*z*(2/Math.PI))))}
function nflFairML(p){
  if(p>=0.5)return Math.round(-(p/(1-p))*100);
  return Math.round((1-p)/p*100);
}

function clr(v,inv=false){
  const good=inv?(v<0.5):(v>=0.5);
  if(v>=0.70||v<=0.30)return good?'var(--win)':'var(--rust)';
  return 'var(--mute)';

function snapNFLScore(s){
  if(s<0)return 0;
  const valid=[0,3,6,7,9,10,13,14,16,17,20,21,23,24,27,28,30,31,33,34,37,38,41,42,44,45,48];
  let best=valid[0],bestD=Math.abs(s-valid[0]);
  for(const v of valid){const d=Math.abs(s-v);if(d<bestD){bestD=d;best=v;}}
  return best;
}

  [.5,.6],[.6,.7],[.7,.8],[.8,.9],[.9,1]];
function nflBandOf(p){
  for(const[lo,hi]of NFL_CAL_BANDS)if(p>=lo&&p<hi)return`${(lo*100)|0}-${(hi*100)|0}`;
  return'90-100';
}
function getNFLCalib(){return get(NFL_CALIB_KEY,{})}
function nflCalibAdj(raw,market,situation){
  const c=getNFLCalib();
  const band=nflBandOf(raw);
  const key=`${market}|${situation||'any'}|${band}`;
  const entry=c[key];
  if(!entry||entry.n<8)return raw;
  const hitRate=entry.hits/entry.n;
  const k=Math.min(1,(entry.n-8)/20);
  return raw*(1-k)+hitRate*k;
}

// ── SIM ENGINE ────────────────────────────────────────────────────────────────
function nflIsDivisionGame(g){
  return !!(g.away&&g.home&&NFL_DIVISION[g.away.abbr]&&
    NFL_DIVISION[g.away.abbr]===NFL_DIVISION[g.home.abbr]);
}
function nflSurfaceMult(abbr){
  return NFL_TURF.has(String(abbr||'').toUpperCase())?1.03:1.00}
function nflEnvMult(g){
  if(!g||NFL_DOME.has(g.home&&g.home.abbr))return 1.0;
  const wx=NFL_WEATHER[g.id]||{};
  let m=1.0;
  if(wx.windSpeed>20)m*=0.93;
  else if(wx.windSpeed>15)m*=0.96;
  else if(wx.windSpeed>10)m*=0.98;
  if(wx.temp<32)m*=0.95;
  else if(wx.temp<40)m*=0.97;
  if(wx.condition&&/snow|blizzard/i.test(wx.condition))m*=0.92;
  else if(wx.condition&&/rain|storm/i.test(wx.condition))m*=0.97;
  return m;
}

function simNFLGame(g,N=10000){
  const awayPow=NFL_POWER[g.away.abbr]||{offPPG:22,defPPG:22,wins:0,losses:0,ties:0};
  const homePow=NFL_POWER[g.home.abbr]||{offPPG:22,defPPG:22,wins:0,losses:0,ties:0};
  const leagueAvg=22.0;
  const gamesPlayed=Math.max(
    (awayPow.wins||0)+(awayPow.losses||0)+(awayPow.ties||0),
    (homePow.wins||0)+(homePow.losses||0)+(homePow.ties||0),1);
  const regW=Math.max(0,Math.min(1,(gamesPlayed-1)/8));
  const reg=1-0.35*(1-regW);

  let awayExp=((awayPow.offPPG+homePow.defPPG)/2)*reg+leagueAvg*(1-reg);
  let homeExp=((homePow.offPPG+awayPow.defPPG)/2)*reg+leagueAvg*(1-reg)+NFL_HFA;

  if(nflIsDivisionGame(g)){awayExp*=0.96;homeExp*=0.96;}
  const surf=nflSurfaceMult(g.home.abbr);
  awayExp*=surf;homeExp*=surf;
  const env=nflEnvMult(g);
  awayExp*=env;homeExp*=env;

  // calibration drift
  const nflCalib=getNFLCalib();
  const driftAdj=(nflCalib.globalDrift||0)/2;
  awayExp=Math.max(10,Math.min(40,awayExp+driftAdj));
  homeExp=Math.max(10,Math.min(40,homeExp+driftAdj));

  const std=10.5;
  const TSPAN=120,MSPAN=121,MOFF=60;
  const totFreq=new Int32Array(TSPAN);
  const marFreq=new Int32Array(MSPAN);
  const h1Freq=new Int32Array(TSPAN);
  const scoreFreq=Object.create(null);
  // prop sim accumulators
  let qbAway_pass=0,qbHome_pass=0;
  let rb1Away_rush=0,rb1Home_rush=0;
  let wr1Away_rec=0,wr1Home_rec=0;
  let wr2Away_rec=0,wr2Home_rec=0;
  let te1Away_rec=0,te1Home_rec=0;
  let kAway_pts=0,kHome_pts=0;
  let hw=0,aw=0,tie=0,as=0,hs=0;

  for(let i=0;i<N;i++){
    let a=snapNFLScore(Math.max(0,Math.round(awayExp+randn()*std)));
    let h=snapNFLScore(Math.max(0,Math.round(homeExp+randn()*std)));
    as+=a;hs+=h;
    const t=a+h;totFreq[t<TSPAN?t:TSPAN-1]++;
    let m=h-a;if(m<-MOFF)m=-MOFF;else if(m>MOFF)m=MOFF;
    marFreq[m+MOFF]++;
    const key=a+'-'+h;scoreFreq[key]=(scoreFreq[key]||0)+1;
    if(h>a)hw++;else if(a>h)aw++;else tie++;
    h1Freq[Math.max(0,Math.round(a*.45+randn()*4))+Math.max(0,Math.round(h*.45+randn()*4))<TSPAN?
      Math.max(0,Math.round(a*.45+randn()*4))+Math.max(0,Math.round(h*.45+randn()*4)):TSPAN-1]++;

    // prop sims (simple share model)
    const aDrives=Math.max(8,Math.round(a/3+randn()*1.5));
    const hDrives=Math.max(8,Math.round(h/3+randn()*1.5));
    qbAway_pass+=Math.max(0,Math.round((a/0.065)*(0.85+randn()*.15)));
    qbHome_pass+=Math.max(0,Math.round((h/0.065)*(0.85+randn()*.15)));
    const aYds=a/0.065;const hYds=h/0.065;
    rb1Away_rush+=Math.max(0,Math.round(aYds*0.28*(0.9+randn()*.2)));
    rb1Home_rush+=Math.max(0,Math.round(hYds*0.28*(0.9+randn()*.2)));
    wr1Away_rec+=Math.max(0,Math.round(aYds*0.22*(0.85+randn()*.25)));
    wr1Home_rec+=Math.max(0,Math.round(hYds*0.22*(0.85+randn()*.25)));
    wr2Away_rec+=Math.max(0,Math.round(aYds*0.14*(0.85+randn()*.3)));
    wr2Home_rec+=Math.max(0,Math.round(hYds*0.14*(0.85+randn()*.3)));
    te1Away_rec+=Math.max(0,Math.round(aYds*0.12*(0.8+randn()*.3)));
    te1Home_rec+=Math.max(0,Math.round(hYds*0.12*(0.8+randn()*.3)));
    // kicker: FGs attempted ≈ (drives that stall)
    kAway_pts+=Math.max(0,Math.round(a*0.25+randn()*2));
    kHome_pts+=Math.max(0,Math.round(h*0.25+randn()*2));
  }

  const cumGE=new Float64Array(TSPAN+2);
  for(let k=TSPAN-1;k>=0;k--)cumGE[k]=cumGE[k+1]+totFreq[k];
  const marGE=new Float64Array(MSPAN+2);
  for(let k=MSPAN-1;k>=0;k--)marGE[k]=marGE[k+1]+marFreq[k];
  const qFrom=(freq,span,q)=>{const idx=Math.floor(N*q);let run=0;
    for(let v=0;v<span;v++){run+=freq[v];if(run>idx)return v}return span-1};

  let modeScore=null,modeN=0;
  for(const k in scoreFreq)if(scoreFreq[k]>modeN){modeN=scoreFreq[k];modeScore=k}

  let rawHw=(hw+tie*.5)/N,rawAw=(aw+tie*.5)/N;
  const calHw=nflCalibAdj(rawHw,'side',rawHw>=.5?'favorite':'underdog');
  if(!isNaN(calHw)&&calHw>0&&calHw<1){rawHw=calHw;rawAw=1-calHw;}

  const med=qFrom(totFreq,TSPAN,.5);
  const medMargin=qFrom(marFreq,MSPAN,.5)-MOFF;
  const medH1=qFrom(h1Freq,TSPAN,.5);

  const over=x=>{
    let k=Math.floor(x)+1;if(k<0)k=0;if(k>TSPAN)return 0;
    const raw=cumGE[k]/N;
    return nflCalibAdj(raw,'total',rawHw>=.5?'favorite':'underdog');
  };
  const homeCover=line=>{
    const need=-line;
    let k=Math.floor(need)+1+MOFF;
    if(k<0)k=0;if(k>MSPAN)return 0;
    return marGE[k]/N;
  };
  const awayCover=line=>{
    const need=line;
    let k=Math.floor(need)+MOFF+1;
    if(k<0)return 0;if(k>MSPAN)k=MSPAN;
    return 1-(marGE[k]/N);
  };

  return{
    awayProj:Math.round(awayExp*10)/10,
    homeProj:Math.round(homeExp*10)/10,
    hw:rawHw,aw:rawAw,
    med,medMargin,medH1,modeScore,modeScorePct:modeN/N,
    p10:qFrom(totFreq,TSPAN,.1),p90:qFrom(totFreq,TSPAN,.9),
    mean:(as+hs)/N,N,over,homeCover,awayCover,env,surf,
    awayExp,homeExp,
    props:{
      away:{
        qb_pass:Math.round(qbAway_pass/N),
        rb1_rush:Math.round(rb1Away_rush/N),
        wr1_rec:Math.round(wr1Away_rec/N),
        wr2_rec:Math.round(wr2Away_rec/N),
        te1_rec:Math.round(te1Away_rec/N),
        k_pts:Math.round(kAway_pts/N),
      },
      home:{
        qb_pass:Math.round(qbHome_pass/N),
        rb1_rush:Math.round(rb1Home_rush/N),
        wr1_rec:Math.round(wr1Home_rec/N),
        wr2_rec:Math.round(wr2Home_rec/N),
        te1_rec:Math.round(te1Home_rec/N),
        k_pts:Math.round(kHome_pts/N),
      }
    }
  };
}

// ── PROP OVER/UNDER FREQUENCY from sim (separate 1000-run pass per line) ──────
function simPropFreq(projVal, line, sd=20, N=1000){
  let over=0;
  for(let i=0;i<N;i++){
    const sim=Math.max(0,projVal+randn()*sd);
    if(sim>line)over++;
  }
  return over/N;
}

function nflAbbrFor(raw){
  if(!raw)return null;
  const k=String(raw).toUpperCase().replace(/[^A-Z0-9]/g,'');
  const NFL_NORM={
    'WAS':'WSH','WASHINGTON':'WSH','COMMANDERS':'WSH',
    'LA':'LAR','RAMS':'LAR','LOSANGELESRAMS':'LAR',
    'LOSANGELESCHARGERS':'LAC','CHARGERS':'LAC',
    'LASVEGAS':'LV','RAIDERS':'LV','OAKLAND':'LV',
    'PATRIOTS':'NE','NEWENGLAND':'NE',
    'PACKERS':'GB','GREENBAY':'GB',
    'CHIEFS':'KC','KANSASCITY':'KC',
    '49ERS':'SF','SANFRANCISCO':'SF',
    'BUCCANEERS':'TB','TAMPABAY':'TB',
    'SAINTS':'NO','NEWORLEANS':'NO',
    'GIANTS':'NYG','NEWYORKGIANTS':'NYG',
    'JETS':'NYJ','NEWYORKJETS':'NYJ',
  };
  if(NFL_NORM[k])return NFL_NORM[k];
  for(const abbr in NFL_TEAMS){

    const t=NFL_TEAMS[abbr];
    const names=[t.name,t.name.split(' ').pop()].map(n=>n.toUpperCase().replace(/[^A-Z]/g,''));
    if(names.includes(k))return abbr;
  }
  return null;
}

        indoor:comp.venue&&comp.venue.indoor,
        neutral:comp.neutralSite,
        broadcast:comp.broadcasts&&comp.broadcasts[0]&&comp.broadcasts[0].names&&
          comp.broadcasts[0].names[0]||'',
        away:{
          abbr:awayAbbr,
          name:away.team&&away.team.displayName||awayAbbr,
          shortName:away.team&&away.team.shortDisplayName||awayAbbr,
          score:away.score!=null?+away.score:null,
          record:away.records&&away.records[0]&&away.records[0].summary||'',
          ranking:away.curatedRank&&away.curatedRank.current||null,
          offRating:NFL_POWER[awayAbbr]&&NFL_POWER[awayAbbr].offPPG||22,
          defRating:NFL_POWER[awayAbbr]&&NFL_POWER[awayAbbr].defPPG||22,
        },
        home:{
          abbr:homeAbbr,
          name:home.team&&home.team.displayName||homeAbbr,
          shortName:home.team&&home.team.shortDisplayName||homeAbbr,
          score:home.score!=null?+home.score:null,
          record:home.records&&home.records[0]&&home.records[0].summary||'',
          ranking:home.curatedRank&&home.curatedRank.current||null,
          offRating:NFL_POWER[homeAbbr]&&NFL_POWER[homeAbbr].offPPG||22,
          defRating:NFL_POWER[homeAbbr]&&NFL_POWER[homeAbbr].defPPG||22,
        },
      };
    }).filter(Boolean);

    // cache
    const wk='w'+(NFL_SEASON||'')+(NFL_WEEK||'');
    const cache=get(LS.nflgames,{});
    cache[wk]={ts:Date.now(),v:NFL_GAMES,week:NFL_WEEK,season:NFL_SEASON};

async function fetchNFLPowerRatings(){
  try{
    const url='https://site.api.espn.com/apis/site/v2/sports/football/nfl/standings';
    const r=await fetch(url);const j=await r.json();
    const entries=[];
    (j.children||[]).forEach(conf=>(conf.children||[]).forEach(div=>
      (div.standings&&div.standings.entries||[]).forEach(e=>entries.push(e))));
    entries.forEach(e=>{
      const abbr=(e.team&&e.team.abbreviation||'').toUpperCase();
      if(!abbr)return;
      const stats={};
      (e.stats||[]).forEach(s=>{stats[s.name]=s.value});
      const gp=+stats.gamesPlayed||0;
      if(gp<1)return;
      const pf=+stats.pointsFor||0,pa=+stats.pointsAgainst||0;
      if(!pf&&!pa)return;
      NFL_POWER[abbr]={
        offPPG:pf/gp,defPPG:pa/gp,gp,
        wins:stats.wins||0,losses:stats.losses||0,ties:stats.ties||0,
        pf,pa,sos:stats.strengthOfSchedule||0,streak:stats.streak||0,
      };
    });
    NFL_POWER_RATED=Object.keys(NFL_POWER).length;
    const offs=Object.values(NFL_POWER).map(t=>t.offPPG);
    const spread=offs.length?Math.max(...offs)-Math.min(...offs):0;
    NFL_POWER_FLAT=(NFL_POWER_RATED<8||spread<1.5);
    set(LS.nflpower,{ts:Date.now(),v:NFL_POWER,week:NFL_WEEK});
    NFL_GAMES.forEach(g=>{
      if(NFL_POWER[g.away.abbr]){
        g.away.offRating=NFL_POWER[g.away.abbr].offPPG;
        g.away.defRating=NFL_POWER[g.away.abbr].defPPG;
      }
      if(NFL_POWER[g.home.abbr]){
        g.home.offRating=NFL_POWER[g.home.abbr].offPPG;
        g.home.defRating=NFL_POWER[g.home.abbr].defPPG;
      }
    });
    NFL_SIMS={};
    renderNFL();
  }catch(e){console.warn('NFL power ratings failed:',e.message);}
}

let PERCENTILE_DATA={};
function computePercentiles(){
  if(!Object.keys(NFL_POWER).length)return;
  const teams=Object.entries(NFL_POWER);
  if(teams.length<4)return;
  const offs=teams.map(([,v])=>v.offPPG).sort((a,b)=>a-b);
  const defs=teams.map(([,v])=>v.defPPG).sort((a,b)=>a-b); // lower = better defense
  PERCENTILE_DATA={};
  teams.forEach(([abbr,v])=>{
    const offRank=offs.indexOf(v.offPPG);
    const defRank=defs.indexOf(v.defPPG);
    const offPct=offRank/offs.length;
    const defPct=1-(defRank/defs.length); // invert: lower pts allowed = higher percentile
    PERCENTILE_DATA[abbr]={
      offPct,defPct,
      offTop5:offPct>=0.95,offBot5:offPct<=0.05,
      defTop5:defPct>=0.95,defBot5:defPct<=0.05,
    };
  });
}

function percentileLabel(pct){

async function fetchWeatherForGame(g){
  if(!g||!g.home||NFL_DOME.has(g.home.abbr))return null;
  const coords=STADIUM_COORDS[g.home.abbr];
  if(!coords)return null;
  try{
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lon}&hourly=temperature_2m,windspeed_10m,weathercode&temperature_unit=fahrenheit&windspeed_unit=mph&timezone=auto&forecast_days=7`;
    const r=await fetch(url);const j=await r.json();
    // find the hour closest to game time
    const gameDate=new Date(g.date);
    const hours=j.hourly&&j.hourly.time||[];
    let bestIdx=0,bestDiff=Infinity;
    hours.forEach((h,i)=>{
      const d=Math.abs(new Date(h)-gameDate);
      if(d<bestDiff){bestDiff=d;bestIdx=i;}
    });
    const temp=j.hourly&&j.hourly.temperature_2m&&j.hourly.temperature_2m[bestIdx];
    const wind=j.hourly&&j.hourly.windspeed_10m&&j.hourly.windspeed_10m[bestIdx];
    const code=j.hourly&&j.hourly.weathercode&&j.hourly.weathercode[bestIdx];
    const condition=wxCode(code);
    return{temp,windSpeed:wind,condition,code};
  }catch(e){return null;}
}
function wxCode(c){
  if(c==null)return'Unknown';
  if(c===0)return'Clear';if(c<=3)return'Partly Cloudy';
  if(c<=9)return'Cloudy';if(c<=19)return'Fog';
  if(c<=29)return'Rain';if(c<=39)return'Drizzle';
  if(c<=49)return'Freezing Drizzle';if(c<=59)return'Drizzle';
  if(c<=69)return'Rain';if(c<=79)return'Snow/Sleet';
  if(c<=84)return'Snow Showers';if(c<=99)return'Thunderstorm';
  return'Unknown';
}
function wxImpact(wx){
  if(!wx)return null;
  const issues=[];
  if(wx.windSpeed>20)issues.push(`Wind ${wx.windSpeed}mph — significant impact on passing and kicking`);
  else if(wx.windSpeed>15)issues.push(`Wind ${wx.windSpeed}mph — moderate passing impact`);
  if(wx.temp<32)issues.push(`Temp ${wx.temp}°F — freezing conditions affect ball handling`);
  else if(wx.temp<40)issues.push(`Temp ${wx.temp}°F — cold conditions tighten totals`);
  if(/snow|blizzard/i.test(wx.condition))issues.push(`${wx.condition} — heavy total suppressor`);
  else if(/rain|storm/i.test(wx.condition))issues.push(`${wx.condition} — mild total suppressor`);
  const level=wx.windSpeed>20||/snow|blizzard/i.test(wx.condition)||wx.temp<32?'high':
    wx.windSpeed>12||wx.temp<40||/rain/i.test(wx.condition)?'med':'low';
  return{level,issues};
}
async function fetchAllWeather(){
  const upcoming=NFL_GAMES.filter(g=>g.abstract==='pre'&&!NFL_DOME.has(g.home&&g.home.abbr));
  for(const g of upcoming){
    if(!NFL_WEATHER[g.id]){
      const wx=await fetchWeatherForGame(g);
      if(wx)NFL_WEATHER[g.id]=wx;
      await new Promise(r=>setTimeout(r,100));
    }
  }
}

// ── WR/DB MATCHUP ANALYSIS ───────────────────────────────────────────────────
// Uses depth chart + power ratings as a proxy for exposed/elite coverage
function getWRDBMatchup(g){
  const awayWRs=getWRs(g.away.abbr);
  const homeWRs=getWRs(g.home.abbr);
  const awayDef=NFL_POWER[g.home.abbr]; // home defense faces away WRs
  const homeDef=NFL_POWER[g.away.abbr]; // away defense faces home WRs

  const awayPct=PERCENTILE_DATA[g.away.abbr];
  const homePct=PERCENTILE_DATA[g.home.abbr];

  const analysis=[];

  // Away offense vs Home defense
  if(awayWRs.length&&awayPct&&homePct){
    const offAdv=awayPct.offPct>0.6; // away offense is strong
    const defWeak=homePct.defPct<0.4; // home defense is weak (allows more points)
    if(offAdv&&defWeak){
      analysis.push({
        side:'away',
        label:`${g.away.abbr} WRs vs ${g.home.abbr} secondary`,
        edge:'advantage',
        note:`${g.away.abbr} passing attack (${pct(awayPct.offPct)} off) faces ${g.home.abbr} defense (${pct(1-homePct.defPct)} pts allowed rank) — favorable target volume`,
        players:awayWRs.slice(0,2).map(p=>p.name),
      });
    }else if(!offAdv&&!defWeak){
      analysis.push({
        side:'away',
        label:`${g.away.abbr} WRs vs ${g.home.abbr} secondary`,
        edge:'disadvantage',
        note:`${g.home.abbr} defense limits passing — fade away WR overs`,
        players:awayWRs.slice(0,2).map(p=>p.name),
      });
    }
  }
  // Home offense vs Away defense
  if(homeWRs.length&&homePct&&awayPct){
    const offAdv=homePct.offPct>0.6;
    const defWeak=awayPct.defPct<0.4;
    if(offAdv&&defWeak){
      analysis.push({
        side:'home',
        label:`${g.home.abbr} WRs vs ${g.away.abbr} secondary`,
        edge:'advantage',
        note:`${g.home.abbr} passing attack (${pct(homePct.offPct)} off) faces ${g.away.abbr} defense (${pct(1-awayPct.defPct)} pts allowed rank) — target WR overs`,
        players:homeWRs.slice(0,2).map(p=>p.name),
      });
    }
  }
  return analysis;
}

// ── KICKER DATA ───────────────────────────────────────────────────────────────
function getKickerInsight(g,s){
  // Use sim kicker pts projection and field goal rate estimate
  const awayKPts=s.props&&s.props.away&&s.props.away.k_pts||0;
  const homeKPts=s.props&&s.props.home&&s.props.home.k_pts||0;
  const awayFGProb=awayKPts>0?Math.min(0.85,(awayKPts/3)*0.78):0.5;
  const homeFGProb=homeKPts>0?Math.min(0.85,(homeKPts/3)*0.78):0.5;

  // Weather effect on kicking
  const wx=NFL_WEATHER[g.id];
  let kickImpact='';
  if(wx&&wx.windSpeed>20)kickImpact='Heavy wind — kicker accuracy significantly reduced';
  else if(wx&&wx.windSpeed>15)kickImpact='Wind may affect long FG attempts';
  else if(wx&&wx.temp<32)kickImpact='Freezing temps reduce kicker range and accuracy';

  return{
    away:{name:g.away.abbr+' K',projPts:awayKPts,fgProb:awayFGProb},
    home:{name:g.home.abbr+' K',projPts:homeKPts,fgProb:homeFGProb},
    impact:kickImpact,
    dome:NFL_DOME.has(g.home.abbr),
  };
}

// ── LIVE SCORE POLLING ───────────────────────────────────────────────────────
async function refreshNFLLiveScores(){
  if(!NFL_GAMES.length)return;
  const liveGames=NFL_GAMES.filter(g=>g.abstract==='live');
  if(!liveGames.length){
    // Check if any should be live by time
    const now=new Date();
    const shouldBeLive=NFL_GAMES.filter(g=>{
      const start=new Date(g.date);
      const elapsed=(now-start)/60000;
      return g.abstract==='pre'&&elapsed>0&&elapsed<250;
    });
    if(!shouldBeLive.length)return;
  }
  try{
    const r=await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard');
    const j=await r.json();
    let changed=false;
    (j.events||[]).forEach(ev=>{
      const g=NFL_GAMES.find(x=>x.id===ev.id);if(!g)return;
      const comp=ev.competitions&&ev.competitions[0];if(!comp)return;
      const teams=comp.competitors||[];
      const away=teams.find(t=>t.homeAway==='away');
      const home=teams.find(t=>t.homeAway==='home');
      const status=comp.status&&comp.status.type&&comp.status.type.name||g.status;
      const newAbstract=status==='STATUS_FINAL'?'post':
        status==='STATUS_IN_PROGRESS'?'live':'pre';
      if(newAbstract!==g.abstract||
        (away&&away.score!=g.away.score)||(home&&home.score!=g.home.score)){
        g.status=status;g.abstract=newAbstract;
        g.clock=comp.status&&comp.status.displayClock||'';
        g.period=comp.status&&comp.status.period||0;
        if(away)g.away.score=away.score!=null?+away.score:null;
        if(home)g.home.score=home.score!=null?+home.score:null;
        g.situation=comp.situation||{};
        changed=true;
        if(newAbstract==='post'){
          // Auto-grade this game
          recordFinalScore(g);
        }
      }
    });
    if(changed)renderNFL();
  }catch(e){}
}

function startLivePollIfNeeded(){
  const hasLive=NFL_GAMES.some(g=>g.abstract==='live');
  const hasSoon=NFL_GAMES.some(g=>{
    if(g.abstract!=='pre')return false;
    const start=new Date(g.date);
    return (start-Date.now())<30*60*1000;
  });
  if((hasLive||hasSoon)&&!LIVE_POLL){
    LIVE_POLL=setInterval(()=>refreshNFLLiveScores(),90000);
  }else if(!hasLive&&!hasSoon&&LIVE_POLL){
    clearInterval(LIVE_POLL);LIVE_POLL=null;
  }
}

function recordFinalScore(g){
  const arc=get(LS.nflarc,{});
  const wk='w'+(NFL_SEASON||'')+(NFL_WEEK||'');
  if(!arc[wk])arc[wk]={rows:[],finals:{},ts:Date.now()};

}

function snapshotNFL(){
  if(!NFL_GAMES||!NFL_GAMES.length)return;
  const wk='w'+(NFL_SEASON||'')+(NFL_WEEK||'');
  const arc=get(LS.nflarc,{});
  const A=arc[wk]||(arc[wk]={rows:[],finals:{},ts:Date.now()});
  const isFinal=g=>g.abstract==='post'||g.status==='STATUS_FINAL';

  NFL_GAMES.forEach(g=>{
    if(isFinal(g)&&g.away.score!=null&&g.home.score!=null){
      A.finals[g.id]={a:g.away.score,h:g.home.score};
    }
    const s=NFL_SIMS[g.id];if(!s)return;
    const existing=A.rows.find(r=>r.id===g.id);if(existing)return;
    const si=nflIsDivisionGame(g)?'division':
      NFL_DIVISION[g.away.abbr]&&NFL_DIVISION[g.home.abbr]&&
      NFL_DIVISION[g.away.abbr].split(' ')[0]===NFL_DIVISION[g.home.abbr].split(' ')[0]?
      'conference':'neutral';
    A.rows.push({
      id:g.id,game:g.away.abbr+'@'+g.home.abbr,
      awayProj:s.awayProj,homeProj:s.homeProj,
      hw:s.hw,aw:s.aw,med:s.med,medMargin:s.medMargin,
      spreadSide:s.medMargin>0?'home':'away',
      spreadLine:Math.abs(s.medMargin),
      totalSide:s.med>45?'over':'under',
      totalLine:s.med,
      mlSide:s.hw>0.5?'home':'away',
      band:nflBandOf(Math.max(s.hw,s.aw)),
      situation:si,
      graded:false,
    });
  });
  set(LS.nflarc,arc);
}

function gradeNFLResults(){
  const arc=get(LS.nflarc,{});
  const calib=getNFLCalib();
  let changed=false,newGrades=0;
  Object.keys(arc).forEach(wk=>{
    const A=arc[wk];
    if(!A.rows||!A.finals)return;
    A.rows.forEach(r=>{
      if(r.graded)return;
      const F=A.finals[r.id];
      if(!F||F.a===null||F.h===null)return;
      // spread
      if(r.spreadSide&&r.spreadLine!=null){
        const margin=r.spreadSide==='home'?F.h-F.a:F.a-F.h;
        const hit=margin>r.spreadLine;
        const key=`spread|${r.situation||'any'}|${r.band}`;
        if(!calib[key])calib[key]={n:0,hits:0};
        calib[key].n++;if(hit)calib[key].hits++;
        r.spreadHit=hit;
      }
      // total
      if(r.totalSide&&r.totalLine!=null){
        const tot=F.a+F.h;
        const hit=r.totalSide==='over'?tot>r.totalLine:tot<r.totalLine;
        const key=`total|${r.situation||'any'}|${r.band}`;
        if(!calib[key])calib[key]={n:0,hits:0};
        calib[key].n++;if(hit)calib[key].hits++;
        r.totalHit=hit;
      }
      // ML
      if(r.mlSide){
        const hit=r.mlSide==='home'?F.h>F.a:F.a>F.h;
        const key=`side|${r.situation||'any'}|${r.band}`;
        if(!calib[key])calib[key]={n:0,hits:0};
        calib[key].n++;if(hit)calib[key].hits++;
        r.mlHit=hit;
      }
      r.graded=true;changed=true;newGrades++;
    });
    // update globalDrift
    const graded=A.rows.filter(r=>r.graded&&r.awayProj!=null&&r.homeProj!=null);
    if(graded.length){
      const diffs=graded.map(r=>{
        const F=A.finals[r.id];
        if(!F)return 0;
        return((r.awayProj-F.a)+(r.homeProj-F.h))/2;
      });
      const avgBias=diffs.reduce((a,b)=>a+b,0)/diffs.length;
      calib.globalDrift=Math.max(-1.2,Math.min(1.2,-avgBias));
    }
  });
  if(changed){
    set(NFL_CALIB_KEY,calib);
    set(LS.nflarc,arc);
    GRADED_BADGE+=newGrades;
  }
}

      if(status!=='STATUS_FINAL')return;
      const teams=comp.competitors||[];

// ── MAIN BOARD RENDER ─────────────────────────────────────────────────────────
function renderNFL(){
  const el=document.getElementById('nfl-board');if(!el)return;
  const warn=document.getElementById('nfl-warn');
  if(NFL_POWER_FLAT&&warn){
    warn.style.display='block';
    warn.innerHTML='⚠️ <b>No completed-season scoring data yet.</b> Projections show sim defaults until real game results are in.';
  }else if(warn){warn.style.display='none';}

  if(!NFL_GAMES.length){
    el.innerHTML=`<div class="empty">
      🏈 No games loaded.<br><br>
      <button class="primary" style="width:auto;padding:10px 20px" onclick="loadNFLSchedule()">Load Current Week</button>
    </div>`;
    return;
  }
  const nG=document.getElementById('nG');
  if(nG)nG.textContent=NFL_GAMES.length;

  // Sort: live first, then by time
  const sorted=[...NFL_GAMES].sort((a,b)=>{
    const order={live:0,pre:1,post:2};
    const oa=order[a.abstract]??1,ob=order[b.abstract]??1;
    if(oa!==ob)return oa-ob;
    return new Date(a.date)-new Date(b.date);
  });

  // Group by time slot
  const groups={live:[],morning:[],afternoon:[],evening:[],night:[],final:[]};
  sorted.forEach(g=>{
    if(g.abstract==='post'){groups.final.push(g);return;}
    if(g.abstract==='live'){groups.live.push(g);return;}
    const h=new Date(g.date).getHours();
    if(h<13)groups.morning.push(g);
    else if(h<16)groups.afternoon.push(g);
    else if(h<20)groups.evening.push(g);
    else groups.night.push(g);
  });

  let html='';
  const addSection=(label,games)=>{
    if(!games.length)return;
    html+=`<div class="sbar"><h2>${label}</h2><div class="ln"></div><span class="ct">${games.length}</span></div>`;
    games.forEach(g=>{html+=nflCard(g);});
  };

  if(groups.live.length)addSection('🔴 Live',groups.live);
  if(groups.morning.length)addSection('Morning Slate',groups.morning);
  if(groups.afternoon.length)addSection('Afternoon Slate',groups.afternoon);
  if(groups.evening.length)addSection('Evening Games',groups.evening);
  if(groups.night.length)addSection('Night Games',groups.night);
  if(groups.final.length)addSection('Final',groups.final);

  el.innerHTML=html;
}

// ── GAME CARD ─────────────────────────────────────────────────────────────────
function nflCard(g){
  // Get or compute sim
  if(!NFL_SIMS[g.id])NFL_SIMS[g.id]=simNFLGame(g);
  const s=NFL_SIMS[g.id];
  const gameKey=g.away.abbr+'@'+g.home.abbr;
  const wx=NFL_WEATHER[g.id];
  const awayPct=PERCENTILE_DATA[g.away.abbr]||{};
  const homePct=PERCENTILE_DATA[g.home.abbr]||{};

  // Card class
  const isPrime=NFL_PRIMETIME_HOURS.includes(new Date(g.date).getHours());
  const cardCls=g.abstract==='live'?'in-play':
    g.abstract==='post'?'done':
    isPrime?'prime':
    (s.hw>=0.7||s.aw>=0.7)?'edge':'';

  // Live score bar
  let liveBar='';
  if(g.abstract==='live'){
    const q=g.period?`Q${g.period}`:g.clock?'LIVE':'';
    liveBar=`<div class="live-bar">
      <div>
        <div class="live-score">${g.away.abbr} ${g.away.score??'—'} · ${g.home.abbr} ${g.home.score??'—'}</div>
        ${g.situation&&g.situation.downDistanceText?`<div class="live-situation">${g.situation.downDistanceText} · ${g.situation.possessionText||''}</div>`:''}
      </div>
      <div class="live-clock">${q}${g.clock?' · '+g.clock:''}</div>
    </div>`;
  }

  // Final score bar
  let finalBar='';
  if(g.abstract==='post'&&g.away.score!=null&&g.home.score!=null){
    const awayW=g.away.score>g.home.score;
    finalBar=`<div style="background:rgba(61,220,132,.08);border-bottom:1px solid rgba(61,220,132,.15);
      padding:8px 13px;display:flex;justify-content:space-between;align-items:center">
      <span style="font-family:'Archivo';font-weight:900;font-size:20px">
        <span style="${awayW?'color:var(--win)':''}">${g.away.abbr} ${g.away.score}</span>
        <span style="color:var(--mute);font-size:14px;margin:0 6px">·</span>
        <span style="${!awayW?'color:var(--win)':''}">${g.home.abbr} ${g.home.score}</span>
      </span>
      <span style="font-family:'IBM Plex Mono';font-size:9.5px;color:var(--mute)">FINAL</span>
    </div>`;
  }

  // Projection
  const favHome=s.homeProj>=s.awayProj;
  const spread=Math.abs(s.medMargin);
  const projColor=spread>7?'var(--gold)':spread>3?'var(--cold)':'var(--chalk)';

  // Trend-adjusted note (if calibration has corrected significantly)
  const drift=getNFLCalib().globalDrift||0;
  const adjNote=Math.abs(drift)>0.5?
    `<span class="proj-adj">adj ${drift>0?'+':''}${drift.toFixed(1)} drift</span>`:'';

  // Percentile chips
  let pctChips='';
  const awayOffL=percentileLabel(awayPct.offPct);
  const awayDefL=percentileLabel(awayPct.defPct);
  const homeOffL=percentileLabel(homePct.offPct);
  const homeDefL=percentileLabel(homePct.defPct);
  if(awayOffL)pctChips+=`<span class="chip ${awayOffL.cls}">⚡ ${g.away.abbr} OFF ${awayOffL.text}</span>`;
  if(awayDefL)pctChips+=`<span class="chip ${awayDefL.cls}">🛡 ${g.away.abbr} DEF ${awayDefL.text}</span>`;
  if(homeOffL)pctChips+=`<span class="chip ${homeOffL.cls}">⚡ ${g.home.abbr} OFF ${homeOffL.text}</span>`;
  if(homeDefL)pctChips+=`<span class="chip ${homeDefL.cls}">🛡 ${g.home.abbr} DEF ${homeDefL.text}</span>`;

  // Situation chips
  let sitChips='';
  if(nflIsDivisionGame(g))sitChips+=`<span class="chip violet">DIVISION</span>`;
  if(isPrime)sitChips+=`<span class="chip violet">PRIMETIME</span>`;
  if(NFL_DOME.has(g.home.abbr))sitChips+=`<span class="chip cold">DOME</span>`;
  else if(wx&&wx.windSpeed>15)sitChips+=`<span class="chip hot">💨 ${Math.round(wx.windSpeed)}mph WIND</span>`;
  else if(wx&&wx.temp<35)sitChips+=`<span class="chip cold">🥶 ${Math.round(wx.temp)}°F</span>`;
  if(g.broadcast)sitChips+=`<span class="chip">${g.broadcast}</span>`;

  // Book lines
  const awaySpread=bookLine(gameKey,'spread','away');
  const homeSpread=bookLine(gameKey,'spread','home');
  const awayML=bookLine(gameKey,'moneyline','away');
  const homeML=bookLine(gameKey,'moneyline','home');
  const overLine=bookLine(gameKey,'total','over');
  const underLine=bookLine(gameKey,'total','under');

  // Sim probabilities
  const awaySpreadProb=awaySpread?s.awayCover(awaySpread.line||spread):s.aw;
  const homeSpreadProb=homeSpread?s.homeCover(homeSpread.line||spread):s.hw;
  const overProb=overLine?s.over(overLine.line||s.med):s.over(s.med);
  const underProb=1-overProb;

  function betTile(line,prob,label,gid,side){
    const inS=inSlip(gid,label);
    const ev=line?evPct(prob,line.price):null;
    const edgeCls=ev!=null?(ev>3?'green':ev<-3?'red':''):
      prob>0.65?'green':prob<0.35?'red':'';
    const realBadge=line?`<div class="bet-real">REAL ·${line.price>0?'+':''}${line.price}</div>`:'';
    return`<div class="bet ${edgeCls}${inS?' on':''}"
      onclick="slipToggle('${gid}','${label}',${line?line.price:(prob>0.5?-150:130)})">
      <div class="bet-line">${label}</div>
      ${realBadge}
      <div class="bet-price">${line?`${line.line!=null?(line.line>0?'+':'')+line.line+' ':''}${line.price>0?'+':''}${line.price}`:`sim ${pct(prob,0)}`}</div>
      <div class="bet-ev ${ev!=null?(ev>0?'pos':'neg'):'neu'}">${ev!=null?(ev>0?'+':'')+ev.toFixed(1)+'% EV':'model '+pct(prob,0)}</div>
      <div class="bet-prob">${pct(prob,0)} chance</div>
    </div>`;
  }

  const spreadGrid=`
    <div class="mktlab">Spread</div>
    <div class="betgrid">
      ${betTile(awaySpread,awaySpreadProb,`${g.away.abbr} ${awaySpread?((awaySpread.line||0)>0?'+':'')+awaySpread.line:'+'+spread.toFixed(1)}`,g.id,`${g.away.abbr} spread`)}
      ${betTile(homeSpread,homeSpreadProb,`${g.home.abbr} ${homeSpread?((homeSpread.line||0)>0?'+':'')+homeSpread.line:'-'+spread.toFixed(1)}`,g.id,`${g.home.abbr} spread`)}
    </div>`;
  const mlGrid=`
    <div class="mktlab">Moneyline</div>
    <div class="betgrid">
      ${betTile(awayML,s.aw,`${g.away.abbr} ML`,g.id,`${g.away.abbr} ML`)}
      ${betTile(homeML,s.hw,`${g.home.abbr} ML`,g.id,`${g.home.abbr} ML`)}
    </div>`;
  const totGrid=`
    <div class="mktlab">Total${overLine?` (${overLine.line})`:` (${s.med})`}</div>
    <div class="betgrid">
      ${betTile(overLine,overProb,`Over ${overLine?overLine.line:s.med}`,g.id,`Over ${overLine?overLine.line:s.med}`)}
      ${betTile(underLine,underProb,`Under ${underLine?underLine.line:s.med}`,g.id,`Under ${underLine?underLine.line:s.med}`)}
    </div>`;

  return`<div class="game ${cardCls}" id="gc-${g.id}">
    ${liveBar||finalBar}
    <div class="ghd">
      <div class="g-row1">
        <div class="teams">
          ${g.away.ranking?`<sup class="rank">#${g.away.ranking}</sup>`:''}${g.away.shortName||g.away.abbr}
          <span class="at">@</span>
          ${g.home.ranking?`<sup class="rank">#${g.home.ranking}</sup>`:''}${g.home.shortName||g.home.abbr}
        </div>
        <div class="g-meta">
          ${g.abstract==='pre'?fmtTime(g.date):''}
          ${g.away.record&&g.home.record?`<br>${g.away.record} · ${g.home.record}`:''}
          ${isPrime?`<br><span class="prime-chip">★ PRIME</span>`:''}
        </div>
      </div>
      <div class="proj-row">
        <span class="proj-score" style="color:${!favHome?'var(--chalk)':'var(--mute)'}">
          ${s.awayProj}
        </span>
        <span class="proj-vs">–</span>
        <span class="proj-score" style="color:${favHome?'var(--chalk)':'var(--mute)'}">
          ${s.homeProj}
        </span>
        <span class="proj-tag">SIM</span>
        ${adjNote}
        <span style="font-family:'IBM Plex Mono';font-size:10px;color:var(--dim)">
          O/U ${s.med} · ${Math.abs(s.medMargin).toFixed(1)} line
        </span>
      </div>
      <div class="chips">${pctChips}${sitChips}</div>
    </div>
    <div class="mktblock">
      ${spreadGrid}${mlGrid}${totGrid}
    </div>
    <div class="ptabs" id="pt-${g.id}">
      <button class="on" onclick="showPanel('${g.id}','scout',this)">🔭 Scout</button>
      <button onclick="showPanel('${g.id}','coord',this)">📊 Stats</button>
      <button onclick="showPanel('${g.id}','props',this)">🎯 Props</button>
      <button onclick="showPanel('${g.id}','weather',this)">🌦 Weather</button>
      <button onclick="showPanel('${g.id}','kicker',this)">👟 Kicker</button>
      <button onclick="showPanel('${g.id}','ag',this)">A-G</button>
      <button onclick="showPanel('${g.id}','coach',this)">🧠 Coach</button>
      <button onclick="showPanel('${g.id}','box',this)">📋 Box</button>
      <button onclick="showPanel('${g.id}','trends',this)">Trends</button>
      <button onclick="showPanel('${g.id}','take',this)">Take/Fade</button>
    </div>
    <div id="pp-${g.id}" class="panel on">${scoutPanel(g,s)}</div>
  </div>`;
}

  const g=NFL_GAMES.find(x=>x.id===gid);

    box:()=>boxPanel(g,s),

  };
  panel.innerHTML=(content[which]||content.scout)();
}

// ── SCOUT PANEL (WR/DB matchups, exposures) ───────────────────────────────────
function scoutPanel(g,s){
  const matchups=getWRDBMatchup(g);
  const awayWRs=getWRs(g.away.abbr);
  const homeWRs=getWRs(g.home.abbr);
  const awayQB=getQB(g.away.abbr);
  const homeQB=getQB(g.home.abbr);
  const awayRBs=getRBs(g.away.abbr);
  const homeRBs=getRBs(g.home.abbr);

  let html=`<div class="voice-label scout">🔭 The Scout</div>`;

  if(!awayWRs.length&&!homeWRs.length){
    html+=`<div class="empty" style="padding:20px 0">Depth chart loading — tap ↻ to refresh</div>`;
    return html;
  }

  // Offense personnel
  html+=`<div class="phead">${g.away.abbr} Offense</div>`;
  if(awayQB)html+=`<div class="matchup-row"><span class="matchup-name">${awayQB.name}</span><span class="matchup-pos">QB · Starter</span><span class="matchup-stat" style="color:var(--cold)">${s.props.away.qb_pass} proj yds</span></div>`;
  awayRBs.forEach(p=>html+=`<div class="matchup-row"><span class="matchup-name">${p.name}</span><span class="matchup-pos">RB · D${p.depth}</span><span class="matchup-stat" style="color:var(--moss)">${p.depth===1?s.props.away.rb1_rush:'—'} proj yds</span></div>`);
  awayWRs.forEach((p,i)=>html+=`<div class="matchup-row"><span class="matchup-name">${p.name}</span><span class="matchup-pos">WR · D${p.depth}</span><span class="matchup-stat">${i===0?s.props.away.wr1_rec:i===1?s.props.away.wr2_rec:'—'} proj yds</span></div>`);

  html+=`<div class="phead" style="margin-top:14px">${g.home.abbr} Offense</div>`;
  if(homeQB)html+=`<div class="matchup-row"><span class="matchup-name">${homeQB.name}</span><span class="matchup-pos">QB · Starter</span><span class="matchup-stat" style="color:var(--cold)">${s.props.home.qb_pass} proj yds</span></div>`;
  homeRBs.forEach(p=>html+=`<div class="matchup-row"><span class="matchup-name">${p.name}</span><span class="matchup-pos">RB · D${p.depth}</span><span class="matchup-stat" style="color:var(--moss)">${p.depth===1?s.props.home.rb1_rush:'—'} proj yds</span></div>`);
  homeWRs.forEach((p,i)=>html+=`<div class="matchup-row"><span class="matchup-name">${p.name}</span><span class="matchup-pos">WR · D${p.depth}</span><span class="matchup-stat">${i===0?s.props.home.wr1_rec:i===1?s.props.home.wr2_rec:'—'} proj yds</span></div>`);

  // Matchup edges
  if(matchups.length){
    html+=`<div class="phead" style="margin-top:14px">🔥 Matchup Edges</div>`;
    matchups.forEach(m=>{
      html+=`<div class="matchup-row">
        <div style="flex:1">
          <div class="matchup-name">${m.label}</div>
          <div style="font-size:11px;color:var(--mute);margin-top:2px">${m.note}</div>
          ${m.players.length?`<div style="font-size:10px;color:var(--dim);margin-top:3px">Key players: ${m.players.join(', ')}</div>`:''}
        </div>
        <span class="matchup-edge ${m.edge==='advantage'?'adv':'dis'}">${m.edge==='advantage'?'EDGE ↑':'EXPOSED ↓'}</span>
      </div>`;
    });
  }

  // Ext picks (uploaded from Covers etc.)
  const ext=extFor(g.away.abbr+'@'+g.home.abbr);
  if(ext.length){
    html+=`<div class="phead" style="margin-top:14px">📡 Outside Picks</div>`;
    ext.forEach(e=>{
      html+=`<div class="trend-row">
        <div class="trend-text">${e.pick||e.side||''} ${e.line||''} ${e.price?`(${e.price>0?'+':''}${e.price})`:''}</div>
        <div class="trend-rec" style="color:var(--mute)">${e.src||'uploaded'}</div>
      </div>`;
    });
  }

  return html;
}

// ── COORDINATOR PANEL (team stats, percentiles) ───────────────────────────────
function coordPanel(g,s){
  let html=`<div class="voice-label coord">📊 The Coordinator</div>`;
  const ap=PERCENTILE_DATA[g.away.abbr]||{};
  const hp=PERCENTILE_DATA[g.home.abbr]||{};
  const aPow=NFL_POWER[g.away.abbr];
  const hPow=NFL_POWER[g.home.abbr];

  if(!aPow&&!hPow){
    html+=`<div class="note">Season stats not yet available — projections use league averages until teams play games.</div>`;
    return html;
  }

  html+=`<div class="phead">${g.away.abbr} · ${aPow?`${aPow.wins}-${aPow.losses}`:''}</div>`;
  if(aPow){
    html+=pctBar(`Offense PPG`,aPow.offPPG,14,35,ap.offPct);
    html+=pctBar(`Defense PPG allowed`,aPow.defPPG,14,35,1-ap.defPct,true);
  }

  html+=`<div class="phead" style="margin-top:14px">${g.home.abbr} · ${hPow?`${hPow.wins}-${hPow.losses}`:''}</div>`;
  if(hPow){
    html+=pctBar(`Offense PPG`,hPow.offPPG,14,35,hp.offPct);
    html+=pctBar(`Defense PPG allowed`,hPow.defPPG,14,35,1-hp.defPct,true);
  }

  html+=`<div class="phead" style="margin-top:14px">Head-to-Head</div>`;
  html+=`<div class="intel-row">
    <span class="intel-label">Away offense</span>
    <span class="intel-val">${aPow?aPow.offPPG.toFixed(1):22} PPG</span>
    <span class="intel-sub">vs ${hPow?hPow.defPPG.toFixed(1):22} allowed</span>
  </div>
  <div class="intel-row">
    <span class="intel-label">Home offense</span>
    <span class="intel-val">${hPow?hPow.offPPG.toFixed(1):22} PPG</span>
    <span class="intel-sub">vs ${aPow?aPow.defPPG.toFixed(1):22} allowed</span>
  </div>
  <div class="intel-row">
    <span class="intel-label">Projected total</span>
    <span class="intel-val">${s.med}</span>
    <span class="intel-sub">range ${s.p10}–${s.p90}</span>
  </div>
  <div class="intel-row">
    <span class="intel-label">Division game</span>
    <span class="intel-val">${nflIsDivisionGame(g)?'Yes — tighter lines':'No'}</span>
  </div>
  <div class="intel-row">
    <span class="intel-label">Surface</span>
    <span class="intel-val">${NFL_TURF.has(g.home.abbr)?'Turf (+3% scoring)':'Natural grass'}</span>
  </div>`;

  return html;
}

function pctBar(label,val,min,max,pct,inverse=false){
  const normalized=Math.max(0,Math.min(1,(val-min)/(max-min)));
  const fillCls=pct>=0.85?'elite-high':pct<=0.15?'elite-low':'mid';
  const label2=percentileLabel(pct);
  return`<div class="pct-bar-wrap">
    <div class="pct-label">${label}</div>
    <div class="pct-bar"><div class="pct-fill ${fillCls}" style="width:${(normalized*100).toFixed(0)}%"></div></div>
    <div class="pct-val" style="color:${label2?label2.color:'var(--mute)'}">${label2?label2.text:val.toFixed(1)}</div>
  </div>`;
}

// ── PROPS PANEL ───────────────────────────────────────────────────────────────
function propsPanel(g,s){
  let html=`<div class="voice-label stats">🎯 The Statistician</div>
    <div class="note" style="margin-bottom:12px">
      <b>70%+ confidence only.</b> Frequency = how often the sim hit that line in 10,000 runs.
    </div>`;

  const awayQB=getQB(g.away.abbr);
  const homeQB=getQB(g.home.abbr);
  const awayWR1=getWRs(g.away.abbr)[0];
  const homeWR1=getWRs(g.home.abbr)[0];
  const awayRB1=getRBs(g.away.abbr)[0];
  const homeRB1=getRBs(g.home.abbr)[0];
  const awayTE1=getTEs(g.away.abbr)[0];
  const homeTE1=getTEs(g.home.abbr)[0];

  const uploaded=bookLinesFor(g.away.abbr+'@'+g.home.abbr).filter(l=>l.market==='prop'&&l.player);

  // Build prop lines: use uploaded if available, else sim-derived
  const props=[];

  function addProp(player,team,statKey,projVal,bookLine,stat,sd){
    if(!player)return;
    const line=bookLine||projVal*0.95;
    const freq=simPropFreq(projVal,line,sd);
    const overFreq=freq,underFreq=1-freq;
    if(Math.max(overFreq,underFreq)<0.60)return; // only show 60%+ (70 preferred)
    props.push({
      player:player.name||team+' '+stat,
      team,stat,projVal,line,
      overFreq,underFreq,
      recommendation:overFreq>=0.70?'OVER':underFreq>=0.70?'UNDER':
        overFreq>=0.60?'lean over':'lean under',
      confidence:Math.max(overFreq,underFreq),
      bookLine:!!bookLine,
    });
  }

  addProp(awayQB,g.away.abbr,'qb_pass',s.props.away.qb_pass,
    uploaded.find(l=>l.player&&l.player.toLowerCase().includes(awayQB&&awayQB.name.split(' ').pop().toLowerCase()||'')&&/pass/i.test(l.stat||''))?.line,
    'Pass Yds',65);
  addProp(homeQB,g.home.abbr,'qb_pass',s.props.home.qb_pass,null,'Pass Yds',65);
  addProp(awayWR1,g.away.abbr,'wr1_rec',s.props.away.wr1_rec,null,'Rec Yds',25);
  addProp(homeWR1,g.home.abbr,'wr1_rec',s.props.home.wr1_rec,null,'Rec Yds',25);
  addProp(awayRB1,g.away.abbr,'rb1_rush',s.props.away.rb1_rush,null,'Rush Yds',30);
  addProp(homeRB1,g.home.abbr,'rb1_rush',s.props.home.rb1_rush,null,'Rush Yds',30);
  addProp(awayTE1,g.away.abbr,'te1_rec',s.props.away.te1_rec,null,'Rec Yds',18);
  addProp(homeTE1,g.home.abbr,'te1_rec',s.props.home.te1_rec,null,'Rec Yds',18);

  // Also add uploaded props
  uploaded.forEach(l=>{
    const exists=props.find(p=>p.player===l.player);
    if(!exists&&l.player&&l.line){
      const projVal=l.side==='over'?l.line*1.05:l.line*0.95;
      const freq=simPropFreq(projVal,l.line,20);
      props.push({
        player:l.player,team:l.away||'',stat:l.stat||'Prop',
        projVal,line:l.line,overFreq:freq,underFreq:1-freq,
        recommendation:freq>=0.70?'OVER':(1-freq)>=0.70?'UNDER':'lean',
        confidence:Math.max(freq,1-freq),bookLine:true,
      });
    }
  });

  props.sort((a,b)=>b.confidence-a.confidence);

  if(!props.length){
    html+=`<div class="empty" style="padding:20px 0">Upload odds or depth chart needed for prop analysis</div>`;
    return html;
  }

  props.forEach(p=>{
    const recCls=p.recommendation.includes('OVER')?'prop-hit':
      p.recommendation.includes('UNDER')?'prop-miss':'prop-lean';
    html+=`<div class="prop-row">
      <div>
        <div class="prop-player">${p.player}</div>
        <div class="prop-stat">${p.team} · ${p.stat}</div>
        ${p.bookLine?`<div style="font-size:9px;color:var(--gold);font-family:'IBM Plex Mono'">REAL LINE</div>`:''}
      </div>
      <div style="text-align:right">
        <div class="prop-line">O/U ${p.line.toFixed(1)}</div>
        <div class="prop-conf ${recCls}" style="font-family:'IBM Plex Mono';font-size:10px;font-weight:700">
          ${p.recommendation}
        </div>
        <div class="prop-freq" style="color:var(--dim)">
          Sim: O ${pct(p.overFreq,0)} · U ${pct(p.underFreq,0)}
        </div>
        <div style="font-family:'IBM Plex Mono';font-size:9px;color:var(--dim)">
          proj ${p.projVal} yds
        </div>
      </div>
    </div>`;
  });

  return html;
}

function agPanel(g,s){
  const consensus=consensusFor(g.away.abbr+'@'+g.home.abbr);
  const spread=Math.abs(s.medMargin);
  const favTeam=s.hw>=0.5?g.home:g.away;
  const dogTeam=s.hw<0.5?g.home:g.away;
  const sysBook=consensus.find(c=>c.market==='spread');
  const sysTotal=consensus.find(c=>c.market==='total');

  const sections=[
    {l:'A',label:'Projection',val:`${g.away.abbr} ${s.awayProj} · ${g.home.abbr} ${s.homeProj}<br>
      <span style="color:var(--mute);font-size:12px">Total ${s.med} · ${favTeam.abbr} favored by ${spread.toFixed(1)}</span>`},
    {l:'B',label:'Spread Edge',val:`Model: ${favTeam.abbr} ${(s.hw>=.5?s.hw:s.aw).toFixed(0)} win prob<br>
      <span style="color:var(--mute);font-size:12px">Calibrated spread ${spread.toFixed(1)} · ${nflIsDivisionGame(g)?'Division game — tighten by 3%':'Non-division'}</span>`},
    {l:'C',label:'Total Signal',val:`Model total ${s.med} · Over prob at ${pct(s.over(s.med),0)}<br>
      <span style="color:var(--mute);font-size:12px">Range ${s.p10}–${s.p90} · ${s.env<0.98?'Weather suppressing by '+(((1-s.env)*100).toFixed(0))+'%':'No weather impact'}</span>`},
    {l:'D',label:'Best Picks',val:`${s.hw>=0.65||s.aw>=0.65?`<span style="color:var(--win)">ML play: ${favTeam.abbr} at ${pct(Math.max(s.hw,s.aw),0)}</span>`:'No strong ML edge'}<br>
      ${s.over(s.med)>=0.65?`<span style="color:var(--win)">Over ${s.med} at ${pct(s.over(s.med),0)}</span>`:
      s.over(s.med)<=0.35?`<span style="color:var(--win)">Under ${s.med} at ${pct(1-s.over(s.med),0)}</span>`:'Total is a coin flip'}`},
    {l:'E',label:'Matchup',val:`${g.away.abbr} off (${(NFL_POWER[g.away.abbr]&&NFL_POWER[g.away.abbr].offPPG||22).toFixed(1)} PPG) vs ${g.home.abbr} def (${(NFL_POWER[g.home.abbr]&&NFL_POWER[g.home.abbr].defPPG||22).toFixed(1)} allowed)<br>
      ${g.home.abbr} off (${(NFL_POWER[g.home.abbr]&&NFL_POWER[g.home.abbr].offPPG||22).toFixed(1)} PPG) vs ${g.away.abbr} def (${(NFL_POWER[g.away.abbr]&&NFL_POWER[g.away.abbr].defPPG||22).toFixed(1)} allowed)`},
    {l:'F',label:'Consensus',val:sysBook?`Public: ${sysBook.awayPct||'?'}% ${g.away.abbr} · ${sysBook.homePct||'?'}% ${g.home.abbr}`:
      `No consensus data — upload from Covers`},
    {l:'G',label:'Confidence',val:`${s.hw>=0.7||s.aw>=0.7?'<span style="color:var(--gold)">HIGH</span>':
      s.hw>=0.6||s.aw>=0.6?'<span style="color:var(--win)">MODERATE</span>':
      '<span style="color:var(--mute)">LOW</span>'} · Sim ${s.N.toLocaleString()} iterations<br>
      <span style="color:var(--mute);font-size:12px">Mode score: ${s.modeScore||'—'} (${pct(s.modeScorePct||0,0)} frequency)</span>`},
  ];

  return`<div class="voice-label coord">📐 A–G Analysis</div>`+

// ── COACH PANEL ───────────────────────────────────────────────────────────────
function coachPanel(g,s){
  const favHome=s.homeProj>=s.awayProj;
  const favTeam=favHome?g.home:g.away;
  const dogTeam=favHome?g.away:g.home;
  const spread=Math.abs(s.medMargin);
  const conf=Math.max(s.hw,s.aw);
  const confWord=conf>=0.75?'strong':conf>=0.65?'moderate':'low';
  const wx=NFL_WEATHER[g.id];
  const isDome=NFL_DOME.has(g.home.abbr);
  const isDiv=nflIsDivisionGame(g);
  const awayPct=PERCENTILE_DATA[g.away.abbr]||{};
  const homePct=PERCENTILE_DATA[g.home.abbr]||{};
  const ext=extFor(g.away.abbr+'@'+g.home.abbr);
  const consensus=consensusFor(g.away.abbr+'@'+g.home.abbr);
  const pubSpread=consensus.find(c=>c.market==='spread');

  let brief=`<b>${favTeam.abbr} is the model's preferred side</b> in this matchup, projected to win ${s.homeProj>=s.awayProj?s.homeProj+'-'+s.awayProj:s.awayProj+'-'+s.homeProj} — a ${spread.toFixed(1)}-point edge with <span class="signal">${confWord} confidence</span>.`;

  if(isDiv)brief+=` This is a <b>division game</b> — the model tightens projections by 4% because divisional opponents know each other and these games run historically closer than the line suggests.`;

  if(!isDome&&wx){
    if(wx.windSpeed>20)brief+=` <span class="warn">Heavy wind (${Math.round(wx.windSpeed)}mph) is a serious factor</span> — fade passing offenses and total overs. Kicking range is compromised.`;
    else if(wx.windSpeed>15)brief+=` Wind (${Math.round(wx.windSpeed)}mph) will affect deep passing and long field goals.`;
    if(wx.temp<35)brief+=` <span class="warn">Freezing conditions (${Math.round(wx.temp)}°F)</span> — ball-handling mistakes increase, lean slightly under.`;
  }

  if(awayPct.offTop5&&homePct.defBot5)brief+=` <span class="signal">Elite offense meets weak defense</span> — the away passing attack is primed to exploit. Look at WR over props.`;
  else if(homePct.offTop5&&awayPct.defBot5)brief+=` <span class="signal">Home elite offense vs a bottom-tier defense</span> — this is a scoring environment. Total could be in play.`;

  if(ext.length){
    const sameDir=ext.filter(e=>{
      const side=e.side||'';
      return (side.includes(favTeam.abbr)||side.includes('home')&&favHome||side.includes('away')&&!favHome);
    });
    if(sameDir.length>=2)brief+=` <span class="signal">Outside sources confirm the model's side</span> — ${sameDir.length} uploaded picks agree with the projection.`;
    else if(ext.length>0)brief+=` Outside picks diverge from the model — convergence is weaker here.`;
  }

  if(pubSpread){
    const pubFavsHome=(pubSpread.homePct||0)>(pubSpread.awayPct||0);
    if(pubFavsHome!==favHome)brief+=` <span class="warn">Note: public money is on the opposite side from the model.</span> Fade potential if the model's signal is strong.`;
  }

  brief+=` Mode score: <b>${s.modeScore||'—'}</b>. The 10th–90th percentile range is <b>${s.p10}–${s.p90}</b>.`;

  // Distinct from raw prediction — this is the Coach's interpretation
  const predProj=`<br><br><b>Prediction:</b> ${g.away.abbr} ${s.awayProj} – ${g.home.abbr} ${s.homeProj} · Total ${s.med}`;
  const coachTake=`<b>Coach's take:</b> ${favTeam.abbr} ${spread>0?'-'+spread.toFixed(1):''} is my best play here, with particular interest in the ${s.over(s.med)>0.6?'over':'under'} on the total.`;

  return`<div class="voice-label coach">🧠 The Coach</div>
    <div class="coach-brief">${brief}${predProj}<br><br>${coachTake}</div>`;
}

        <div class="trend-rec ${t.rec&&t.rec.toLowerCase().includes('over')?'trend-over':
          t.rec&&t.rec.toLowerCase().includes('under')?'trend-under':'trend-neutral'}">
          ${t.rec||''}
        </div>
      </div>`;
    });
  }

  if(!consensus.length&&!trends.length){
    html+=`<div class="note">No trends or consensus data. Upload from Covers or another source via the Odds tab.</div>`;
  }

  // Historical situational trends from calibration
  const calib=getNFLCalib();
  const si=nflIsDivisionGame(g)?'division':'neutral';
  const spreadKey=`spread|${si}|${nflBandOf(Math.max(s.hw,s.aw))}`;
  const totalKey=`total|${si}|${nflBandOf(s.over(s.med))}`;
  const sk=calib[spreadKey],tk=calib[totalKey];
  if(sk&&sk.n>=5||tk&&tk.n>=5){
    html+=`<div class="phead" style="margin-top:14px">System History (${si})</div>`;
    if(sk&&sk.n>=5)html+=`<div class="trend-row"><div class="trend-text">Spread accuracy in this confidence band</div>
      <div class="trend-rec ${sk.hits/sk.n>0.55?'trend-over':'trend-neutral'}">${sk.hits}-${sk.n-sk.hits} (${pct(sk.hits/sk.n,0)})</div></div>`;
    if(tk&&tk.n>=5)html+=`<div class="trend-row"><div class="trend-text">Total accuracy in this confidence band</div>
      <div class="trend-rec ${tk.hits/tk.n>0.55?'trend-over':'trend-neutral'}">${tk.hits}-${tk.n-tk.hits} (${pct(tk.hits/tk.n,0)})</div></div>`;
  }

  return html;
}

// ── TAKE/FADE PANEL ───────────────────────────────────────────────────────────
function takePanel(g,s){
  const gameKey=g.away.abbr+'@'+g.home.abbr;
  const conf=Math.max(s.hw,s.aw);
  const spread=Math.abs(s.medMargin);
  const favTeam=s.hw>=0.5?g.home:g.away;
  const overConf=s.over(s.med);
  const consensus=consensusFor(gameKey);
  const ext=extFor(gameKey);
  const pubSpread=consensus.find(c=>c.market==='spread');

  // Check convergence: model + book + public all agree?
  const modelFavHome=s.hw>=0.5;
  const pubFavHome=pubSpread?(pubSpread.homePct||0)>(pubSpread.awayPct||0):null;
  const extFavHome=ext.length>0?ext.filter(e=>e.side&&(e.side.includes(g.home.abbr)||e.side.includes('home'))).length>
    ext.filter(e=>e.side&&(e.side.includes(g.away.abbr)||e.side.includes('away'))).length:null;

  const convergence=
    (pubFavHome===null?0:pubFavHome===modelFavHome?1:0)+
    (extFavHome===null?0:extFavHome===modelFavHome?1:0);

  let verdict,verdictSub;
  if(conf>=0.75&&convergence>=1){
    verdict='SUPREME';
    verdictSub=`All signals aligned on ${favTeam.abbr}. ${pct(conf,0)} model confidence + outside confirmation.`;
  }else if(conf>=0.70){
    verdict='STRONG';
    verdictSub=`High model confidence on ${favTeam.abbr} (${pct(conf,0)}). ${convergence>0?'Outside picks agree.':'No outside confirmation.'}`;
  }else if(conf>=0.60){
    verdict='LEAN';
    verdictSub=`Moderate edge on ${favTeam.abbr}. ${convergence>0?'Slight outside confirmation.':'Plays in isolation.'}`;
  }else if(convergence>=2){
    verdict='LEAN';
    verdictSub=`Model signal is weak but public + outside sources both point to ${favTeam.abbr}.`;
  }else if(pubFavHome!==null&&pubFavHome!==modelFavHome){
    verdict='SPLIT';
    verdictSub=`Model and public are on opposite sides. Conflicting signals — reduce sizing.`;
  }else{
    verdict='AVOID';
    verdictSub=`No clear edge. Sim too close to call, no outside confirmation.`;
  }

  const picks=[];
  if(conf>=0.65)picks.push({label:`${favTeam.abbr} ML`,cls:'play'});
  if(conf>=0.60&&spread>2)picks.push({label:`${favTeam.abbr} -${spread.toFixed(1)}`,cls:'play'});
  if(overConf>=0.70)picks.push({label:`Over ${s.med}`,cls:'play'});
  else if(overConf<=0.30)picks.push({label:`Under ${s.med}`,cls:'play'});

  return`<div class="verdict">
    <div class="verdict-word ${verdict.toLowerCase()}">${verdict}</div>
    <div class="verdict-sub">${verdictSub}</div>
    <div class="verdict-pick">${picks.map(p=>`<span class="badge ${p.cls}">${p.label}</span>`).join('')}</div>
    <div style="margin-top:16px;font-family:'IBM Plex Mono';font-size:10px;color:var(--dim)">
      Model: ${pct(conf,0)} · Mode: ${s.modeScore||'—'} · Total: ${s.med} (${pct(overConf,0)} over)
    </div>
  </div>`;
}

// ── BEST BETS ─────────────────────────────────────────────────────────────────
function renderBest(){
  const el=document.getElementById('best-body');if(!el)return;
  if(!NFL_GAMES.length){el.innerHTML='<div class="empty">No games loaded</div>';return;}

  const plays=[];
  NFL_GAMES.forEach(g=>{
    if(g.abstract==='post')return;
    if(!NFL_SIMS[g.id])NFL_SIMS[g.id]=simNFLGame(g);
    const s=NFL_SIMS[g.id];
    const conf=Math.max(s.hw,s.aw);
    const favTeam=s.hw>=s.aw?g.home:g.away;
    const overConf=s.over(s.med);
    if(conf>=0.65)plays.push({type:'Side',game:g.away.abbr+'@'+g.home.abbr,
      pick:`${favTeam.abbr} ML`,conf,label:pct(conf,0)+' win prob',gid:g.id});
    if(overConf>=0.70)plays.push({type:'Total',game:g.away.abbr+'@'+g.home.abbr,
      pick:`Over ${s.med}`,conf:overConf,label:pct(overConf,0)+' over prob',gid:g.id});
    else if(overConf<=0.30)plays.push({type:'Total',game:g.away.abbr+'@'+g.home.abbr,
      pick:`Under ${s.med}`,conf:1-overConf,label:pct(1-overConf,0)+' under prob',gid:g.id});
  });
  plays.sort((a,b)=>b.conf-a.conf);

  // Lock today's best if any game is live
  const anyLive=NFL_GAMES.some(g=>g.abstract==='live');
  const log=get(LS.bestlog,{});
  const d=today();
  if(anyLive&&!log[d]){
    log[d]={plays:plays.slice(0,5),locked:true,lockedAt:Date.now()};
    set(LS.bestlog,log);
  }

  const locked=log[d];
  const shown=locked?locked.plays:plays.slice(0,5);

  let html=`<div class="sbar"><h2>Today's Best</h2><div class="ln"></div>
    ${locked?'<span class="ct" style="color:var(--gold)">LOCKED</span>':''}</div>`;

  if(!shown.length){html+='<div class="empty">No high-confidence plays yet</div>';
    el.innerHTML=html;return;}

  shown.forEach((p,i)=>{
    html+=`<div class="best-card">
      <div class="best-tag">#${i+1} · ${p.type} · ${p.game}</div>
      <div class="best-pick">${p.pick}</div>
      <div class="best-conf">${p.label}</div>
    </div>`;
  });

  if(!locked&&!anyLive)html+=`<div class="note">Plays lock once the first game goes live — they can't shift retroactively after tip-off.</div>`;
  el.innerHTML=html;
}

// ── CALIBRATION ───────────────────────────────────────────────────────────────
function renderCalib(){
  const el=document.getElementById('calib-body');if(!el)return;
  const calib=getNFLCalib();
  const keys=Object.keys(calib).filter(k=>k!=='globalDrift');

  let html=`<div class="sbar"><h2>Calibration System</h2><div class="ln"></div></div>
    <div class="note">
      <b>How this works:</b> Every prediction is logged. When the game grades, the system compares stated probability vs actual hit rate per confidence band. The gap becomes a correction factor on the next projection.
      ${calib.globalDrift!=null?`<br><br><b>Current global drift:</b> ${calib.globalDrift>0?'+':''}${calib.globalDrift.toFixed(2)} pts applied to every projection.`:''}
    </div>`;

  const byMarket={spread:{},total:{},side:{}};
  keys.forEach(k=>{
    const parts=k.split('|');
    if(parts.length<3)return;
    const [market,,band]=parts;
    if(!byMarket[market])return;
    byMarket[market][band]=calib[k];
  });

  ['side','spread','total'].forEach(market=>{
    const entries=Object.entries(byMarket[market]).sort((a,b)=>parseFloat(a[0])-parseFloat(b[0]));
    if(!entries.length)return;
    html+=`<div class="sbar"><h2>${market.toUpperCase()}</h2><div class="ln"></div></div><div class="tkt">`;
    entries.forEach(([band,v])=>{
      const rate=v.n>0?v.hits/v.n:null;
      const stated=parseFloat(band.split('-')[1])/100;
      html+=`<div class="calib-band">
        <div class="calib-range">${band}%</div>
        <div class="calib-bar-wrap">
          ${rate!=null?`<div class="calib-bar-fill" style="width:${(rate*100).toFixed(0)}%;background:${Math.abs(rate-stated)<0.05?'var(--win)':Math.abs(rate-stated)<0.1?'var(--gold)':'var(--rust)'}"></div>`:''}
        </div>
        <div class="calib-pct">${rate!=null?pct(rate,0):'—'}</div>
        <div class="calib-n">${v.n}n</div>
      </div>`;
    });
    html+='</div>';
  });

  if(!keys.length)html+=`<div class="empty">No calibration data yet — grades will populate this automatically.</div>`;
  el.innerHTML=html;
}

async function handleOddsFile(input){
  const file=input.files[0];if(!file)return;
  const status=document.getElementById('uploadStatus');
  if(status)status.innerHTML='<span style="color:var(--mute)">Reading file…</span>';

  if(file.type.startsWith('image/')||file.type==='application/pdf'){
    // Send to Gemini for vision parsing
    const key=get(LS.ai,'');
    if(!key){if(status)status.innerHTML='<span style="color:var(--rust)">Gemini key required for image parsing — add in Settings</span>';return;}
    const b64=await fileToBase64(file);

  }else{
    const text=await file.text();
    parseOddsText(text,status);
  }
}
