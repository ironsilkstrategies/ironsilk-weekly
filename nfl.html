function parseOddsText(text,statusEl){
  const lines=[];
  const rows=text.split('\n').filter(l=>l.trim());
  rows.forEach(row=>{
    // Try to parse various formats
    // Format: AWAY SPREAD PRICE | HOME SPREAD PRICE | O/U LINE PRICE
    const teamPat=/([A-Z]{2,4})\s+([\+\-]\d+\.?\d*)\s+([\+\-]\d+)/gi;
    const totalPat=/(over|under|o|u)\s*(\d+\.?\d*)\s+([\+\-]\d+)/i;
    let match;
    while((match=teamPat.exec(row))!==null){
      const abbr=nflAbbrFor(match[1])||match[1];
      lines.push({
        game:row,away:abbr,home:'',market:'spread',
        side:abbr,line:parseFloat(match[2]),price:parseInt(match[3]),
        capturedAt:Date.now(),src:'text',
      });
    }
    const tot=totalPat.exec(row);
    if(tot){
      const side=tot[1].toLowerCase().startsWith('o')?'over':'under';
      lines.push({
        game:row,market:'total',side,
        line:parseFloat(tot[2]),price:parseInt(tot[3]),
        capturedAt:Date.now(),src:'text',
      });
    }
  });

  if(lines.length){
    const store=get(LS.nflshots,{});
    store[today()]=[...(store[today()]||[]),...lines];
    set(LS.nflshots,store);
    if(statusEl)statusEl.innerHTML=`<span style="color:var(--win)">✓ Saved ${lines.length} lines</span>`;
    renderLinesList();renderNFL();
  }else{
    if(statusEl)statusEl.innerHTML=`<span style="color:var(--rust)">Couldn't parse any lines — try: KC -3 -110 | O47.5 -110</span>`;
  }
}

async function fileToBase64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=e=>res(e.target.result.split(',')[1]);
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}

async function parseWithGemini(b64,mimeType,statusEl){
  const key=get(LS.ai,'');if(!key)return;
  if(statusEl)statusEl.innerHTML='<span style="color:var(--mute)">Analyzing image…</span>';
  try{
    const prompt=`Extract all NFL betting lines from this sportsbook screenshot. For each game return JSON objects in an array: [{away, home, market, side, line, price}]. Markets: spread, moneyline, total. Side: away/home/over/under. Price in American odds. Return only the JSON array, nothing else.`;
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[
        {inline_data:{mime_type:mimeType,data:b64}},
        {text:prompt}
      ]}],generationConfig:{temperature:0.1,maxOutputTokens:2000}})
    });
    const j=await r.json();
    const raw=j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts&&j.candidates[0].content.parts[0]&&j.candidates[0].content.parts[0].text||'';
    const jsonStr=raw.replace(/```json|```/g,'').trim();
    const picks=JSON.parse(jsonStr);
    if(Array.isArray(picks)&&picks.length){
      // Resolve abbreviations
      const resolved=picks.map(p=>({
        ...p,
        away:nflAbbrFor(p.away)||p.away,
        home:nflAbbrFor(p.home)||p.home,
        game:(nflAbbrFor(p.away)||p.away)+'@'+(nflAbbrFor(p.home)||p.home),
        capturedAt:Date.now(),src:'gemini',
      }));
      const store=get(LS.nflshots,{});
      store[today()]=[...(store[today()]||[]),...resolved];
      set(LS.nflshots,store);
      if(statusEl)statusEl.innerHTML=`<span style="color:var(--win)">✓ ${resolved.length} lines extracted</span>`;
      renderLinesList();renderNFL();
    }else{if(statusEl)statusEl.innerHTML='<span style="color:var(--rust)">No lines found in image</span>';}
  }catch(e){if(statusEl)statusEl.innerHTML=`<span style="color:var(--rust)">Error: ${e.message}</span>`;}
}

function importData(input){
  const file=input.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(data.nflarc)set(LS.nflarc,data.nflarc);
      if(data.nflcalib)set(NFL_CALIB_KEY,data.nflcalib);
      if(data.locked)set(LS.locked,data.locked);
      if(data.bestlog)set(LS.bestlog,data.bestlog);
      if(data.convergence)set(LS.convergence,data.convergence);
      if(data.teamledger)set(LS.teamledger,data.teamledger);
      showToast('Backup restored');
      location.reload();
    }catch(err){showToast('Invalid backup file');}
  };
  r.readAsText(file);
}
function hardReload(){
  if(typeof caches!=='undefined'){
    caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k)))).then(()=>location.reload(true));
  }else{location.reload(true);}
}

CHAT=[];
function paintChat(){
  const el=document.getElementById('chat-msgs');if(!el)return;
  el.innerHTML=CHAT.map(m=>`<div style="margin-bottom:10px;${m.role==='user'?'text-align:right':''}">
    <div style="display:inline-block;max-width:85%;background:${m.role==='user'?'rgba(255,180,61,.12)':'var(--panel2)'};
      border:1px solid ${m.role==='user'?'rgba(255,180,61,.25)':'var(--rule)'};
      border-radius:12px;padding:10px 12px;text-align:left;font-size:13px;line-height:1.5">
      ${m.content.replace(/</g,'&lt;')}
    </div>
  </div>`).join('');
  el.scrollTop=el.scrollHeight;
}
async function sendChat(){
  const inp=document.getElementById('chatInput');if(!inp)return;
  const q=inp.value.trim();if(!q)return;
  inp.value='';
  CHAT.push({role:'user',content:q});paintChat();

  const key=get(LS.ai,'');
  if(!key){CHAT.push({role:'assistant',content:'Gemini key needed for chat — add it in Settings.'});paintChat();return;}

  // Build context
  const context=NFL_GAMES.slice(0,5).map(g=>{
    const s=NFL_SIMS[g.id]||simNFLGame(g);
    return`${g.away.abbr} @ ${g.home.abbr}: proj ${s.awayProj}-${s.homeProj}, spread ${Math.abs(s.medMargin).toFixed(1)}, total ${s.med}`;
  }).join('\n');

  const sysPrompt=`You are TheDesk, an NFL betting intelligence assistant. Be sharp, concise, and data-driven.
Current week: ${NFL_WEEK||'?'} Season: ${NFL_SEASON||'?'}
Games on the board:\n${context}
Answer questions about the games, picks, or system. Never give generic advice.`;

  try{
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        system_instruction:{parts:[{text:sysPrompt}]},
        contents:CHAT.slice(-6).map(m=>({role:m.role==='user'?'user':'model',parts:[{text:m.content}]})),
        generationConfig:{temperature:0.7,maxOutputTokens:800}
      })
    });
    const j=await r.json();
    const raw=j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts&&j.candidates[0].content.parts[0]&&j.candidates[0].content.parts[0].text||'No response.';
    CHAT.push({role:'assistant',content:raw});
  }catch(e){CHAT.push({role:'assistant',content:'Error: '+e.message});}
  paintChat();
}

let SCRIPT_READY=false;
function whenScriptReady(fn,delay=0){
  if(SCRIPT_READY)return setTimeout(fn,delay);
  const iv=setInterval(()=>{if(SCRIPT_READY){clearInterval(iv);setTimeout(fn,delay);}},50);
}

async function boot(){
  if(__BOOTED)return;__BOOTED=true;
  paintMeter();loadSlip();computePercentiles();

  // Render from cache immediately
  if(NFL_GAMES.length)renderNFL();

  // Fresh schedule in background
  setTimeout(async()=>{
    await loadNFLSchedule().catch(()=>{});
    await fetchNFLPowerRatings().catch(()=>{});
    computePercentiles();
    renderNFL();
  },500);

  // Depth charts
  setTimeout(()=>fetchNFLDepthCharts().catch(()=>{}),3000);

  // Weather
  setTimeout(()=>fetchAllWeather().catch(()=>{}),5000);

  // Backfill grading (catch up missed games)
  setTimeout(async()=>{
    await backfillGrading();
    gradeNFLResults();
    if(GRADED_BADGE>0){
      showToast(`${GRADED_BADGE} game${GRADED_BADGE>1?'s':''} auto-graded`);
      const nR=document.getElementById('nR');
      if(nR)nR.textContent=GRADED_BADGE;
    }
    snapshotNFL();
  },4000);

  // Live poll if needed
  setTimeout(startLivePollIfNeeded,2000);

  if(__BOOT_DONE)return;__BOOT_DONE=true;

  // Odds: once per hour
  setInterval(()=>{
    if(Date.now()-ODDS_PULL_TS>3600000)fetchNFLLiveOdds().catch(()=>{});
  },3600000);

  // Auto-grade every 3 min when app is open
  setInterval(()=>{
    gradeNFLResults();
    snapshotNFL();
    startLivePollIfNeeded();
  },180000);

  // GitHub sync
  if(get(LS.ghrepo,'')&&get(LS.ghtoken,'')){
    setTimeout(()=>pushToGitHub(false),10000);
    setInterval(()=>pushToGitHub(false),20*3600000);
  }
}

async function pushToGitHub(manual){
  const repo=get(LS.ghrepo,'');const token=get(LS.ghtoken,'');
  if(!repo||!token)return;
  const api=`https://api.github.com/repos/${repo}/contents/data-backup.json`;
  const data={nflarc:get(LS.nflarc,{}),nflcalib:get(NFL_CALIB_KEY,{}),
    locked:get(LS.locked,[]),bestlog:get(LS.bestlog,{}),ts:Date.now()};
  const content=btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  try{
    const rGet=await fetch(api,{headers:{'Authorization':'token '+token,'Accept':'application/vnd.github+json'}});
    const sha=rGet.ok?(await rGet.json()).sha:undefined;
    await fetch(api,{method:'PUT',headers:{'Authorization':'token '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
      body:JSON.stringify({message:'TheDesk NFL auto-backup',content,sha})});
    localStorage.setItem('d4.lastGhSync',String(Date.now()));
    if(manual)showToast('Synced to GitHub');
  }catch(e){if(manual)showToast('GitHub sync failed: '+e.message);}
}
