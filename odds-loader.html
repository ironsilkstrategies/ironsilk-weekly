<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TheDesk · Odds Loader</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0a0e14;--surface:#111820;--border:#1e2a36;
    --accent:#f5c842;--accent2:#00c2ff;--plus:#00d48a;--minus:#ff4f4f;
    --text:#e8edf2;--muted:#5a6a7a;--label:#8a9baa;
  }
  body{background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',monospace;min-height:100vh;padding:16px}
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap');
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--border)}
  .logo{font-size:16px;font-weight:600;color:var(--accent)}
  .logo span{color:var(--muted);font-weight:400}
  .badge{font-size:9px;background:var(--accent2);color:#0a0e14;padding:2px 7px;border-radius:3px;font-weight:600;letter-spacing:.1em;margin-left:8px}
  h2{font-size:11px;letter-spacing:.12em;color:var(--muted);margin:18px 0 8px}
  /* DROP ZONE */
  #dropzone{
    border:2px dashed var(--border);border-radius:8px;padding:28px 20px;
    text-align:center;cursor:pointer;transition:border-color .15s,background .15s;
    margin-bottom:16px;
  }
  #dropzone.drag{border-color:var(--accent);background:rgba(245,200,66,.06)}
  #dropzone input{display:none}
  #dropzone p{font-size:12px;color:var(--muted);line-height:1.7}
  #dropzone p strong{color:var(--accent);cursor:pointer}
  /* SPORT TABS */
  .tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:1px solid var(--border)}
  .tab{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--muted);padding:8px 16px;cursor:pointer;border-bottom:2px solid transparent}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  /* DATE */
  .date-row{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .date-row label{font-size:10px;color:var(--muted);letter-spacing:.08em}
  .date-row input{background:var(--surface);border:1px solid var(--border);color:var(--text);
    padding:6px 10px;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:12px}
  /* STATUS */
  #status{font-size:11px;color:var(--muted);margin-bottom:14px;min-height:18px}
  #status.ok{color:var(--plus)}
  #status.err{color:var(--minus)}
  #status.working{color:var(--accent)}
  /* PREVIEW TABLE */
  #preview{margin-bottom:16px}
  .game-block{border:1px solid var(--border);border-radius:6px;margin-bottom:10px;overflow:hidden}
  .game-header{background:var(--surface);padding:7px 12px;font-size:11px;color:var(--label);display:flex;justify-content:space-between}
  .game-header span{font-size:9px;color:var(--muted)}
  .odds-row{display:grid;grid-template-columns:110px 1fr 1fr 1fr;gap:4px;padding:6px 12px;border-bottom:1px solid var(--border);font-size:11px}
  .odds-row:last-child{border-bottom:none}
  .odds-row .mkt{color:var(--muted);letter-spacing:.06em}
  .odds-row .side{color:var(--label)}
  .pval{font-weight:600}
  .pval.p{color:var(--plus)}
  .pval.m{color:var(--minus)}
  .pval.n{color:var(--text)}
  /* BUTTONS */
  .btn-row{display:flex;gap:10px;margin-top:4px}
  button{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12px;
    letter-spacing:.08em;border:none;border-radius:5px;padding:12px 20px;cursor:pointer;width:100%}
  #saveBtn{background:var(--accent);color:#0a0e14}
  #saveBtn:disabled{opacity:.4;cursor:not-allowed}
  #clearBtn{background:var(--surface);color:var(--muted);border:1px solid var(--border);width:auto;padding:12px 16px}
  /* LOG */
  #log{font-size:10px;color:var(--muted);margin-top:16px;line-height:1.8;white-space:pre-wrap}
</style>
</head>
<body>

<header>
  <div class="logo">THE<span>DESK</span><span class="badge">ODDS LOADER</span></div>
  <div style="font-size:10px;color:var(--muted)" id="storedCount">—</div>
</header>

<!-- SPORT -->
<div class="tabs">
  <div class="tab active" data-sport="mlb" onclick="setSport('mlb',this)">MLB</div>
  <div class="tab" data-sport="nfl" onclick="setSport('nfl',this)">NFL</div>
  <div class="tab" data-sport="ncaaf" onclick="setSport('ncaaf',this)">CFB</div>
</div>

<!-- DATE -->
<div class="date-row">
  <label>SLATE DATE</label>
  <input type="date" id="slateDate">
</div>

<!-- DROP ZONE -->
<div id="dropzone" onclick="document.getElementById('fileIn').click()"
  ondragover="event.preventDefault();this.classList.add('drag')"
  ondragleave="this.classList.remove('drag')"
  ondrop="handleDrop(event)">
  <input type="file" id="fileIn" accept="image/*" multiple onchange="handleFiles(this.files)">
  <p>Drop sportsbetting.ag screenshots here<br>or <strong>tap to choose files</strong><br><br>
  <span style="font-size:10px">Reads full game · F5 · 1H · 1Q in one shot</span></p>
</div>

<div id="status"></div>
<div id="preview"></div>

<div class="btn-row">
  <button id="saveBtn" disabled onclick="saveToDesk()">SAVE TO THEDESK</button>
  <button id="clearBtn" onclick="clearDay()">CLEAR DAY</button>
</div>

<div id="log"></div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────
const ANTHROPIC_KEY_STORE = 'd4.key'; // reuse TheDesk's own Anthropic key slot
// TheDesk localStorage keys (mirrors shared.js LS object)
const LS_BOOKSHOTS  = 'd4.bookshots';   // MLB
const LS_NFLSHOTS   = 'd4.nflshots';    // NFL
const LS_NCAAFSHOTS = 'd4.ncaafshots';  // CFB/NCAAF

let SPORT = 'mlb';
let PARSED = [];

// ── HELPERS ───────────────────────────────────────────────────────────────
const get = (k, d={}) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } };
const set = (k, v) => localStorage.setItem(k, JSON.stringify(v));
const today = () => new Date().toISOString().slice(0,10);
const lsKey = s => s==='nfl' ? LS_NFLSHOTS : s==='ncaaf' ? LS_NCAAFSHOTS : LS_BOOKSHOTS;

function setSport(s, el) {
  SPORT = s;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  updateStoredCount();
}

function getDate() {
  return document.getElementById('slateDate').value || today();
}

function setStatus(msg, cls='') {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls;
}

function log(msg) {
  document.getElementById('log').textContent += msg + '\n';
}

function updateStoredCount() {
  const d = getDate();
  const all = get(lsKey(SPORT), {});
  const n = (all[d] || []).length;
  document.getElementById('storedCount').textContent = `${n} lines stored for ${d}`;
}

// ── INIT ─────────────────────────────────────────────────────────────────
document.getElementById('slateDate').value = today();
document.getElementById('slateDate').addEventListener('change', updateStoredCount);
updateStoredCount();

// ── FILE HANDLING ─────────────────────────────────────────────────────────
function handleDrop(e) {
  e.preventDefault();
  document.getElementById('dropzone').classList.remove('drag');
  handleFiles(e.dataTransfer.files);
}

async function handleFiles(files) {
  if (!files.length) return;
  document.getElementById('log').textContent = '';
  PARSED = [];
  document.getElementById('preview').innerHTML = '';
  document.getElementById('saveBtn').disabled = true;

  const apiKey = get(ANTHROPIC_KEY_STORE, null) ||
                 get('d4.ai', null) ||
                 prompt('Paste your Anthropic API key (stored in TheDesk settings):');
  if (!apiKey) { setStatus('No API key — add it in TheDesk Settings.', 'err'); return; }
  // persist it if not already stored
  if (!localStorage.getItem(ANTHROPIC_KEY_STORE)) set(ANTHROPIC_KEY_STORE, apiKey);

  setStatus(`Reading ${files.length} screenshot${files.length>1?'s':''}…`, 'working');

  // Convert all files to base64
  const images = [];
  for (const f of files) {
    const b64 = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = e => res(e.target.result.split(',')[1]);
      r.onerror = () => rej();
      r.readAsDataURL(f);
    });
    images.push({ type: f.type || 'image/jpeg', data: b64, name: f.name });
  }

  const sportLabel = SPORT === 'ncaaf' ? 'college football (NCAAF/CFB)' : SPORT.toUpperCase();
  const mlbMarkets = `
- Full-game moneyline  → market:"moneyline", side:"away"|"home"
- Full-game run line   → market:"runline",   side:"away"|"home", line: +/-1.5
- Full-game total      → market:"total",     side:"over"|"under"
- 1st 5 innings ML     → market:"f5side",    side:"away"|"home"
- 1st 5 innings total  → market:"f5total",   side:"over"|"under"
- 1st 5 innings RL     → market:"f5runline", side:"away"|"home", line: +/-0.5`;
  const fbMarkets = `
- Full-game moneyline  → market:"moneyline", side:"away"|"home"
- Full-game spread     → market:"spread",    side:"away"|"home"
- Full-game total      → market:"total",     side:"over"|"under"
- 1st half spread      → market:"h1spread",  side:"away"|"home"
- 1st half total       → market:"h1total",   side:"over"|"under"
- 1st quarter spread   → market:"q1spread",  side:"away"|"home"
- 1st quarter total    → market:"q1total",   side:"over"|"under"`;

  const prompt_text = `These are screenshots from a sportsbook showing ${sportLabel} odds.

Extract EVERY visible bet line into a JSON array. Each object:
{
  "away": "TEAM_ABBR",
  "home": "TEAM_ABBR",
  "market": "<see below>",
  "side": "away"|"home"|"over"|"under",
  "line": number or null,
  "price": number  (American odds, e.g. -110 or +145)
}

Markets to extract:
${SPORT === 'mlb' ? mlbMarkets : fbMarkets}

Rules:
- Use standard MLB/NFL/CFB abbreviations (PHI, ATL, NYM, MIA, SMU, FSU etc)
- away = visiting team, home = home team — preserve order from the screen
- line = the spread/runline number (e.g. -3, +1.5), null for moneylines
- price = the American odds number
- Extract ALL games visible, ALL markets visible per game
- If a panel shows "1st 5 innings" columns, extract those as f5side/f5total
- If a panel shows "1st Half" columns, extract as h1spread/h1total
- If a panel shows "1st Quarter" columns, extract as q1spread/q1total
- Return ONLY a valid JSON array, no markdown, no explanation`;

  const content = [
    { type: 'text', text: prompt_text },
    ...images.map(img => ({
      type: 'image',
      source: { type: 'base64', media_type: img.type, data: img.data }
    }))
  ];

  try {
    setStatus('Sending to Claude vision…', 'working');
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 4000,
        messages: [{ role: 'user', content }]
      })
    });

    if (!resp.ok) {
      const err = await resp.json();
      setStatus('API error: ' + (err.error?.message || resp.status), 'err');
      return;
    }

    const data = await resp.json();
    const raw = data.content?.find(b => b.type === 'text')?.text || '';
    log('RAW OUTPUT:\n' + raw.slice(0, 300) + (raw.length > 300 ? '…' : ''));

    let parsed;
    try {
      const clean = raw.replace(/```json|```/g, '').trim();
      parsed = JSON.parse(clean);
    } catch(e) {
      setStatus('Could not parse JSON from Claude response.', 'err');
      log('Parse error: ' + e.message);
      return;
    }

    if (!Array.isArray(parsed) || !parsed.length) {
      setStatus('No lines extracted — try clearer screenshots.', 'err');
      return;
    }

    PARSED = parsed;
    setStatus(`✓ ${parsed.length} lines extracted from ${images.length} screenshot${images.length>1?'s':''}`, 'ok');
    renderPreview(parsed);
    document.getElementById('saveBtn').disabled = false;

  } catch(e) {
    setStatus('Network error: ' + e.message, 'err');
    log(e.stack || e.message);
  }
}

// ── PREVIEW ────────────────────────────────────────────────────────────────
function renderPreview(picks) {
  const container = document.getElementById('preview');
  // group by game
  const games = {};
  picks.forEach(p => {
    const key = p.away + '@' + p.home;
    if (!games[key]) games[key] = { away: p.away, home: p.home, lines: [] };
    games[key].lines.push(p);
  });

  container.innerHTML = '';
  Object.values(games).forEach(g => {
    const block = document.createElement('div');
    block.className = 'game-block';

    const hdr = document.createElement('div');
    hdr.className = 'game-header';
    hdr.innerHTML = `<b>${g.away} @ ${g.home}</b><span>${g.lines.length} markets</span>`;
    block.appendChild(hdr);

    g.lines.forEach(l => {
      const row = document.createElement('div');
      row.className = 'odds-row';
      const pc = l.price > 0 ? 'p' : l.price < 0 ? 'm' : 'n';
      const lineStr = l.line != null ? (l.line > 0 ? '+' + l.line : l.line) : '';
      row.innerHTML = `
        <span class="mkt">${l.market}</span>
        <span class="side">${l.side}</span>
        <span>${lineStr}</span>
        <span class="pval ${pc}">${l.price > 0 ? '+' : ''}${l.price}</span>`;
      block.appendChild(row);
    });

    container.appendChild(block);
  });
}

// ── SAVE TO THEDESK ────────────────────────────────────────────────────────
function saveToDesk() {
  if (!PARSED.length) return;
  const d = getDate();
  const key = lsKey(SPORT);
  const all = get(key, {});
  all[d] = all[d] || [];

  const keyOf = x => [x.game, x.market, x.side, x.line].join('|');
  const now = Date.now();

  let saved = 0, updated = 0;
  PARSED.forEach(x => {
    const away = x.away.toUpperCase();
    const home = x.home.toUpperCase();
    const game = away + '@' + home;
    const rec = {
      away, home, game,
      market: x.market,
      side: x.side,
      line: x.line != null ? x.line : null,
      price: x.price,
      gid: null,
      capturedAt: now
    };
    const k = keyOf(rec);
    const i = all[d].findIndex(y => keyOf(y) === k);
    if (i >= 0) { all[d][i] = rec; updated++; }
    else { all[d].push(rec); saved++; }
  });

  set(key, all);
  updateStoredCount();
  setStatus(`✓ Saved ${saved} new + ${updated} updated lines for ${d} → ${key}`, 'ok');
  log(`Wrote to ${key}[${d}]: ${saved} new, ${updated} updated`);
  document.getElementById('saveBtn').disabled = true;
  PARSED = [];
  document.getElementById('preview').innerHTML = '';
}

// ── CLEAR DAY ─────────────────────────────────────────────────────────────
function clearDay() {
  const d = getDate();
  const key = lsKey(SPORT);
  const all = get(key, {});
  const n = (all[d] || []).length;
  if (!n) { setStatus(`Nothing stored for ${d}`, 'err'); return; }
  if (!confirm(`Delete all ${n} stored lines for ${SPORT.toUpperCase()} on ${d}?`)) return;
  delete all[d];
  set(key, all);
  setStatus(`Cleared ${n} lines for ${d}`, 'ok');
  updateStoredCount();
}
</script>
</body>
</html>
