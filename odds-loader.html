<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TheDesk · Odds Loader</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0a0e14;--surface:#111820;--border:#1e2a36;
    --accent:#f5c842;--accent2:#00c2ff;--plus:#00d48a;--minus:#ff4f4f;
    --text:#e8edf2;--muted:#5a6a7a;--label:#8a9baa;
  }
  body{background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',monospace;min-height:100vh;padding:16px}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--border)}
  .logo{font-size:16px;font-weight:600;color:var(--accent)}
  .logo span{color:var(--muted);font-weight:400}
  .badge{font-size:9px;background:var(--accent2);color:#0a0e14;padding:2px 7px;border-radius:3px;font-weight:600;letter-spacing:.1em;margin-left:8px}
  .tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:1px solid var(--border)}
  .tab{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--muted);padding:8px 16px;cursor:pointer;border-bottom:2px solid transparent}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .date-row{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .date-row label{font-size:10px;color:var(--muted);letter-spacing:.08em}
  .date-row input{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:12px}
  #dropzone{border:2px dashed var(--border);border-radius:8px;padding:28px 20px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;margin-bottom:16px}
  #dropzone.drag{border-color:var(--accent);background:rgba(245,200,66,.06)}
  #dropzone input{display:none}
  #dropzone p{font-size:12px;color:var(--muted);line-height:1.9}
  #dropzone p strong{color:var(--accent);cursor:pointer}
  #status{font-size:11px;color:var(--muted);margin-bottom:14px;min-height:18px}
  #status.ok{color:var(--plus)}
  #status.err{color:var(--minus)}
  #status.working{color:var(--accent)}
  .game-block{border:1px solid var(--border);border-radius:6px;margin-bottom:10px;overflow:hidden}
  .game-header{background:var(--surface);padding:7px 12px;font-size:11px;color:var(--label);display:flex;justify-content:space-between}
  .odds-row{display:grid;grid-template-columns:110px 1fr 1fr 1fr;gap:4px;padding:6px 12px;border-bottom:1px solid var(--border);font-size:11px}
  .odds-row:last-child{border-bottom:none}
  .odds-row .mkt{color:var(--muted)}
  .odds-row .side{color:var(--label)}
  .pval.p{color:var(--plus);font-weight:600}
  .pval.m{color:var(--minus);font-weight:600}
  .btn-row{display:flex;gap:10px;margin-top:4px}
  button{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12px;letter-spacing:.08em;border:none;border-radius:5px;padding:12px 20px;cursor:pointer;width:100%}
  #saveBtn{background:var(--accent);color:#0a0e14}
  #saveBtn:disabled{opacity:.4;cursor:not-allowed}
  #clearBtn{background:var(--surface);color:var(--muted);border:1px solid var(--border);width:auto;padding:12px 16px}
  #log{font-size:10px;color:var(--muted);margin-top:16px;line-height:1.8;white-space:pre-wrap}
</style>
</head>
<body>

<header>
  <div class="logo">THE<span>DESK</span><span class="badge">ODDS LOADER</span></div>
  <a href="TheDesk.html" style="font-size:10px;color:var(--accent);text-decoration:none;letter-spacing:.06em">← THEDESK</a>
</header>
<div id="keyRow" style="display:none;margin-bottom:14px">
  <div style="font-size:10px;color:var(--muted);letter-spacing:.08em;margin-bottom:6px">GEMINI API KEY</div>
  <div style="display:flex;gap:8px">
    <input id="keyInput" type="password" placeholder="Paste Gemini key from TheDesk Settings"
      style="flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);
      padding:8px 10px;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:11px">
    <button onclick="saveKey()" style="width:auto;padding:8px 14px;background:var(--accent);color:#0a0e14;font-size:11px">SAVE</button>
  </div>
</div>
<div style="font-size:10px;color:var(--muted);text-align:right;margin-bottom:12px" id="storedCount">—</div>

<div class="tabs">
  <div class="tab active" onclick="setSport('mlb',this)">MLB</div>
  <div class="tab" onclick="setSport('nfl',this)">NFL</div>
  <div class="tab" onclick="setSport('ncaaf',this)">CFB</div>
</div>

<div class="date-row">
  <label>SLATE DATE</label>
  <input type="date" id="slateDate">
</div>

<div id="dropzone"
  onclick="document.getElementById('fileIn').click()"
  ondragover="event.preventDefault();this.classList.add('drag')"
  ondragleave="this.classList.remove('drag')"
  ondrop="handleDrop(event)">
  <input type="file" id="fileIn" accept="image/*" multiple onchange="handleFiles(this.files)">
  <p>Drop sportsbetting.ag screenshots here<br>
  or <strong>tap to choose files</strong><br><br>
  <span style="font-size:10px;color:var(--muted)">Full game · F5 · 1H · 1Q — all parsed in one shot</span></p>
</div>

<div id="status"></div>
<div id="preview"></div>

<div class="btn-row">
  <button id="saveBtn" disabled onclick="saveToDesk()">SAVE TO THEDESK</button>
  <button id="clearBtn" onclick="clearDay()">CLEAR DAY</button>
</div>

<div id="log"></div>

<script>
// ── STORAGE KEYS — mirrors shared.js LS object exactly ───────────────────
const LS = {
  ai:         'd4.ai',          // Gemini key — same slot TheDesk uses
  bookshots:  'd4.bookshots',   // MLB lines
  nflshots:   'd4.nflshots',    // NFL lines
  ncaafshots: 'd4.ncaafshots',  // CFB lines
};

// Gemini models — same fallback chain as TheDesk
const GEMINI_MODELS = ['gemini-3.6-flash','gemini-3.7-flash','gemini-3.5-flash','gemini-2.5-flash'];

let SPORT = 'mlb';
let PARSED = [];

// ── HELPERS ───────────────────────────────────────────────────────────────
const get  = (k, d) => { try { const v = localStorage.getItem(k); return v != null ? JSON.parse(v) : d; } catch { return d; } };
const set  = (k, v) => localStorage.setItem(k, JSON.stringify(v));
const today = () => new Date().toISOString().slice(0,10);
const lsKey = s => s==='nfl' ? LS.nflshots : s==='ncaaf' ? LS.ncaafshots : LS.bookshots;
const getDate = () => document.getElementById('slateDate').value || today();

function setSport(s, el) {
  SPORT = s;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  updateStoredCount();
}

function setStatus(msg, cls='') {
  const el = document.getElementById('status');
  el.textContent = msg; el.className = cls;
}

function log(msg) { document.getElementById('log').textContent += msg + '\n'; }

function updateStoredCount() {
  const d = getDate();
  const all = get(lsKey(SPORT), {});
  const n = (all[d] || []).length;
  document.getElementById('storedCount').textContent = `${n} lines stored · ${d}`;
}

// ── GEMINI CALL — same pattern as TheDesk's callGemini() ─────────────────
async function callGemini(key, images, promptText) {
  const parts = [
    { text: promptText },
    ...images.map(img => ({ inline_data: { mime_type: img.mimeType, data: img.data } }))
  ];
  const body = {
    contents: [{ role: 'user', parts }],
    generationConfig: { maxOutputTokens: 8000, temperature: 0.1 }
  };

  const sleep = ms => new Promise(r => setTimeout(r, ms));

  for (let mi = 0; mi < GEMINI_MODELS.length; mi++) {
    const model = GEMINI_MODELS[mi];
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`;
    for (let attempt = 0; attempt < (mi === 0 ? 4 : 2); attempt++) {
      if (attempt > 0 || mi > 0) {
        const wait = Math.min(20000, 900 * Math.pow(2, attempt)) + Math.random() * 400;
        setStatus(`Gemini busy — retrying in ${Math.round(wait/1000)}s…`, 'working');
        await sleep(wait);
      }
      try {
        setStatus(`Calling ${model}…`, 'working');
        const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
        const j = await r.json();
        if (j.error) {
          if (j.error.code === 503 || j.error.code === 429) { continue; }
          throw new Error(j.error.message || JSON.stringify(j.error));
        }
        const text = j.candidates?.[0]?.content?.parts?.[0]?.text || '';
        if (!text) throw new Error('Empty response from Gemini');
        return text;
      } catch(e) {
        if (mi === GEMINI_MODELS.length - 1 && attempt >= 1) throw e;
      }
    }
  }
  throw new Error('All Gemini models exhausted');
}

// ── KEY MANAGEMENT ────────────────────────────────────────────────────────
function checkKey() {
  const key = get(LS.ai, null);
  if (!key) {
    document.getElementById('keyRow').style.display = 'block';
    setStatus('No Gemini key found — paste it above to get started.', 'err');
  } else {
    document.getElementById('keyRow').style.display = 'none';
    setStatus('');
  }
}

function saveKey() {
  const val = document.getElementById('keyInput').value.trim();
  if (!val) { setStatus('Key cannot be empty.', 'err'); return; }
  set(LS.ai, val);
  document.getElementById('keyInput').value = '';
  document.getElementById('keyRow').style.display = 'none';
  setStatus('Gemini key saved — ready to load odds.', 'ok');
}

// ── INIT ──────────────────────────────────────────────────────────────────
document.getElementById('slateDate').value = today();
document.getElementById('slateDate').addEventListener('change', updateStoredCount);
updateStoredCount();
checkKey();

// ── FILE HANDLING ─────────────────────────────────────────────────────────
function handleDrop(e) {
  e.preventDefault();
  document.getElementById('dropzone').classList.remove('drag');
  handleFiles(e.dataTransfer.files);
}

async function handleFiles(files) {
  if (!files.length) return;
  document.getElementById('log').textContent = '';
  PARSED = [];
  document.getElementById('preview').innerHTML = '';
  document.getElementById('saveBtn').disabled = true;

  const apiKey = get(LS.ai, null);
  if (!apiKey) {
    document.getElementById('keyRow').style.display = 'block';
    setStatus('No Gemini key found — paste it above first.', 'err');
    return;
  }

  setStatus(`Reading ${files.length} screenshot${files.length>1?'s':''}…`, 'working');

  const images = [];
  for (const f of files) {
    const data = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = e => res(e.target.result.split(',')[1]);
      r.onerror = rej;
      r.readAsDataURL(f);
    });
    images.push({ mimeType: f.type || 'image/jpeg', data, name: f.name });
  }

  const mlbMarkets = `
- Full-game moneyline      → market:"moneyline",  side:"away"|"home",  line:null
- Full-game run line       → market:"runline",    side:"away"|"home",  line:+/-1.5
- Full-game total          → market:"total",      side:"over"|"under", line:the number
- 1st 5 innings moneyline  → market:"f5side",     side:"away"|"home",  line:null
- 1st 5 innings run line   → market:"f5runline",  side:"away"|"home",  line:+/-0.5
- 1st 5 innings total      → market:"f5total",    side:"over"|"under", line:the number`;

  const fbMarkets = `
- Full-game moneyline  → market:"moneyline", side:"away"|"home",  line:null
- Full-game spread     → market:"spread",    side:"away"|"home",  line:the handicap
- Full-game total      → market:"total",     side:"over"|"under", line:the number
- 1st half spread      → market:"h1spread",  side:"away"|"home",  line:the handicap
- 1st half total       → market:"h1total",   side:"over"|"under", line:the number
- 1st quarter spread   → market:"q1spread",  side:"away"|"home",  line:the handicap
- 1st quarter total    → market:"q1total",   side:"over"|"under", line:the number`;

  const sportLabel = SPORT === 'ncaaf' ? 'college football (CFB/NCAAF)' : SPORT.toUpperCase();
  const promptText = `These are screenshots from sportsbetting.ag showing ${sportLabel} odds.

Extract EVERY visible bet line into a JSON array. Each object must have:
{
  "away": "ABBR",
  "home": "ABBR",
  "market": "...",
  "side": "away"|"home"|"over"|"under",
  "line": number or null,
  "price": number (American odds e.g. -110 or +145)
}

Markets to extract:
${SPORT === 'mlb' ? mlbMarkets : fbMarkets}

Rules:
- away = the visiting team, home = the home team (preserve order shown on screen)
- Use standard abbreviations: PHI, ATL, NYM, MIA, CLE, BAL, LAA, BOS, CHC, MIL, WSH, SD, STL, SF, TOR, ATH, SMU, FSU etc
- line = spread/runline number (e.g. -3 or +1.5), null for moneylines
- price = the American odds integer
- Extract ALL games visible and ALL markets per game including alt-line panels
- If a column header says "1st 5 Innings" extract as f5side/f5total/f5runline
- If a column header says "1st Half" extract as h1spread/h1total
- If a column header says "1st Quarter" extract as q1spread/q1total
- Return ONLY a valid JSON array — no markdown fences, no explanation`;

  try {
    const raw = await callGemini(apiKey, images, promptText);
    log('RAW:\n' + raw.slice(0, 400) + (raw.length > 400 ? '…' : ''));

    let parsed;
    try {
      parsed = JSON.parse(raw.replace(/```json|```/g,'').trim());
    } catch(e) {
      setStatus('Could not parse Gemini response as JSON.', 'err');
      log('Parse error: ' + e.message + '\n' + raw.slice(0,500));
      return;
    }

    if (!Array.isArray(parsed) || !parsed.length) {
      setStatus('No lines extracted — try clearer screenshots.', 'err');
      return;
    }

    PARSED = parsed;
    setStatus(`✓ ${parsed.length} lines extracted`, 'ok');
    renderPreview(parsed);
    document.getElementById('saveBtn').disabled = false;

  } catch(e) {
    setStatus('Error: ' + e.message, 'err');
    log(e.message);
  }
}

// ── PREVIEW ───────────────────────────────────────────────────────────────
function renderPreview(picks) {
  const container = document.getElementById('preview');
  const games = {};
  picks.forEach(p => {
    const key = p.away + '@' + p.home;
    if (!games[key]) games[key] = { away: p.away, home: p.home, lines: [] };
    games[key].lines.push(p);
  });
  container.innerHTML = '';
  Object.values(games).forEach(g => {
    const block = document.createElement('div');
    block.className = 'game-block';
    block.innerHTML = `<div class="game-header"><b>${g.away} @ ${g.home}</b><span>${g.lines.length} markets</span></div>`;
    g.lines.forEach(l => {
      const pc = l.price > 0 ? 'p' : 'm';
      const lineStr = l.line != null ? (l.line > 0 ? '+'+l.line : l.line) : '';
      const row = document.createElement('div');
      row.className = 'odds-row';
      row.innerHTML = `<span class="mkt">${l.market}</span><span class="side">${l.side}</span><span>${lineStr}</span><span class="pval ${pc}">${l.price>0?'+':''}${l.price}</span>`;
      block.appendChild(row);
    });
    container.appendChild(block);
  });
}

// ── SAVE TO THEDESK ───────────────────────────────────────────────────────
function saveToDesk() {
  if (!PARSED.length) return;
  const d = getDate();
  const key = lsKey(SPORT);
  const all = get(key, {});
  all[d] = all[d] || [];
  const keyOf = x => [x.game, x.market, x.side, x.line].join('|');
  const now = Date.now();
  let saved = 0, updated = 0;

  PARSED.forEach(x => {
    const away = (x.away||'').toUpperCase();
    const home = (x.home||'').toUpperCase();
    const rec = {
      away, home,
      game: away + '@' + home,
      market: x.market,
      side: x.side,
      line: x.line != null ? x.line : null,
      price: x.price,
      gid: null,
      capturedAt: now
    };
    const k = keyOf(rec);
    const i = all[d].findIndex(y => keyOf(y) === k);
    if (i >= 0) { all[d][i] = rec; updated++; }
    else { all[d].push(rec); saved++; }
  });

  set(key, all);
  updateStoredCount();
  setStatus(`✓ ${saved} new · ${updated} updated → ${key} [${d}]`, 'ok');
  log(`Saved to ${key}[${d}]: ${saved} new, ${updated} updated`);
  document.getElementById('saveBtn').disabled = true;
  PARSED = [];
  document.getElementById('preview').innerHTML = '';
}

// ── CLEAR DAY ─────────────────────────────────────────────────────────────
function clearDay() {
  const d = getDate();
  const key = lsKey(SPORT);
  const all = get(key, {});
  const n = (all[d] || []).length;
  if (!n) { setStatus(`Nothing stored for ${d}`, 'err'); return; }
  if (!confirm(`Delete all ${n} ${SPORT.toUpperCase()} lines for ${d}?`)) return;
  delete all[d];
  set(key, all);
  setStatus(`Cleared ${n} lines for ${d}`, 'ok');
  updateStoredCount();
}
</script>
</body>
</html>
