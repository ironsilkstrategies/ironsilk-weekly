<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IronSilk SportsHub</title>
<style>
:root{
  --navy:#0B1622;--navy-mid:#132035;--navy-light:#1a2d4a;
  --gold:#D4AF37;--gold-light:#e8cc6a;
  --silver:#a0aec0;--surface:#111f33;--surface2:#162840;
  --border:#1e3550;--text:#e8ecf2;--text-muted:#6b849e;
  --green:#22c55e;--red:#ef4444;--blue:#38bdf8;--push:#f59e0b;
  --radius:8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--navy);color:var(--text);min-height:100vh;overflow-x:hidden;}
button{cursor:pointer;font-family:inherit;}
input,select,textarea{font-family:inherit;}

/* TOPBAR */
.topbar{background:var(--navy-mid);border-bottom:2px solid var(--gold);padding:.55rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap;position:sticky;top:0;z-index:200;}
.topbar-left{display:flex;align-items:center;gap:.6rem;}
.hub-logo{font-size:1rem;font-weight:800;color:#fff;letter-spacing:.02em;}
.hub-logo em{color:var(--gold);font-style:normal;}
.hub-badge{font-size:.58rem;background:rgba(212,175,55,.15);color:var(--gold);border:1px solid rgba(212,175,55,.3);border-radius:20px;padding:.13rem .55rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
.topbar-right{display:flex;align-items:center;gap:.5rem;}
.tbtn{background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.25);color:var(--gold);border-radius:6px;padding:.3rem .7rem;font-size:.72rem;font-weight:700;}
.tbtn:hover{background:rgba(212,175,55,.2);}
.tbtn.active{background:var(--gold);color:var(--navy);}

/* TABS */
.main-tabs{display:flex;background:var(--navy-mid);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;}
.main-tabs::-webkit-scrollbar{display:none;}
.mtab{background:none;border:none;border-bottom:2px solid transparent;color:var(--text-muted);padding:.6rem 1.1rem;font-size:.8rem;white-space:nowrap;transition:color .2s,border-color .2s;}
.mtab:hover,.mtab.active{color:var(--gold);border-bottom-color:var(--gold);}

/* SPORT FILTER */
.sport-filter{display:flex;gap:.4rem;padding:.7rem 1rem;overflow-x:auto;scrollbar-width:none;background:var(--navy-mid);border-bottom:1px solid var(--border);}
.sport-filter::-webkit-scrollbar{display:none;}
.sfbtn{background:var(--surface);border:1px solid var(--border);border-radius:20px;color:var(--text-muted);padding:.28rem .75rem;font-size:.72rem;white-space:nowrap;}
.sfbtn.active{background:rgba(212,175,55,.12);border-color:var(--gold);color:var(--gold);font-weight:700;}

/* PAGES */
.page{display:none;padding:.8rem;max-width:760px;margin:0 auto;}
.page.active{display:block;}

/* GAME CARDS */
.game-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:.75rem;overflow:hidden;}
.game-header{padding:.5rem .85rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:var(--surface2);}
.game-time{font-size:.68rem;color:var(--text-muted);}
.game-live-badge{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.3);border-radius:20px;padding:.1rem .45rem;}
.odds-header{display:grid;grid-template-columns:1fr 90px 90px 90px 32px;gap:.3rem;padding:.35rem .85rem;border-bottom:1px solid var(--border);}
.oh-label{font-size:.63rem;color:var(--text-muted);text-align:center;font-weight:600;text-transform:uppercase;letter-spacing:.06em;}
.oh-label:first-child{text-align:left;}
.team-row{display:grid;grid-template-columns:1fr 90px 90px 90px 32px;gap:.3rem;padding:.45rem .85rem;align-items:center;border-bottom:1px solid rgba(30,53,80,.5);}
.team-row:last-of-type{border-bottom:none;}
.team-name{font-size:.88rem;font-weight:600;color:var(--text);}
.odds-btn{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:.38rem .3rem;text-align:center;cursor:pointer;transition:all .18s;min-width:0;}
.odds-btn:hover{border-color:rgba(212,175,55,.4);background:rgba(212,175,55,.06);}
.odds-btn.selected{background:rgba(212,175,55,.15);border-color:var(--gold);}
.odds-line{font-size:.78rem;font-weight:700;color:var(--text);display:block;}
.odds-juice{font-size:.68rem;color:var(--text-muted);display:block;margin-top:1px;}
.odds-btn.selected .odds-line{color:var(--gold);}
.odds-btn.selected .odds-juice{color:var(--gold-light);}
.expand-btn{background:none;border:none;color:var(--text-muted);font-size:1rem;padding:.2rem;display:flex;align-items:center;justify-content:center;transition:transform .2s;}
.expand-btn.open{transform:rotate(90deg);}

/* PROP BUILDER */
.prop-builder{display:none;border-top:2px solid var(--gold);background:var(--navy);}
.prop-builder.open{display:block;}
.prop-tabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;}
.prop-tabs::-webkit-scrollbar{display:none;}
.ptab{background:none;border:none;border-bottom:2px solid transparent;color:var(--text-muted);padding:.5rem .9rem;font-size:.75rem;white-space:nowrap;}
.ptab.active{color:var(--gold);border-bottom-color:var(--gold);}
.prop-section{display:none;padding:.75rem;}
.prop-section.active{display:block;}

/* PROP ROWS */
.prop-group{margin-bottom:1rem;}
.prop-group-title{font-size:.63rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);margin-bottom:.5rem;padding-bottom:.3rem;border-bottom:1px solid var(--border);}
.prop-row{display:flex;align-items:center;justify-content:space-between;padding:.42rem .5rem;border-radius:6px;margin-bottom:.3rem;background:var(--surface2);gap:.5rem;}
.prop-label{font-size:.8rem;color:var(--text);flex:1;min-width:0;}
.prop-label span{font-size:.68rem;color:var(--text-muted);display:block;}
.prop-btns{display:flex;gap:.35rem;flex-shrink:0;}
.pob{background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:.3rem .55rem;font-size:.75rem;font-weight:700;color:var(--text);white-space:nowrap;min-width:58px;text-align:center;}
.pob:hover{border-color:rgba(212,175,55,.4);}
.pob.selected{background:rgba(212,175,55,.15);border-color:var(--gold);color:var(--gold);}
.pob .poj{font-size:.65rem;color:var(--text-muted);display:block;}
.pob.selected .poj{color:var(--gold-light);}

/* ALTERNATE LINE SLIDER */
.alt-slider-wrap{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.7rem;margin-bottom:.55rem;}
.alt-slider-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;}
.alt-slider-name{font-size:.8rem;font-weight:600;color:var(--text);}
.alt-slider-odds{font-size:.85rem;font-weight:700;color:var(--gold);}
.alt-slider-line{font-size:.78rem;color:var(--text-muted);text-align:center;margin-bottom:.4rem;}
input[type=range]{width:100%;accent-color:var(--gold);cursor:pointer;height:4px;}
.alt-slider-labels{display:flex;justify-content:space-between;font-size:.62rem;color:var(--text-muted);margin-top:.3rem;}
.alt-add-btn{width:100%;margin-top:.5rem;background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.3);color:var(--gold);border-radius:6px;padding:.35rem;font-size:.75rem;font-weight:700;}
.alt-add-btn:hover{background:rgba(212,175,55,.2);}

/* PARLAY CART */
.parlay-cart{position:fixed;bottom:0;left:0;right:0;z-index:300;max-width:760px;margin:0 auto;}
.cart-bar{background:var(--gold);color:var(--navy);padding:.5rem 1rem;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-weight:700;font-size:.85rem;border-radius:10px 10px 0 0;}
.cart-bar-right{display:flex;align-items:center;gap:.75rem;}
.cart-count{background:var(--navy);color:var(--gold);border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;}
.cart-panel{background:var(--navy-mid);border:1px solid var(--border);border-top:none;display:none;max-height:55vh;overflow-y:auto;}
.cart-panel.open{display:block;}
.cart-leg{display:flex;align-items:flex-start;gap:.5rem;padding:.6rem .85rem;border-bottom:1px solid var(--border);}
.cart-leg-info{flex:1;min-width:0;}
.cart-leg-game{font-size:.63rem;color:var(--text-muted);}
.cart-leg-pick{font-size:.8rem;font-weight:600;color:var(--text);}
.cart-leg-odds{font-size:.78rem;color:var(--gold);font-weight:700;white-space:nowrap;}
.cart-remove{background:none;border:none;color:var(--text-muted);font-size:.85rem;padding:.1rem .25rem;flex-shrink:0;}
.cart-remove:hover{color:var(--red);}
.cart-footer{padding:.75rem .85rem;background:var(--surface2);border-top:2px solid var(--border);}
.cart-odds-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:.55rem;}
.cart-combined{font-size:.8rem;color:var(--text-muted);}
.cart-combined strong{color:var(--gold);font-size:.95rem;}
.cart-stake-row{display:flex;gap:.5rem;align-items:center;margin-bottom:.55rem;}
.cart-stake-label{font-size:.75rem;color:var(--text-muted);white-space:nowrap;}
.cart-stake-input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:.38rem .6rem;color:var(--text);font-size:.85rem;outline:none;}
.cart-stake-input:focus{border-color:var(--gold);}
.cart-payout{font-size:.75rem;color:var(--text-muted);}
.cart-payout strong{color:var(--green);}
.cart-submit{width:100%;background:var(--gold);color:var(--navy);border:none;border-radius:8px;padding:.55rem;font-size:.88rem;font-weight:800;margin-top:.5rem;}
.cart-submit:hover{background:var(--gold-light);}
.cart-empty{padding:1.2rem;text-align:center;color:var(--text-muted);font-size:.8rem;}

/* TICKETS */
.ticket-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:.75rem;overflow:hidden;}
.ticket-header{background:var(--surface2);padding:.55rem .85rem;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);}
.ticket-id{font-size:.65rem;color:var(--text-muted);}
.ticket-date{font-size:.65rem;color:var(--text-muted);}
.ticket-result{font-size:.72rem;font-weight:700;border-radius:20px;padding:.12rem .55rem;}
.ticket-result.win{background:rgba(34,197,94,.12);color:var(--green);border:1px solid rgba(34,197,94,.3);}
.ticket-result.loss{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.3);}
.ticket-result.push{background:rgba(245,158,11,.12);color:var(--push);border:1px solid rgba(245,158,11,.3);}
.ticket-result.pending{background:rgba(107,132,158,.1);color:var(--text-muted);border:1px solid var(--border);}
.ticket-legs{padding:.6rem .85rem;}
.ticket-leg{display:flex;justify-content:space-between;align-items:flex-start;padding:.35rem 0;border-bottom:1px solid rgba(30,53,80,.5);gap:.5rem;}
.ticket-leg:last-child{border-bottom:none;}
.tl-pick{font-size:.78rem;color:var(--text);}
.tl-game{font-size:.63rem;color:var(--text-muted);}
.tl-odds{font-size:.75rem;font-weight:700;color:var(--gold);white-space:nowrap;}
.tl-result{font-size:.65rem;font-weight:700;border-radius:10px;padding:.08rem .38rem;white-space:nowrap;}
.tl-result.win{background:rgba(34,197,94,.12);color:var(--green);}
.tl-result.loss{background:rgba(239,68,68,.12);color:var(--red);}
.tl-result.push{background:rgba(245,158,11,.12);color:var(--push);}
.ticket-footer{padding:.55rem .85rem;background:var(--surface2);border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.4rem;}
.tf-item{font-size:.72rem;color:var(--text-muted);}
.tf-item strong{color:var(--text);}
.tf-item.payout strong{color:var(--green);}
.ticket-actions{display:flex;gap:.4rem;}
.tact-btn{background:rgba(212,175,55,.08);border:1px solid rgba(212,175,55,.2);color:var(--gold);border-radius:5px;padding:.25rem .6rem;font-size:.68rem;}

/* BET SLIP MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(8,15,30,.75);z-index:500;align-items:center;justify-content:center;}
.overlay.open{display:flex;}
.slip-modal{background:var(--navy-mid);border:2px solid var(--gold);border-radius:14px;width:92%;max-width:400px;overflow:hidden;}
.slip-top{background:linear-gradient(135deg,var(--navy),var(--surface2));padding:1.1rem 1.2rem;text-align:center;border-bottom:2px solid var(--gold);}
.slip-brand{font-size:.68rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:.3rem;}
.slip-title{font-size:1rem;font-weight:800;color:#fff;margin-bottom:.15rem;}
.slip-subtitle{font-size:.7rem;color:var(--silver);}
.slip-legs{padding:.75rem 1.1rem;}
.slip-leg{display:flex;justify-content:space-between;padding:.35rem 0;border-bottom:1px solid var(--border);gap:.5rem;}
.slip-leg:last-child{border-bottom:none;}
.sl-pick{font-size:.78rem;color:var(--text);}
.sl-game{font-size:.62rem;color:var(--text-muted);}
.sl-odds{font-size:.75rem;font-weight:700;color:var(--gold);}
.slip-summary{background:var(--surface2);margin:.5rem;border-radius:8px;padding:.7rem .9rem;}
.slip-row{display:flex;justify-content:space-between;margin-bottom:.3rem;font-size:.78rem;}
.slip-row:last-child{margin:0;}
.slip-row .label{color:var(--text-muted);}
.slip-row .val{font-weight:700;color:var(--text);}
.slip-row.payout .val{color:var(--green);font-size:.9rem;}
.slip-actions{padding:.75rem 1.1rem;display:flex;gap:.5rem;}
.slip-copy{flex:1;background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.3);color:var(--gold);border-radius:8px;padding:.5rem;font-size:.8rem;font-weight:700;}
.slip-close{flex:1;background:var(--gold);color:var(--navy);border:none;border-radius:8px;padding:.5rem;font-size:.8rem;font-weight:700;}

/* GRADE MODAL */
.grade-modal{background:var(--navy-mid);border:1px solid var(--border);border-radius:12px;width:92%;max-width:420px;max-height:90vh;overflow-y:auto;}
.grade-hdr{padding:.75rem 1rem;border-bottom:2px solid var(--gold);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--navy-mid);}
.grade-title{font-size:.9rem;font-weight:700;}
.xbtn{background:none;border:none;color:var(--text-muted);font-size:1.1rem;cursor:pointer;}
.grade-body{padding:1rem;}
.grade-game{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.75rem;margin-bottom:.65rem;}
.grade-game-name{font-size:.82rem;font-weight:700;margin-bottom:.55rem;color:var(--text);}
.score-inputs{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.5rem;}
.score-input-wrap label{font-size:.62rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:.2rem;}
.score-input{width:100%;background:var(--navy);border:1px solid var(--border);border-radius:5px;padding:.38rem .55rem;color:var(--text);font-size:.88rem;outline:none;}
.score-input:focus{border-color:var(--gold);}
.grade-btn{width:100%;background:var(--gold);color:var(--navy);border:none;border-radius:6px;padding:.42rem;font-size:.78rem;font-weight:700;}
.grade-btn:hover{background:var(--gold-light);}

/* MESSAGES */
.msg-wrap{display:flex;flex-direction:column;height:calc(100vh - 160px);min-height:300px;}
.msg-list{flex:1;overflow-y:auto;padding:.75rem;display:flex;flex-direction:column;gap:.5rem;}
.msg-bubble{max-width:78%;padding:.55rem .8rem;border-radius:10px;font-size:.82rem;line-height:1.5;}
.msg-bubble.me{background:rgba(212,175,55,.15);border:1px solid rgba(212,175,55,.25);align-self:flex-end;color:var(--text);}
.msg-bubble.other{background:var(--surface2);border:1px solid var(--border);align-self:flex-start;color:var(--text);}
.msg-author{font-size:.62rem;color:var(--text-muted);margin-bottom:.18rem;font-weight:600;}
.msg-time{font-size:.6rem;color:var(--text-muted);margin-top:.18rem;text-align:right;}
.msg-input-row{display:flex;gap:.5rem;padding:.65rem .75rem;background:var(--surface2);border-top:1px solid var(--border);}
.msg-input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:.42rem .85rem;color:var(--text);font-size:.82rem;outline:none;}
.msg-input:focus{border-color:var(--gold);}
.msg-send{background:var(--gold);color:var(--navy);border:none;border-radius:20px;padding:.42rem 1rem;font-size:.8rem;font-weight:700;}

/* ADMIN */
.admin-section{padding:.75rem;}
.admin-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.9rem;margin-bottom:.75rem;}
.admin-card h3{font-size:.82rem;font-weight:700;color:var(--gold);margin-bottom:.7rem;display:flex;align-items:center;gap:.4rem;}

/* TOAST */
.toast{position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);background:var(--navy-mid);color:var(--gold);border:1px solid var(--gold);border-radius:8px;padding:.55rem 1.1rem;font-size:.78rem;z-index:600;display:none;white-space:nowrap;}
.toast.show{display:block;}

/* EMPTY */
.empty-state{text-align:center;padding:3rem 1rem;color:var(--text-muted);}
.empty-state .eico{font-size:2.2rem;opacity:.3;margin-bottom:.6rem;}
.empty-state p{font-size:.82rem;line-height:1.6;}

@media(max-width:480px){
  .odds-header,.team-row{grid-template-columns:1fr 80px 80px 80px 28px;gap:.2rem;}
  .oh-label,.odds-line{font-size:.7rem;}
  .team-name{font-size:.8rem;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <span class="hub-logo">Iron<em>Silk</em> SportsHub</span>
    <span class="hub-badge">🏆 Live</span>
  </div>
  <div class="topbar-right">
    <button class="tbtn" id="adminToggleBtn" onclick="toggleAdminMode()">⚙ Admin</button>
  </div>
</div>

<div class="main-tabs">
  <button class="mtab active" onclick="switchTab('games',this)">🎮 Games</button>
  <button class="mtab" onclick="switchTab('tickets',this)">🎟 My Tickets</button>
  <button class="mtab" onclick="switchTab('messages',this)">💬 Locker Room</button>
  <button class="mtab admin-only" style="display:none" onclick="switchTab('admin',this)">🔧 Grade</button>
</div>

<div class="sport-filter" id="sportFilter">
  <button class="sfbtn active" onclick="filterSport('all',this)">All</button>
  <button class="sfbtn" onclick="filterSport('NBA',this)">🏀 NBA</button>
  <button class="sfbtn" onclick="filterSport('NFL',this)">🏈 NFL</button>
  <button class="sfbtn" onclick="filterSport('MLB',this)">⚾ MLB</button>
  <button class="sfbtn" onclick="filterSport('NHL',this)">🏒 NHL</button>
</div>

<!-- GAMES PAGE -->
<div class="page active" id="page-games">
  <div id="gamesList"></div>
</div>

<!-- TICKETS PAGE -->
<div class="page" id="page-tickets">
  <div id="ticketsList"></div>
</div>

<!-- MESSAGES PAGE -->
<div class="page" id="page-messages">
  <div class="msg-wrap">
    <div class="msg-list" id="msgList"></div>
    <div class="msg-input-row">
      <input class="msg-input" id="msgInput" placeholder="Talk picks…" onkeydown="if(event.key==='Enter')sendMsg()">
      <button class="msg-send" onclick="sendMsg()">Send</button>
    </div>
  </div>
</div>

<!-- ADMIN/GRADE PAGE -->
<div class="page" id="page-admin">
  <div class="admin-section">
    <div class="admin-card">
      <h3>⚙ Add Game</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.5rem;">
        <div><label style="font-size:.63rem;color:var(--text-muted);display:block;margin-bottom:.2rem">Sport</label>
        <select id="ag-sport" style="width:100%;background:var(--navy);border:1px solid var(--border);border-radius:5px;padding:.38rem .55rem;color:var(--text);font-size:.8rem;outline:none;">
          <option>NBA</option><option>NFL</option><option>MLB</option><option>NHL</option>
        </select></div>
        <div><label style="font-size:.63rem;color:var(--text-muted);display:block;margin-bottom:.2rem">Game Time</label>
        <input id="ag-time" style="width:100%;background:var(--navy);border:1px solid var(--border);border-radius:5px;padding:.38rem .55rem;color:var(--text);font-size:.8rem;outline:none;" placeholder="Today, 7:30 PM"></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.5rem;">
        <div><label style="font-size:.63rem;color:var(--text-muted);display:block;margin-bottom:.2rem">Away Team</label>
        <input id="ag-away" style="width:100%;background:var(--navy);border:1px solid var(--border);border-radius:5px;padding:.38rem .55rem;color:var(--text);font-size:.8rem;outline:none;" placeholder="Oklahoma City Thunder"></div>
        <div><label style="font-size:.63rem;color:var(--text-muted);display:block;margin-bottom:.2rem">Home Team</label>
        <input id="ag-home" style="width:100%;background:var(--navy);border:1px solid var(--border);border-radius:5px;padding:.38rem .55rem;color:var(--text);font-size:.8rem;outline:none;" placeholder="San Antonio Spurs"></div>
      </div>

<script>
// ── STATE ──
let games = [];
let tickets = [];
let messages = [];
let cartLegs = [];
let cartOpen = false;
let currentSportFilter = 'all';
let adminMode = false;
let currentGradeGameId = null;
let msgUsername = 'Fan_' + Math.floor(Math.random()*9000+1000);

// ── SPORT KEY NUMBERS ──
const KEY_NUMBERS = {
  NFL: [3, 7, 10, 14, 17, 21],
  NBA: [5, 6, 7, 10],
  MLB: [1, 2, 3],
  NHL: [1, 2]
};

// ── ALTERNATE LINE PRICING ENGINE ──
function americanToDecimal(american) {
  if (american > 0) return (american / 100) + 1;
  return (100 / Math.abs(american)) + 1;
}
function decimalToAmerican(decimal) {
  if (decimal >= 2) return Math.round((decimal - 1) * 100);
  return Math.round(-100 / (decimal - 1));
}
function adjustOddsForLine(baseOdds, steps, sport, marketType) {
  // steps: positive = moving line in your favor (easier), negative = harder
  // easier = worse odds, harder = better odds
  const keys = KEY_NUMBERS[sport] || [];
  let decimal = americanToDecimal(baseOdds);
  const baseHouseEdge = marketType === 'spread' ? 0.045 : 0.04;
  const fairDecimal = decimal / (1 + baseHouseEdge);

  // Each step = 0.5 unit movement
  // Base juice movement per step in neutral zone
  const neutralMove = marketType === 'player' ? 0.055 : 0.048;

  let adjustment = 0;
  for (let i = 0; i < Math.abs(steps); i++) {
    // Check if we're near a key number — premium cost
    const keyPremium = keys.some(k => {
      const currentLine = i * 0.5;
      return Math.abs(currentLine - k) < 0.5 || Math.abs(currentLine - k + 0.5) < 0.5;
    }) ? 1.9 : 1.0;
    adjustment += neutralMove * keyPremium;
  }

  let newFair;
  if (steps < 0) {
    // harder line = better odds for bettor
    newFair = fairDecimal + adjustment;
  } else {
    // easier line = worse odds
    newFair = Math.max(1.02, fairDecimal - adjustment);
  }

  const newDecimal = newFair * (1 + baseHouseEdge);
  return decimalToAmerican(newDecimal);
}

function formatOdds(n) {
  return n > 0 ? '+' + n : String(n);
}

// ── PARLAY ODDS CALCULATOR ──
function combinedAmericanOdds(legs) {
  if (!legs.length) return 0;
  let combined = legs.reduce((acc, leg) => acc * americanToDecimal(leg.odds), 1);
  return decimalToAmerican(combined);
}

function calcPayout(stake, americanOdds) {
  const dec = americanToDecimal(americanOdds);
  return ((dec - 1) * stake).toFixed(2);
}

// ── TOAST ──
function toast(msg) {
  const t = document.getElementById('toastEl');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

// ── TABS ──
function switchTab(tab, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.mtab').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + tab).classList.add('active');
  btn.classList.add('active');
  const sf = document.getElementById('sportFilter');
  sf.style.display = tab === 'games' ? 'flex' : 'none';
  const cart = document.getElementById('parlayCart');
  cart.style.display = tab === 'games' ? 'block' : 'none';
  if (tab === 'tickets') renderTickets();
  if (tab === 'admin') renderAdminGrade();
}

function filterSport(sport, btn) {
  currentSportFilter = sport;
  document.querySelectorAll('.sfbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGames();
}

// ── ADMIN MODE ──
function toggleAdminMode() {
  adminMode = !adminMode;
  const btn = document.getElementById('adminToggleBtn');
  btn.classList.toggle('active', adminMode);
  document.querySelectorAll('.admin-only').forEach(el => el.style.display = adminMode ? '' : 'none');
  toast(adminMode ? 'Admin mode on' : 'Admin mode off');
}

// ── ADD GAME ──
function addGame() {
  const sport = document.getElementById('ag-sport').value;
  const time = document.getElementById('ag-time').value.trim() || 'Today, TBD';
  const away = document.getElementById('ag-away').value.trim();
  const home = document.getElementById('ag-home').value.trim();
  const spreadRaw = parseFloat(document.getElementById('ag-spread').value) || 1.5;
  const awayML = parseInt(document.getElementById('ag-away-ml').value) || 110;
  const homeML = parseInt(document.getElementById('ag-home-ml').value) || -130;
  const total = parseFloat(document.getElementById('ag-total').value) || 220;

  if (!away || !home) { toast('Enter both team names.'); return; }

  const id = 'g_' + Date.now();
  const game = {
    id, sport, time, away, home,
    spread: spreadRaw,
    awaySpreadJuice: -110,
    homeSpreadJuice: -110,
    awayML, homeML,
    total,
    overJuice: -110,
    underJuice: -113,
    awayTT: parseFloat((total * 0.46).toFixed(1)),
    homeTT: parseFloat((total * 0.54).toFixed(1)),
    status: 'upcoming', // upcoming | live | final
    awayScore: null,
    homeScore: null,
    props: generateProps(sport, away, home)
  };
  games.push(game);
  saveGames();
  renderGames();
  toast('Game added!');
  ['ag-away','ag-home','ag-time','ag-spread','ag-away-ml','ag-home-ml','ag-total'].forEach(id => document.getElementById(id).value = '');
}

function generateProps(sport, away, home) {
  if (sport === 'NBA') {
    return [
      { player: 'Player A (' + away + ')', stat: 'Points', line: 22.5, juice: -115 },
      { player: 'Player B (' + away + ')', stat: 'Assists', line: 6.5, juice: -110 },
      { player: 'Player C (' + away + ')', stat: 'Rebounds', line: 8.5, juice: -112 },
      { player: 'Player D (' + home + ')', stat: 'Points', line: 26.5, juice: -118 },
      { player: 'Player E (' + home + ')', stat: 'Assists', line: 5.5, juice: -110 },
      { player: 'Player F (' + home + ')', stat: '3-Pointers', line: 2.5, juice: -115 },
    ];
  } else if (sport === 'NFL') {
    return [
      { player: 'QB (' + away + ')', stat: 'Pass Yards', line: 245.5, juice: -112 },
      { player: 'RB (' + away + ')', stat: 'Rush Yards', line: 68.5, juice: -110 },
      { player: 'WR (' + home + ')', stat: 'Rec Yards', line: 72.5, juice: -115 },
      { player: 'QB (' + home + ')', stat: 'Pass TDs', line: 1.5, juice: -118 },
    ];
  } else if (sport === 'MLB') {
    return [
      { player: 'SP (' + away + ')', stat: 'Strikeouts', line: 5.5, juice: -115 },
      { player: 'Batter (' + away + ')', stat: 'Hits', line: 1.5, juice: -130 },
      { player: 'SP (' + home + ')', stat: 'Strikeouts', line: 6.5, juice: -120 },
      { player: 'Batter (' + home + ')', stat: 'Total Bases', line: 1.5, juice: -125 },
    ];
  } else {
    return [
      { player: 'G (' + away + ')', stat: 'Saves', line: 1.5, juice: -115 },
      { player: 'F (' + home + ')', stat: 'Points+Assists', line: 1.5, juice: -110 },
    ];
  }
}

// ── RENDER GAMES ──
function renderGames() {
  const list = document.getElementById('gamesList');
  const filtered = currentSportFilter === 'all' ? games : games.filter(g => g.sport === currentSportFilter);
  if (!filtered.length) {
    list.innerHTML = '<div class="empty-state"><div class="eico">🏆</div><p>No games yet.<br>Use Admin → Grade to add games.</p></div>';
    return;
  }
  list.innerHTML = filtered.map(g => buildGameCard(g)).join('');
}

function buildGameCard(g) {
  const awaySpr = formatOdds(g.spread) + (g.spread > 0 ? '' : '');
  const homeSpr = formatOdds(-g.spread);
  const statusBadge = g.status === 'live' ? '<span class="game-live-badge">LIVE</span>' :
    g.status === 'final' ? '<span style="font-size:.62rem;color:var(--text-muted);background:rgba(107,132,158,.1);border:1px solid var(--border);border-radius:20px;padding:.1rem .4rem;">FINAL</span>' : '';

  return `<div class="game-card" id="gc_${g.id}">
    <div class="game-header">
      <span class="game-time">${g.sport} · ${g.time}</span>
      ${statusBadge}
    </div>
    <div class="odds-header">
      <span class="oh-label">Team</span>
      <span class="oh-label">Spread</span>
      <span class="oh-label">Moneyline</span>
      <span class="oh-label">Total</span>
      <span class="oh-label"></span>
    </div>
    <!-- Away Row -->
    <div class="team-row">
      <span class="team-name">${g.away}</span>
      <button class="odds-btn" id="ob_${g.id}_away_spread" onclick="selectMainOdds('${g.id}','away','spread')">
        <span class="odds-line">${awaySpr}</span>
        <span class="odds-juice">${formatOdds(g.awaySpreadJuice)}</span>
      </button>
      <button class="odds-btn" id="ob_${g.id}_away_ml" onclick="selectMainOdds('${g.id}','away','ml')">
        <span class="odds-line">${formatOdds(g.awayML)}</span>
      </button>
      <button class="odds-btn" id="ob_${g.id}_over" onclick="selectMainOdds('${g.id}','away','over')">
        <span class="odds-line">O ${g.total}</span>
        <span class="odds-juice">${formatOdds(g.overJuice)}</span>
      </button>
      <button class="expand-btn" id="exp_${g.id}" onclick="toggleProps('${g.id}')">›</button>
    </div>
    <!-- Home Row -->
    <div class="team-row">
      <span class="team-name">${g.home}</span>
      <button class="odds-btn" id="ob_${g.id}_home_spread" onclick="selectMainOdds('${g.id}','home','spread')">
        <span class="odds-line">${homeSpr}</span>
        <span class="odds-juice">${formatOdds(g.homeSpreadJuice)}</span>
      </button>
      <button class="odds-btn" id="ob_${g.id}_home_ml" onclick="selectMainOdds('${g.id}','home','ml')">
        <span class="odds-line">${formatOdds(g.homeML)}</span>
      </button>
      <button class="odds-btn" id="ob_${g.id}_under" onclick="selectMainOdds('${g.id}','home','under')">
        <span class="odds-line">U ${g.total}</span>
        <span class="odds-juice">${formatOdds(g.underJuice)}</span>
      </button>
      <div></div>
    </div>
    <!-- PROP BUILDER -->
    <div class="prop-builder" id="pb_${g.id}">
      <div class="prop-tabs">
        <button class="ptab active" onclick="switchPropTab('${g.id}','props',this)">Player Props</button>
        <button class="ptab" onclick="switchPropTab('${g.id}','teamtotals',this)">Team Totals</button>
        <button class="ptab" onclick="switchPropTab('${g.id}','spreads',this)">Alt Spreads</button>
        <button class="ptab" onclick="switchPropTab('${g.id}','altprops',this)">Alt Props</button>
      </div>
      <div class="prop-section active" id="ps_${g.id}_props">${buildPlayerProps(g)}</div>
      <div class="prop-section" id="ps_${g.id}_teamtotals">${buildTeamTotals(g)}</div>
      <div class="prop-section" id="ps_${g.id}_spreads">${buildAltSpreads(g)}</div>
      <div class="prop-section" id="ps_${g.id}_altprops">${buildAltProps(g)}</div>
    </div>
  </div>`;
}

function buildPlayerProps(g) {
  if (!g.props || !g.props.length) return '<p style="color:var(--text-muted);font-size:.78rem;padding:.5rem">No props available.</p>';
  return g.props.map((p, i) => `
    <div class="prop-row">
      <div class="prop-label">${p.player}<span>${p.stat}</span></div>
      <div class="prop-btns">
        <button class="pob" id="pp_${g.id}_${i}_over" onclick="addPropLeg('${g.id}',${i},'over')">
          O ${p.line}<span class="poj">${formatOdds(p.juice)}</span>
        </button>
        <button class="pob" id="pp_${g.id}_${i}_under" onclick="addPropLeg('${g.id}',${i},'under')">
          U ${p.line}<span class="poj">${formatOdds(p.juice)}</span>
        </button>
      </div>
    </div>`).join('');
}

function buildTeamTotals(g) {
  return `
    <div class="prop-group">
      <div class="prop-group-title">${g.away} Team Total</div>
      ${buildTotalSlider(g, 'away_tt', g.away + ' Team Total', g.awayTT, -110, 'total')}
    </div>
    <div class="prop-group">
      <div class="prop-group-title">${g.home} Team Total</div>
      ${buildTotalSlider(g, 'home_tt', g.home + ' Team Total', g.homeTT, -110, 'total')}
    </div>`;
}

function buildAltSpreads(g) {
  return `
    <div class="prop-group">
      <div class="prop-group-title">${g.away} Alternate Spread</div>
      ${buildAltSliderHTML(g.id, 'alt_spread_away', g.away + ' Spread', g.spread, g.awaySpreadJuice, g.sport, 'spread', -6, 6)}
    </div>
    <div class="prop-group">
      <div class="prop-group-title">${g.home} Alternate Spread</div>
      ${buildAltSliderHTML(g.id, 'alt_spread_home', g.home + ' Spread', -g.spread, g.homeSpreadJuice, g.sport, 'spread', -6, 6)}
    </div>`;
}

function buildAltProps(g) {
  if (!g.props || !g.props.length) return '<p style="color:var(--text-muted);font-size:.78rem;padding:.5rem">No props available.</p>';
  return g.props.map((p, i) =>
    `<div class="prop-group">
      <div class="prop-group-title">${p.player} — ${p.stat}</div>
      ${buildAltSliderHTML(g.id, 'alt_prop_' + i, p.player + ' ' + p.stat, p.line, p.juice, g.sport, 'player', -4, 4)}
    </div>`
  ).join('');
}

function buildTotalSlider(g, key, label, baseLine, baseJuice, marketType) {
  return buildAltSliderHTML(g.id, key, label, baseLine, baseJuice, g.sport, marketType, -4, 4);
}

function buildAltSliderHTML(gameId, key, label, baseLine, baseJuice, sport, marketType, minSteps, maxSteps) {
  const sliderId = `sl_${gameId}_${key}`;
  const oddsId = `so_${gameId}_${key}`;
  const lineId = `sline_${gameId}_${key}`;
  const steps = maxSteps - minSteps;
  const midStep = Math.floor(steps / 2);
  // store data attrs for JS
  return `<div class="alt-slider-wrap"
    data-game="${gameId}" data-key="${key}" data-label="${label}"
    data-base-line="${baseLine}" data-base-juice="${baseJuice}"
    data-sport="${sport}" data-market="${marketType}"
    data-min="${minSteps}" data-max="${maxSteps}">
    <div class="alt-slider-header">
      <span class="alt-slider-name">${label}</span>
      <span class="alt-slider-odds" id="${oddsId}">${formatOdds(baseJuice)}</span>
    </div>
    <div class="alt-slider-line" id="${lineId}">Line: ${baseLine > 0 ? '+' : ''}${baseLine}</div>
    <input type="range" id="${sliderId}" min="${minSteps}" max="${maxSteps}" value="0" step="1"
      oninput="onSliderChange('${gameId}','${key}',this.value)">
    <div class="alt-slider-labels">
      <span>Easier (−odds)</span><span>Harder (+odds)</span>
    </div>
    <button class="alt-add-btn" id="sadd_${gameId}_${key}"
      onclick="addAltLeg('${gameId}','${key}')">+ Add to Parlay</button>
  </div>`;
}

function onSliderChange(gameId, key, val) {
  val = parseInt(val);
  const wrap = document.querySelector(`[data-game="${gameId}"][data-key="${key}"]`);
  if (!wrap) return;
  const baseLine = parseFloat(wrap.dataset.baseLine);
  const baseJuice = parseInt(wrap.dataset.baseJuice);
  const sport = wrap.dataset.sport;
  const market = wrap.dataset.market;

  // val negative = easier (line moves in bettor's favor), positive = harder
  const newLine = baseLine - (val * 0.5);
  const newOdds = adjustOddsForLine(baseJuice, val, sport, market);

  document.getElementById(`so_${gameId}_${key}`).textContent = formatOdds(newOdds);
  document.getElementById(`sline_${gameId}_${key}`).textContent = 'Line: ' + (newLine > 0 ? '+' : '') + newLine;
}

function addAltLeg(gameId, key) {
  const wrap = document.querySelector(`[data-game="${gameId}"][data-key="${key}"]`);
  if (!wrap) return;
  const g = games.find(x => x.id === gameId);
  if (!g) return;
  const sliderVal = parseInt(document.getElementById(`sl_${gameId}_${key}`).value);
  const baseLine = parseFloat(wrap.dataset.baseLine);
  const baseJuice = parseInt(wrap.dataset.baseJuice);
  const sport = wrap.dataset.sport;
  const market = wrap.dataset.market;
  const label = wrap.dataset.label;
  const newLine = baseLine - (sliderVal * 0.5);
  const newOdds = adjustOddsForLine(baseJuice, sliderVal, sport, market);

  const legId = `${gameId}_${key}_${sliderVal}`;
  addToCart({
    id: legId,
    gameId,
    game: g.away + ' vs ' + g.home,
    pick: label + ' ' + (newLine > 0 ? '+' : '') + newLine,
    odds: newOdds,
    type: market,
    raw: { gameId, key, line: newLine, sliderVal }
  });
}

// ── PROP LEGS ──
function addPropLeg(gameId, propIdx, side) {
  const g = games.find(x => x.id === gameId);
  if (!g) return;
  const p = g.props[propIdx];
  const legId = `${gameId}_prop_${propIdx}_${side}`;
  const pick = (side === 'over' ? 'O ' : 'U ') + p.line + ' ' + p.player + ' ' + p.stat;

  const btn = document.getElementById(`pp_${g.id}_${propIdx}_${side}`);
  const already = cartLegs.find(l => l.id === legId);
  if (already) {
    removeFromCart(legId);
    if (btn) btn.classList.remove('selected');
    return;
  }
  if (btn) btn.classList.add('selected');
  addToCart({ id: legId, gameId, game: g.away + ' vs ' + g.home, pick, odds: p.juice, type: 'prop' });
}

// ── MAIN CARD SELECTIONS ──
function selectMainOdds(gameId, team, market) {
  const g = games.find(x => x.id === gameId);
  if (!g) return;
  let pick = '', odds = 0;
  const btnId = market === 'over' ? `ob_${gameId}_over` :
                market === 'under' ? `ob_${gameId}_under` :
                `ob_${gameId}_${team}_${market === 'ml' ? 'ml' : 'spread'}`;
  const legId = `${gameId}_${team}_${market}`;

  if (market === 'spread') {
    const spr = team === 'away' ? g.spread : -g.spread;
    const juice = team === 'away' ? g.awaySpreadJuice : g.homeSpreadJuice;
    const teamName = team === 'away' ? g.away : g.home;
    pick = teamName + ' ' + (spr > 0 ? '+' : '') + spr;
    odds = juice;
  } else if (market === 'ml') {
    const teamName = team === 'away' ? g.away : g.home;
    odds = team === 'away' ? g.awayML : g.homeML;
    pick = teamName + ' ML';
  } else if (market === 'over') {
    pick = 'Over ' + g.total;
    odds = g.overJuice;
  } else if (market === 'under') {
    pick = 'Under ' + g.total;
    odds = g.underJuice;
  }

  const btn = document.getElementById(btnId);
  const already = cartLegs.find(l => l.id === legId);
  if (already) {
    removeFromCart(legId);
    if (btn) btn.classList.remove('selected');
    return;
  }
  if (btn) btn.classList.add('selected');
  addToCart({ id: legId, gameId, game: g.away + ' vs ' + g.home, pick, odds, type: market });
}

// ── PROP TAB TOGGLE ──
function toggleProps(gameId) {
  const pb = document.getElementById(`pb_${gameId}`);
  const exp = document.getElementById(`exp_${gameId}`);
  const isOpen = pb.classList.contains('open');
  pb.classList.toggle('open', !isOpen);
  exp.classList.toggle('open', !isOpen);
}

function switchPropTab(gameId, tab, btn) {
  document.querySelectorAll(`#pb_${gameId} .prop-section`).forEach(s => s.classList.remove('active'));
  document.querySelectorAll(`#pb_${gameId} .ptab`).forEach(b => b.classList.remove('active'));
  document.getElementById(`ps_${gameId}_${tab}`).classList.add('active');
  btn.classList.add('active');
}

// ── CART ──
function addToCart(leg) {
  // Remove conflicting legs from same game + same market type
  cartLegs = cartLegs.filter(l => {
    if (l.gameId === leg.gameId && l.type === leg.type && leg.type !== 'prop' && leg.type !== 'player' && leg.type !== 'total') {
      // deselect btn
      const oldBtn = document.getElementById(l.id.replace('_ml','_ml').replace('_spread','_spread'));
      return false;
    }
    return true;
  });
  cartLegs.push(leg);
  updateCartUI();
  toast('Added: ' + leg.pick);
}

function removeFromCart(legId) {
  cartLegs = cartLegs.filter(l => l.id !== legId);
  updateCartUI();
}

function toggleCart() {
  cartOpen = !cartOpen;
  document.getElementById('cartPanel').classList.toggle('open', cartOpen);
  document.getElementById('cartChevron').textContent = cartOpen ? '▼' : '▲';
}

function updateCartUI() {
  const count = cartLegs.length;
  document.getElementById('cartCount').textContent = count;
  const cart = document.getElementById('parlayCart');
  cart.style.display = count > 0 ? 'block' : 'none';
  if (count === 0) { cartOpen = false; document.getElementById('cartPanel').classList.remove('open'); }

  const combined = count > 0 ? combinedAmericanOdds(cartLegs) : 0;
  document.getElementById('cartOddsDisplay').textContent = count > 0 ? formatOdds(combined) : '';
  document.getElementById('cartCombinedOdds').textContent = count > 0 ? formatOdds(combined) : '—';

  const legsEl = document.getElementById('cartLegs');
  if (!count) { legsEl.innerHTML = '<div class="cart-empty">No legs added yet.</div>'; }
  else {
    legsEl.innerHTML = cartLegs.map(l => `
      <div class="cart-leg">
        <div class="cart-leg-info">
          <div class="cart-leg-game">${l.game}</div>
          <div class="cart-leg-pick">${l.pick}</div>
        </div>
        <span class="cart-leg-odds">${formatOdds(l.odds)}</span>
        <button class="cart-remove" onclick="removeFromCart('${l.id}')">✕</button>
      </div>`).join('');
  }
  updateCartPayout();
}

function updateCartPayout() {
  const stake = parseFloat(document.getElementById('cartStake').value) || 0;
  const combined = cartLegs.length > 0 ? combinedAmericanOdds(cartLegs) : 0;
  const payout = stake > 0 && combined !== 0 ? calcPayout(stake, combined) : '—';
  document.getElementById('cartPayout').textContent = payout !== '—' ? '$' + payout : '—';
}

// ── SUBMIT PARLAY ──
function submitParlay() {
  if (!cartLegs.length) { toast('Add at least one leg.'); return; }
  const stake = parseFloat(document.getElementById('cartStake').value) || 0;
  if (!stake) { toast('Enter a stake amount.'); return; }
  const combined = combinedAmericanOdds(cartLegs);
  const payout = calcPayout(stake, combined);
  const ticket = {
    id: 'TKT-' + Date.now(),
    date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
    legs: cartLegs.map(l => ({ ...l, result: 'pending' })),
    combined,
    stake,
    payout: parseFloat(payout),
    result: 'pending'
  };
  tickets.unshift(ticket);
  saveTickets();
  showSlip(ticket);
  // clear cart
  cartLegs = [];
  updateCartUI();
  document.getElementById('cartStake').value = '';
  // deselect all buttons
  document.querySelectorAll('.odds-btn.selected,.pob.selected').forEach(b => b.classList.remove('selected'));
}

// ── BET SLIP ──
function showSlip(ticket) {
  document.getElementById('slipTitle').textContent = ticket.legs.length === 1 ? 'Single Bet' : ticket.legs.length + '-Leg Parlay';
  document.getElementById('slipSubtitle').textContent = ticket.id + ' · ' + ticket.date;
  document.getElementById('slipLegs').innerHTML = ticket.legs.map(l => `
    <div class="slip-leg">
      <div><div class="sl-pick">${l.pick}</div><div class="sl-game">${l.game}</div></div>
      <span class="sl-odds">${formatOdds(l.odds)}</span>
    </div>`).join('');
  document.getElementById('slipSummary').innerHTML = `
    <div class="slip-row"><span class="label">Combined Odds</span><span class="val">${formatOdds(ticket.combined)}</span></div>
    <div class="slip-row"><span class="label">Stake</span><span class="val">$${ticket.stake.toFixed(2)}</span></div>
    <div class="slip-row payout"><span class="label">To Win</span><span class="val">$${ticket.payout.toFixed(2)}</span></div>`;
  document.getElementById('slipOverlay').classList.add('open');
}

function closeSlip() { document.getElementById('slipOverlay').classList.remove('open'); }

function copyTicket() {
  const t = tickets[0];
  if (!t) return;
  const lines = [
    'IronSilk SportsHub — ' + t.id,
    t.date,
    '---',
    ...t.legs.map(l => l.pick + ' ' + formatOdds(l.odds) + ' (' + l.game + ')'),
    '---',
    'Combined: ' + formatOdds(t.combined),
    'Stake: $' + t.stake.toFixed(2),
    'To Win: $' + t.payout.toFixed(2)
  ];
  navigator.clipboard.writeText(lines.join('\n')).then(() => toast('Ticket copied!')).catch(() => toast('Copy failed.'));
}

// ── TICKETS ──
function renderTickets() {
  const el = document.getElementById('ticketsList');
  if (!tickets.length) {
    el.innerHTML = '<div class="empty-state"><div class="eico">🎟</div><p>No tickets yet.<br>Build a parlay in the Games tab.</p></div>';
    return;
  }
  el.innerHTML = tickets.map(t => {
    const resClass = t.result === 'pending' ? 'pending' : t.result;
    const resLabel = t.result === 'pending' ? '⏳ Pending' : t.result === 'win' ? '✓ WIN' : t.result === 'loss' ? '✗ LOSS' : '↔ PUSH';
    return `<div class="ticket-card">
      <div class="ticket-header">
        <span class="ticket-id">${t.id}</span>
        <span class="ticket-result ${resClass}">${resLabel}</span>
        <span class="ticket-date">${t.date}</span>
      </div>
      <div class="ticket-legs">
        ${t.legs.map(l => {
          const lr = l.result || 'pending';
          const lrLabel = lr === 'pending' ? '' : lr === 'win' ? 'WIN' : lr === 'loss' ? 'LOSS' : 'PUSH';
          return `<div class="ticket-leg">
            <div><div class="tl-pick">${l.pick}</div><div class="tl-game">${l.game}</div></div>
            <div style="display:flex;gap:.35rem;align-items:center">
              <span class="tl-odds">${formatOdds(l.odds)}</span>
              ${lr !== 'pending' ? `<span class="tl-result ${lr}">${lrLabel}</span>` : ''}
            </div>
          </div>`;
        }).join('')}
      </div>
      <div class="ticket-footer">
        <span class="tf-item">Odds: <strong>${formatOdds(t.combined)}</strong></span>
        <span class="tf-item">Stake: <strong>$${t.stake.toFixed(2)}</strong></span>
        <span class="tf-item payout">To Win: <strong>$${t.payout.toFixed(2)}</strong></span>
        <div class="ticket-actions">
          <button class="tact-btn" onclick="reshowSlip('${t.id}')">🧾 Slip</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function reshowSlip(id) {
  const t = tickets.find(x => x.id === id);
  if (t) showSlip(t);
}

// ── GRADING ──
function renderAdminGrade() {
  const el = document.getElementById('gradeGamesList');
  if (!games.length) { el.innerHTML = '<p style="color:var(--text-muted);font-size:.8rem">No games added yet.</p>'; return; }
  el.innerHTML = games.map(g => `
    <div class="grade-game">
      <div class="grade-game-name">${g.away} vs ${g.home} · ${g.sport} · ${g.time}</div>
      <div style="font-size:.7rem;color:var(--text-muted);margin-bottom:.5rem">
        Status: <strong style="color:${g.status==='final'?'var(--text-muted)':g.status==='live'?'#f87171':'var(--gold)'}">${g.status.toUpperCase()}</strong>
        ${g.status==='final'?` · ${g.away} ${g.awayScore} – ${g.homeScore} ${g.home}`:''}
      </div>
      <div style="display:flex;gap:.4rem;flex-wrap:wrap">
        <button class="tact-btn" onclick="setGameStatus('${g.id}','live')">▶ Set Live</button>
        <button class="tact-btn" onclick="openGradeModal('${g.id}')">📋 Grade Final</button>
        <button class="tact-btn" style="color:var(--red);border-color:rgba(239,68,68,.3)" onclick="deleteGame('${g.id}')">✕ Remove</button>
      </div>
    </div>`).join('');
}

function setGameStatus(gameId, status) {
  const g = games.find(x => x.id === gameId);
  if (!g) return;
  g.status = status;
  saveGames();
  renderGames();
  renderAdminGrade();
  toast('Game set to ' + status);
}

function openGradeModal(gameId) {
  currentGradeGameId = gameId;
  const g = games.find(x => x.id === gameId);
  if (!g) return;
  document.getElementById('gradeBody').innerHTML = `
    <p style="font-size:.8rem;color:var(--text-muted);margin-bottom:.9rem">${g.away} vs ${g.home}</p>
    <div class="score-inputs">
      <div class="score-input-wrap">
        <label>${g.away}</label>
        <input class="score-input" id="gs_away" type="number" placeholder="0" value="${g.awayScore||''}">
      </div>
      <div class="score-input-wrap">
        <label>${g.home}</label>
        <input class="score-input" id="gs_home" type="number" placeholder="0" value="${g.homeScore||''}">
      </div>
    </div>
    <button class="grade-btn" onclick="submitGrade()">Grade & Settle Tickets</button>`;
  document.getElementById('gradeOverlay').classList.add('open');
}

function closeGrade() { document.getElementById('gradeOverlay').classList.remove('open'); }

function submitGrade() {
  const g = games.find(x => x.id === currentGradeGameId);
  if (!g) return;
  const awayScore = parseFloat(document.getElementById('gs_away').value);
  const homeScore = parseFloat(document.getElementById('gs_home').value);
  if (isNaN(awayScore) || isNaN(homeScore)) { toast('Enter both scores.'); return; }

  g.awayScore = awayScore;
  g.homeScore = homeScore;
  g.status = 'final';

  const totalScore = awayScore + homeScore;
  const margin = awayScore - homeScore; // positive = away wins

  // Grade all tickets
  tickets.forEach(t => {
    if (t.result !== 'pending') return;
    let allWin = true, anyLoss = false, anyPush = false;
    t.legs.forEach(l => {
      if (l.gameId !== g.id) return;
      if (l.result !== 'pending') return;
      let res = gradeLeg(l, g, margin, totalScore, awayScore, homeScore);
      l.result = res;
      if (res === 'loss') anyLoss = true;
      else if (res === 'push') anyPush = true;
      else if (res !== 'win') allWin = false;
    });
    // re-evaluate ticket result
    const allLegsGraded = t.legs.every(l => l.result !== 'pending');
    if (allLegsGraded) {
      const hasLoss = t.legs.some(l => l.result === 'loss');
      const hasPush = t.legs.some(l => l.result === 'push');
      const allW = t.legs.every(l => l.result === 'win');
      t.result = hasLoss ? 'loss' : allW ? 'win' : 'push';
    }
  });

  saveGames();
  saveTickets();
  closeGrade();
  renderGames();
  renderAdminGrade();
  toast('Game graded. Tickets settled!');
}

function gradeLeg(leg, g, margin, totalScore, awayScore, homeScore) {
  const t = leg.type;
  const pick = leg.pick;

  if (t === 'spread') {
    // Extract spread from pick label e.g. "Thunder +1.5"
    const spreadMatch = pick.match(/([+-]?\d+\.?\d*)\s*$/);
    if (!spreadMatch) return 'pending';
    const spread = parseFloat(spreadMatch[1]);
    const isAway = pick.includes(g.away);
    const coveredMargin = isAway ? awayScore - homeScore + spread : homeScore - awayScore + spread;
    if (coveredMargin > 0) return 'win';
    if (coveredMargin < 0) return 'loss';
    return 'push';
  }
  if (t === 'ml') {
    const isAway = pick.includes(g.away);
    if (margin === 0) return 'push';
    return (isAway && margin > 0) || (!isAway && margin < 0) ? 'win' : 'loss';
  }
  if (t === 'over') {
    const lineMatch = pick.match(/Over\s+([\d.]+)/);
    if (!lineMatch) return 'pending';
    const line = parseFloat(lineMatch[1]);
    if (totalScore > line) return 'win';
    if (totalScore < line) return 'loss';
    return 'push';
  }
  if (t === 'under') {
    const lineMatch = pick.match(/Under\s+([\d.]+)/);
    if (!lineMatch) return 'pending';
    const line = parseFloat(lineMatch[1]);
    if (totalScore < line) return 'win';
    if (totalScore > line) return 'loss';
    return 'push';
  }
  // For props/alt lines — mark as pending (manual grade needed per player)
  return 'pending';
}

function deleteGame(gameId) {
  if (!confirm('Remove this game?')) return;
  games = games.filter(g => g.id !== gameId);
  saveGames();
  renderGames();
  renderAdminGrade();
  toast('Game removed.');
}

// ── MESSAGES ──
function sendMsg() {
  const input = document.getElementById('msgInput');
  const txt = input.value.trim();
  if (!txt) return;
  messages.push({ author: msgUsername, text: txt, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), me: true });
  input.value = '';
  renderMessages();
  saveMsgs();
}

function renderMessages() {
  const el = document.getElementById('msgList');
  if (!messages.length) {
    el.innerHTML = '<div class="empty-state"><div class="eico">💬</div><p>No messages yet.<br>Start the conversation.</p></div>';
    return;
  }
  el.innerHTML = messages.map(m => `
    <div class="msg-bubble ${m.me ? 'me' : 'other'}">
      ${!m.me ? `<div class="msg-author">${m.author}</div>` : ''}
      ${m.text}
      <div class="msg-time">${m.time}</div>
    </div>`).join('');
  el.scrollTop = el.scrollHeight;
}

// ── PERSISTENCE ──
function saveGames() { try { localStorage.setItem('sh_games', JSON.stringify(games)); } catch(e){} }
function saveTickets() { try { localStorage.setItem('sh_tickets', JSON.stringify(tickets)); } catch(e){} }
function saveMsgs() { try { localStorage.setItem('sh_msgs', JSON.stringify(messages.slice(-100))); } catch(e){} }
function loadAll() {
  try { const g = localStorage.getItem('sh_games'); if (g) games = JSON.parse(g); } catch(e){}
  try { const t = localStorage.getItem('sh_tickets'); if (t) tickets = JSON.parse(t); } catch(e){}
  try { const m = localStorage.getItem('sh_msgs'); if (m) messages = JSON.parse(m); } catch(e){}
}

// ── INIT ──
loadAll();
renderGames();
renderMessages();
</script>
